<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Simulacro 30·90</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Didact+Gothic&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Diseño: blanco y negro de alto contraste con un acento "chicle" (magenta). Tipografía geométrica (Century Gothic),
   tarjetas limpias, animaciones cortas al cambiar de pantalla y al responder. */
:root {
  --paper: #ffffff; --card: #ffffff; --surface: #f4f4f6; --ink: #0b0b0f; --muted: #5e5e6a; --rule: #e3e3e8; --grid: #ececf0;
  --accent: #d1006b; --accent-ink: #ffffff; --accent-soft: #fde6f1; --mark: #ff9ccb;
  --ok: #0d7a3c; --ok-bg: #e2f6e9; --bad: #c0172b; --bad-bg: #fde8eb; --flag: #a35400;
  --shadow: 0 1px 0 rgb(0 0 0 / .03), 0 10px 30px -18px rgb(0 0 0 / .35);
  --shadow-hi: 0 2px 0 rgb(0 0 0 / .04), 0 18px 40px -20px rgb(209 0 107 / .45);
  --font-body: "Century Gothic", CenturyGothic, "Didact Gothic", AppleGothic, "Avenir Next", system-ui, sans-serif;
  --font-display: var(--font-body);
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --r: 14px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #000000; --card: #0d0d10; --surface: #17171c; --ink: #f6f6f8; --muted: #a3a3ae; --rule: #26262e; --grid: #121216;
  --accent: #ff4fa3; --accent-ink: #160009; --accent-soft: #2a0c1b; --mark: #7d1f52;
  --ok: #4ade80; --ok-bg: #0d2817; --bad: #ff6b7e; --bad-bg: #2d0e14; --flag: #fbbf24;
  --shadow: 0 0 0 1px rgb(255 255 255 / .02), 0 14px 34px -22px rgb(0 0 0 / .9);
  --shadow-hi: 0 0 0 1px rgb(255 79 163 / .35), 0 18px 44px -20px rgb(255 79 163 / .45);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #000000; --card: #0d0d10; --surface: #17171c; --ink: #f6f6f8; --muted: #a3a3ae; --rule: #26262e; --grid: #121216;
    --accent: #ff4fa3; --accent-ink: #160009; --accent-soft: #2a0c1b; --mark: #7d1f52;
    --ok: #4ade80; --ok-bg: #0d2817; --bad: #ff6b7e; --bad-bg: #2d0e14; --flag: #fbbf24;
    --shadow: 0 0 0 1px rgb(255 255 255 / .02), 0 14px 34px -22px rgb(0 0 0 / .9);
    --shadow-hi: 0 0 0 1px rgb(255 79 163 / .35), 0 18px 44px -20px rgb(255 79 163 / .45);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px); background-size: 22px 22px;
  transition: background-color .35s var(--ease), color .35s var(--ease);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.wrap { max-width: 900px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.12; letter-spacing: -0.01em; }
h1 { font-size: clamp(2.3rem, 7vw, 3.6rem); font-weight: 700; letter-spacing: -0.035em; }
h2 { font-size: 1.32rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: .9em; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { border: 1.5px solid var(--ink); background: var(--card); border-radius: 999px; padding: 10px 18px; font-weight: 700; letter-spacing: .01em;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center; text-decoration: none; color: var(--ink);
  transition: transform .18s var(--ease), box-shadow .18s var(--ease), background-color .2s, border-color .2s, color .2s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { box-shadow: var(--shadow-hi); }
.btn.ghost { border-color: var(--rule); }
.btn.ghost:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.mini { padding: 3px 10px; font-size: 0.78rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { justify-content: space-between; }
select { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--rule); background: var(--card); color: var(--ink); transition: border-color .2s; }
select:hover { border-color: var(--ink); }

/* Cabecera y controles (idioma, idioma de las preguntas, tema) */
.top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
.brand .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); box-shadow: inset -5px -5px 0 rgb(0 0 0 / .14); flex: none; }
.controls { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; align-items: center; border: 1.5px solid var(--rule); border-radius: 999px; padding: 3px; background: var(--card); }
.seg .lbl { font-size: .72rem; color: var(--muted); padding: 0 6px 0 8px; font-weight: 700; letter-spacing: .04em; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; font-family: var(--font-mono); font-size: 0.78rem; font-weight: 600; color: var(--muted);
  transition: background-color .25s var(--ease), color .25s var(--ease); }
.seg button.on { background: var(--ink); color: var(--paper); }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--card); display: grid; place-items: center; padding: 0;
  transition: transform .3s var(--ease), border-color .2s; }
.iconbtn:hover { border-color: var(--ink); transform: rotate(-18deg); }
.iconbtn svg { width: 20px; height: 20px; }

/* Portada */
.hero { display: grid; gap: 12px; position: relative; isolation: isolate; padding-block: 18px 6px; }
.hero::after { content: ""; position: absolute; z-index: -1; right: -40px; top: -30px; width: min(320px, 60vw); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 62%); filter: blur(6px); opacity: .55; }
.hero h1 .acc { color: var(--accent); }
.hero p { max-width: 62ch; }
.count { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: baseline; gap: 8px; border: 1.5px solid var(--rule); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: .9rem; }
.chip strong { font-family: var(--font-mono); font-size: 1.05rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.section-h { display: grid; gap: 6px; margin-top: 10px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.mode { background: var(--card); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 20px; display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow);
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; min-width: 0; }
.mode:hover { transform: translateY(-3px); border-color: var(--ink); }
.mode .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.mode .ico svg { width: 24px; height: 24px; }
.mode .meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mode .btn { justify-self: start; }
.mode.featured { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.mode.featured .meta { color: color-mix(in srgb, var(--paper) 70%, var(--ink)); }
.mode.featured .ico { background: color-mix(in srgb, var(--accent) 25%, var(--ink)); }
.mode.featured .btn:not(.primary) { background: transparent; color: var(--paper); border-color: color-mix(in srgb, var(--paper) 45%, var(--ink)); }
.mode.featured select { background: var(--ink); color: var(--paper); }
.mode.guide { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #6d00ff)); color: #fff; border-color: transparent; }
.mode.guide .meta { color: rgb(255 255 255 / .8); }
.mode.guide .ico { background: rgb(255 255 255 / .18); color: #fff; }
.mode.guide .btn { background: #fff; color: #111; border-color: #fff; }
.qlang-note .seg button { font-family: var(--font-body); font-size: .82rem; }
.qlang-note { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--card); border: 1.5px dashed var(--rule); border-radius: var(--r); padding: 12px 16px; }
.sample { background: var(--card); border: 1.5px dashed var(--rule); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; }
.history { display: grid; gap: 6px; font-family: var(--font-mono); font-size: 0.84rem; }
.history div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--rule); padding-block: 5px; font-variant-numeric: tabular-nums; }

/* Barra del examen */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1.5px solid var(--rule); }
.bar .in { max-width: 900px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.pbar { height: 3px; background: transparent; }
.pbar span { display: block; height: 100%; background: var(--accent); transition: width .4s var(--ease); }
.timer { font-family: var(--font-mono); font-weight: 600; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); animation: pulse 1s ease-in-out infinite; }
.progress { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Pregunta */
.qcard { background: var(--card); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 22px; display: grid; gap: 16px; min-width: 0; box-shadow: var(--shadow); }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: .07em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.prompt { font-size: 1.12rem; line-height: 1.5; }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.88rem; line-height: 1.5; }
pre.big { font-size: 1.25rem; }
.seq { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seq .cell, .opt .cell { width: 78px; height: 78px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--card); display: grid; place-items: center; }
.seq .cell.q { font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: var(--accent); border-style: dashed; border-color: var(--accent); }
.fig { width: 100%; height: 100%; display: block; color: var(--ink); }
.fig .pp { fill: var(--card); }
.fig .qmark { fill: var(--accent); font-family: var(--font-display); font-weight: 700; }
.matrix { width: min(100%, 300px); }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.options.visual { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.opt { border: 1.5px solid var(--rule); background: var(--card); border-radius: 12px; padding: 12px 14px; text-align: left; display: flex; gap: 12px; align-items: center; min-width: 0;
  transition: border-color .18s, background-color .18s, transform .18s var(--ease), box-shadow .18s; }
.opt:hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: var(--shadow); }
.opt:active { transform: scale(.98); }
.options.visual .opt { flex-direction: column; padding: 8px 4px; }
.opt .k { font-family: var(--font-mono); font-weight: 600; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; flex: none; font-size: 0.82rem;
  transition: background-color .18s, color .18s; }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); animation: pop .28s var(--ease); }
.opt.sel .k { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); animation: pop .32s var(--ease); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .38s var(--ease); }
.nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.palette button { border: 1.5px solid var(--rule); background: var(--card); border-radius: 10px; padding: 6px 0; font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums;
  transition: background-color .2s, color .2s, transform .15s var(--ease); }
.palette button:hover { transform: translateY(-1px); border-color: var(--ink); }
.palette button.done { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.palette button.cur { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.palette button.flagged { border-color: var(--flag); box-shadow: inset 0 -3px 0 var(--flag); }
.feedback { border-left: 4px solid var(--ok); background: var(--ok-bg); padding: 12px 14px; border-radius: 0 12px 12px 0; animation: slidein .3s var(--ease); }
.feedback.bad { border-color: var(--bad); background: var(--bad-bg); }

/* Resultados */
.score { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: center; }
.ring { width: 132px; height: 132px; flex: none; }
.ring circle { fill: none; stroke-width: 12; }
.ring .bg { stroke: var(--grid); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; animation: ring 1.1s var(--ease) both; }
.ring text { fill: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 26px; text-anchor: middle; dominant-baseline: central; }
.score .big { font-family: var(--font-display); font-weight: 700; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.topics { display: grid; gap: 10px; }
.topics .t { display: grid; grid-template-columns: minmax(110px, 160px) 1fr auto; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.meter { height: 10px; background: var(--grid); border-radius: 999px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transform-origin: left; animation: grow .9s var(--ease) both; }
.review { display: grid; gap: 12px; }
.review details { background: var(--card); border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.review summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.review .ans { font-family: var(--font-mono); font-size: 0.84rem; }
.pill { font-family: var(--font-mono); font-size: 0.72rem; padding: 2px 9px; border-radius: 999px; flex: none; font-weight: 600; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.no { background: var(--bad-bg); color: var(--bad); }
.note { font-size: 0.84rem; color: var(--muted); max-width: 72ch; }
.trbtn { justify-self: start; font-size: 0.88rem; padding: 7px 14px; }
.tr { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; border-radius: 0 12px 12px 0; display: grid; gap: 6px; animation: slidein .28s var(--ease); }
.tropts { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 2px; }
details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "›"; display: inline-block; margin-right: 8px; transition: transform .2s var(--ease); font-weight: 700; color: var(--accent); }
details[open] > summary::before { transform: rotate(90deg); }
.review summary::before { margin-right: 0; }

/* Laboratorio de código */
#lsel { width: 100%; flex: 1; min-width: 0; text-overflow: ellipsis; }
.pytabs { justify-self: start; }
.edcard { background: var(--card); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; min-width: 0; box-shadow: var(--shadow); }
.editor { width: 100%; min-height: 230px; resize: vertical; font-family: var(--font-mono); font-size: 16px; line-height: 1.55; tab-size: 4;
  background: var(--surface); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: 14px; white-space: pre; overflow: auto; transition: border-color .2s; }
.editor:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.schema, .sol, .exp { background: var(--card); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 12px 16px; min-width: 0; }
.schema summary, .sol summary, .exp summary { cursor: pointer; font-weight: 700; }
#schema { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 10px; }
.tbl { border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; min-width: 0; }
.tbl .cols { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--font-mono); font-size: 0.76rem; }
.tbl .cols span { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 0 6px; }
#lab-out { display: grid; gap: 10px; min-width: 0; }
#lab-out:empty { display: none; }
#lab-out > * { animation: slidein .3s var(--ease) both; }
.rtable { overflow: auto; max-height: 380px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--card); }
.rtable table { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; min-width: 100%; }
.rtable th { position: sticky; top: 0; background: var(--surface); text-align: left; border-bottom: 1.5px solid var(--rule); padding: 7px 10px; white-space: nowrap; }
.rtable td { border-bottom: 1px solid var(--grid); padding: 5px 10px; white-space: nowrap; }
.rtable tr:hover td { background: var(--accent-soft); }
.rtable td.num { text-align: right; }
.rtable td.null { color: var(--muted); font-style: italic; }
.sub { font-size: 0.95rem; }
pre.doc { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 0.88rem; line-height: 1.55; }
.cases { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cases li { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 7px 12px; overflow-wrap: anywhere; font-size: 0.92rem; animation: slidein .3s var(--ease) both; }
.cases li:nth-child(2) { animation-delay: 40ms; } .cases li:nth-child(3) { animation-delay: 80ms; } .cases li:nth-child(4) { animation-delay: 120ms; }
.cases li:nth-child(n+5) { animation-delay: 160ms; }
.cases li.no { border-color: var(--bad); }
.cases code { font-size: 0.84rem; }
.cases .err { color: var(--bad); }
.feedback code, .tr code, .prompt code, .sol p code { overflow-wrap: anywhere; }
.feedback a { color: inherit; }

/* Animaciones: entrada de pantalla escalonada, respuesta seleccionada, error, barras */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes slidein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.035); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes pulse { 50% { opacity: .55; } }
@keyframes ring { from { stroke-dashoffset: var(--len); } }
@keyframes float { 50% { transform: translate(-14px, 12px) scale(1.06); } }
.anim .wrap > * { animation: rise .45s var(--ease) backwards; }
.anim .wrap > *:nth-child(2) { animation-delay: 50ms; } .anim .wrap > *:nth-child(3) { animation-delay: 100ms; }
.anim .wrap > *:nth-child(4) { animation-delay: 150ms; } .anim .wrap > *:nth-child(5) { animation-delay: 200ms; }
.anim .wrap > *:nth-child(n+6) { animation-delay: 240ms; }
.anim .modes > * { animation: rise .5s var(--ease) backwards; }
.anim .modes > *:nth-child(2) { animation-delay: 90ms; } .anim .modes > *:nth-child(3) { animation-delay: 180ms; } .anim .modes > *:nth-child(4) { animation-delay: 270ms; }
.hero::after { animation: float 9s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (max-width: 560px) {

  .bar .ltitle, .bar .btitle { display: none; }

  .ring { width: 104px; height: 104px; }
}

<script type="application/json" id="lab-data">{"sql":{"schema":"-- Practice database: online store (retail/marketing analytics style).\n-- Base de datos de práctica: tienda en línea (estilo retail/marketing analytics).\n-- SQLite 3.25+ (window functions / funciones de ventana). Create / Crear: python3 setup_db.py\n\nDROP TABLE IF EXISTS order_items;\nDROP TABLE IF EXISTS orders;\nDROP TABLE IF EXISTS products;\nDROP TABLE IF EXISTS customers;\nDROP TABLE IF EXISTS employees;\n\nCREATE TABLE customers (\n    customer_id  INTEGER PRIMARY KEY,\n    name         TEXT    NOT NULL,\n    email        TEXT    UNIQUE,\n    city         TEXT,                 -- may be NULL on purpose / puede ser NULL a propósito\n    country      TEXT    NOT NULL,\n    segment      TEXT    NOT NULL,     -- 'Consumer', 'Corporate', 'Small Business'\n    signup_date  DATE    NOT NULL\n);\n\nCREATE TABLE products (\n    product_id   INTEGER PRIMARY KEY,\n    name         TEXT    NOT NULL,\n    category     TEXT    NOT NULL,\n    price        REAL    NOT NULL CHECK (price > 0)\n);\n\nCREATE TABLE orders (\n    order_id     INTEGER PRIMARY KEY,\n    customer_id  INTEGER NOT NULL REFERENCES customers(customer_id),\n    order_date   DATE    NOT NULL,\n    status       TEXT    NOT NULL      -- 'delivered', 'shipped', 'cancelled'\n);\n\nCREATE TABLE order_items (\n    order_id     INTEGER NOT NULL REFERENCES orders(order_id),\n    product_id   INTEGER NOT NULL REFERENCES products(product_id),\n    quantity     INTEGER NOT NULL CHECK (quantity > 0),\n    unit_price   REAL    NOT NULL,\n    PRIMARY KEY (order_id, product_id)\n);\n\nCREATE TABLE employees (\n    emp_id       INTEGER PRIMARY KEY,\n    name         TEXT    NOT NULL,\n    department   TEXT    NOT NULL,\n    salary       INTEGER NOT NULL,\n    manager_id   INTEGER REFERENCES employees(emp_id),  -- NULL = no manager (CEO) / no tiene jefe\n    hire_date    DATE    NOT NULL\n);\n\nINSERT INTO customers VALUES\n (1,  'Ana Gómez',       'ana@mail.com',     'Bogotá',       'Colombia', 'Consumer',       '2024-01-15'),\n (2,  'Luis Pérez',      'luis@mail.com',    'Medellín',     'Colombia', 'Corporate',      '2024-02-03'),\n (3,  'María Ruiz',      'maria@mail.com',   'Cali',         'Colombia', 'Consumer',       '2024-02-20'),\n (4,  'John Smith',      'john@mail.com',    'Miami',        'USA',      'Small Business', '2024-03-11'),\n (5,  'Sofía Torres',    'sofia@mail.com',   'Bogotá',       'Colombia', 'Corporate',      '2024-03-25'),\n (6,  'Carlos Díaz',     'carlos@mail.com',  NULL,           'Colombia', 'Consumer',       '2024-04-02'),\n (7,  'Emily Brown',     'emily@mail.com',   'New York',     'USA',      'Consumer',       '2024-04-18'),\n (8,  'Pedro Castro',    'pedro@mail.com',   'Barranquilla', 'Colombia', 'Small Business', '2024-05-07'),\n (9,  'Laura Moreno',    'laura@mail.com',   'Lima',         'Peru',     'Consumer',       '2024-05-30'),\n (10, 'Diego Vargas',    NULL,               'Medellín',     'Colombia', 'Consumer',       '2024-06-12');\n\nINSERT INTO products VALUES\n (1, 'Laptop Pro 14',     'Electronics', 1200.00),\n (2, 'Wireless Mouse',    'Electronics',   25.00),\n (3, 'USB-C Hub',         'Electronics',   45.00),\n (4, 'Office Chair',      'Furniture',    180.00),\n (5, 'Standing Desk',     'Furniture',    350.00),\n (6, 'Notebook A5',       'Stationery',     4.50),\n (7, 'Gel Pens (x10)',    'Stationery',     8.00),\n (8, 'Monitor 27\"',       'Electronics',  300.00),\n (9, 'Desk Lamp',         'Furniture',     40.00);   -- product 9: never sold / nunca vendido\n\nINSERT INTO orders VALUES\n (101, 1, '2024-02-01', 'delivered'),\n (102, 2, '2024-02-14', 'delivered'),\n (103, 1, '2024-03-05', 'delivered'),\n (104, 3, '2024-03-18', 'cancelled'),\n (105, 4, '2024-04-02', 'delivered'),\n (106, 5, '2024-04-10', 'delivered'),\n (107, 2, '2024-04-22', 'shipped'),\n (108, 7, '2024-05-01', 'delivered'),\n (109, 1, '2024-05-15', 'delivered'),\n (110, 8, '2024-05-20', 'delivered'),\n (111, 5, '2024-06-03', 'delivered'),\n (112, 9, '2024-06-15', 'cancelled'),\n (113, 4, '2024-06-28', 'delivered'),\n (114, 2, '2024-07-04', 'delivered'),\n (115, 10,'2024-07-19', 'shipped');\n-- Customer 6 (Carlos) never bought anything / nunca ha comprado.\n\nINSERT INTO order_items VALUES\n (101, 1, 1, 1200.00),\n (101, 2, 2,   25.00),\n (102, 4, 3,  180.00),\n (102, 6, 10,   4.50),\n (103, 3, 1,   45.00),\n (104, 5, 1,  350.00),\n (105, 8, 2,  300.00),\n (105, 2, 2,   25.00),\n (106, 1, 2, 1150.00),   -- discounted price / precio con descuento\n (106, 5, 1,  350.00),\n (107, 7, 5,    8.00),\n (108, 6, 3,    4.50),\n (108, 7, 2,    8.00),\n (109, 8, 1,  300.00),\n (110, 4, 1,  180.00),\n (110, 3, 2,   45.00),\n (111, 2, 4,   25.00),\n (112, 1, 1, 1200.00),\n (113, 5, 2,  350.00),\n (114, 1, 1, 1200.00),\n (114, 8, 2,  290.00),\n (115, 6, 20,   4.50);\n\nINSERT INTO employees VALUES\n (1,  'Valentina Ríos',  'Executive',   25000, NULL, '2019-01-10'),\n (2,  'Andrés López',    'Data',        14000, 1,    '2020-03-01'),\n (3,  'Camila Herrera',  'Data',         9000, 2,    '2021-06-15'),\n (4,  'Julián Mejía',    'Data',         9000, 2,    '2022-01-20'),\n (5,  'Paula Ortiz',     'Data',         7000, 2,    '2023-08-01'),\n (6,  'Felipe Rojas',    'Engineering', 13000, 1,    '2020-05-12'),\n (7,  'Natalia Cruz',    'Engineering', 10000, 6,    '2021-09-30'),\n (8,  'Santiago Gil',    'Engineering',  8000, 6,    '2023-02-14'),\n (9,  'Isabel Suárez',   'Marketing',    9500, 1,    '2021-11-08'),\n (10, 'Mateo Ramírez',   'Marketing',    6000, 9,    '2024-04-01'),\n (11, 'Daniel Pardo',    'Engineering', 11000, 7,    '2022-07-01');  -- earns more than his manager (Natalia) / gana más que su jefa\n","items":[{"id":"1","n":1,"part":1,"parts":1,"level":"basic","title":{"en":"Filter and sort","es":"Filtrar y ordenar"},"q":"Write a query that returns the name and price of all products in the `Electronics` category, sorted from the most expensive to the cheapest.","es":"Escribe una consulta que devuelva el nombre y el precio de todos los productos de la categoría `Electronics`, ordenados del más caro al más barato.","ordered":true,"flexCols":false,"sql":{"en":"SELECT name, price\nFROM products\nWHERE category = 'Electronics'\nORDER BY price DESC;","es":"SELECT name, price\nFROM products\nWHERE category = 'Electronics'\nORDER BY price DESC;"},"note":{"en":"","es":""}},{"id":"2","n":2,"part":1,"parts":1,"level":"basic","title":{"en":"Multiple conditions","es":"Varias condiciones"},"q":"List the name, city and signup date of customers from Colombia who signed up on or after March 1st, 2024.","es":"Lista el nombre, la ciudad y la fecha de registro de los clientes de Colombia que se registraron el 1 de marzo de 2024 o después.","ordered":false,"flexCols":false,"sql":{"en":"SELECT name, city, signup_date\nFROM customers\nWHERE country = 'Colombia'\n  AND signup_date >= '2024-03-01'\nORDER BY signup_date;","es":"SELECT name, city, signup_date\nFROM customers\nWHERE country = 'Colombia'\n  AND signup_date >= '2024-03-01'\nORDER BY signup_date;"},"note":{"en":"Dates in ISO format (`YYYY-MM-DD`) can be compared as text.","es":"Las fechas en formato ISO (`YYYY-MM-DD`) se pueden comparar como texto."}},{"id":"3","n":3,"part":1,"parts":1,"level":"basic","title":{"en":"Missing values","es":"Valores faltantes"},"q":"Return the customers whose city is unknown (missing).","es":"Devuelve los clientes cuya ciudad es desconocida (falta el dato).","ordered":false,"flexCols":true,"sql":{"en":"SELECT customer_id, name\nFROM customers\nWHERE city IS NULL;","es":"SELECT customer_id, name\nFROM customers\nWHERE city IS NULL;"},"note":{"en":"❌ `WHERE city = NULL` returns 0 rows.","es":"❌ `WHERE city = NULL` devuelve 0 filas."}},{"id":"4","n":4,"part":1,"parts":1,"level":"basic","title":{"en":"Count per group","es":"Contar por grupo"},"q":"How many customers are there in each country? Show the country with the most customers first.","es":"¿Cuántos clientes hay en cada país? Muestra primero el país con más clientes.","ordered":true,"flexCols":false,"sql":{"en":"SELECT country, COUNT(*) AS customers\nFROM customers\nGROUP BY country\nORDER BY customers DESC;","es":"SELECT country, COUNT(*) AS customers\nFROM customers\nGROUP BY country\nORDER BY customers DESC;"},"note":{"en":"","es":""}},{"id":"5","n":5,"part":1,"parts":1,"level":"basic","title":{"en":"Pattern matching","es":"Búsqueda por patrón"},"q":"Find all the products whose name contains the word \"Desk\".","es":"Encuentra todos los productos cuyo nombre contiene la palabra \"Desk\".","ordered":false,"flexCols":true,"sql":{"en":"SELECT product_id, name\nFROM products\nWHERE name LIKE '%Desk%';","es":"SELECT product_id, name\nFROM products\nWHERE name LIKE '%Desk%';"},"note":{"en":"","es":""}},{"id":"6","n":6,"part":1,"parts":1,"level":"basic","title":{"en":"Unique values","es":"Valores únicos"},"q":"Return the list of distinct order statuses, in alphabetical order.","es":"Devuelve la lista de estados de pedido distintos (sin repetir), en orden alfabético.","ordered":true,"flexCols":false,"sql":{"en":"SELECT DISTINCT status\nFROM orders\nORDER BY status;","es":"SELECT DISTINCT status\nFROM orders\nORDER BY status;"},"note":{"en":"","es":""}},{"id":"7","n":7,"part":1,"parts":1,"level":"basic","title":{"en":"Total revenue","es":"Ingreso total"},"q":"Calculate the total revenue (quantity × unit price) of all orders that were NOT cancelled.","es":"Calcula el ingreso total (cantidad × precio unitario) de todos los pedidos que NO fueron cancelados.","ordered":false,"flexCols":false,"sql":{"en":"SELECT SUM(oi.quantity * oi.unit_price) AS total_revenue\nFROM order_items oi\nJOIN orders o ON o.order_id = oi.order_id\nWHERE o.status <> 'cancelled';","es":"SELECT SUM(oi.quantity * oi.unit_price) AS total_revenue\nFROM order_items oi\nJOIN orders o ON o.order_id = oi.order_id\nWHERE o.status <> 'cancelled';"},"note":{"en":"Revenue is calculated with `unit_price` (what was actually charged), not with `products.price`.","es":"El ingreso se calcula con `unit_price` (lo que realmente se cobró), no con `products.price`."}},{"id":"8","n":8,"part":1,"parts":1,"level":"basic","title":{"en":"Count by status","es":"Conteo por estado"},"q":"Count how many orders there are for each status.","es":"Cuenta cuántos pedidos hay en cada estado.","ordered":false,"flexCols":false,"sql":{"en":"SELECT status, COUNT(*) AS orders\nFROM orders\nGROUP BY status\nORDER BY orders DESC;","es":"SELECT status, COUNT(*) AS orders\nFROM orders\nGROUP BY status\nORDER BY orders DESC;"},"note":{"en":"","es":""}},{"id":"9","n":9,"part":1,"parts":1,"level":"basic","title":{"en":"HAVING","es":"HAVING"},"q":"Show the average salary of each department, rounded to 2 decimals, but only for departments whose average salary is greater than 8,000.","es":"Muestra el salario promedio de cada departamento, redondeado a 2 decimales, pero solo de los departamentos cuyo salario promedio es mayor que 8.000.","ordered":false,"flexCols":false,"sql":{"en":"SELECT department, ROUND(AVG(salary), 2) AS avg_salary\nFROM employees\nGROUP BY department\nHAVING AVG(salary) > 8000\nORDER BY avg_salary DESC;","es":"SELECT department, ROUND(AVG(salary), 2) AS avg_salary\nFROM employees\nGROUP BY department\nHAVING AVG(salary) > 8000\nORDER BY avg_salary DESC;"},"note":{"en":"","es":""}},{"id":"10","n":10,"part":1,"parts":1,"level":"basic","title":{"en":"Revenue by category","es":"Ingreso por categoría"},"q":"Calculate the revenue of each product category (excluding cancelled orders), from highest to lowest.","es":"Calcula el ingreso de cada categoría de producto (sin contar los pedidos cancelados), de mayor a menor.","ordered":true,"flexCols":false,"sql":{"en":"SELECT p.category, SUM(oi.quantity * oi.unit_price) AS revenue\nFROM order_items oi\nJOIN products p ON p.product_id = oi.product_id\nJOIN orders   o ON o.order_id   = oi.order_id\nWHERE o.status <> 'cancelled'\nGROUP BY p.category\nORDER BY revenue DESC;","es":"SELECT p.category, SUM(oi.quantity * oi.unit_price) AS revenue\nFROM order_items oi\nJOIN products p ON p.product_id = oi.product_id\nJOIN orders   o ON o.order_id   = oi.order_id\nWHERE o.status <> 'cancelled'\nGROUP BY p.category\nORDER BY revenue DESC;"},"note":{"en":"","es":""}},{"id":"11","n":11,"part":1,"parts":1,"level":"joins","title":{"en":"INNER JOIN","es":"INNER JOIN"},"q":"List every order with its id, date, status and the name of the customer who placed it. Sort by date.","es":"Lista cada pedido con su id, fecha, estado y el nombre del cliente que lo hizo. Ordena por fecha.","ordered":true,"flexCols":false,"sql":{"en":"SELECT o.order_id, o.order_date, o.status, c.name\nFROM orders o\nJOIN customers c ON c.customer_id = o.customer_id\nORDER BY o.order_date;","es":"SELECT o.order_id, o.order_date, o.status, c.name\nFROM orders o\nJOIN customers c ON c.customer_id = o.customer_id\nORDER BY o.order_date;"},"note":{"en":"","es":""}},{"id":"12","n":12,"part":1,"parts":1,"level":"joins","title":{"en":"Customers without orders","es":"Clientes sin pedidos"},"q":"Find the customers who have never placed an order.","es":"Encuentra los clientes que nunca han hecho un pedido.","ordered":false,"flexCols":true,"sql":{"en":"SELECT c.customer_id, c.name\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.customer_id\nWHERE o.order_id IS NULL;","es":"SELECT c.customer_id, c.name\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.customer_id\nWHERE o.order_id IS NULL;"},"note":{"en":"**Anti-join** pattern. Alternative: `WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)`.","es":"Patrón **anti-join**. Alternativa: `WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)`."}},{"id":"13","n":13,"part":1,"parts":1,"level":"joins","title":{"en":"Products never sold","es":"Productos nunca vendidos"},"q":"Which products have never been sold? Use `NOT EXISTS`.","es":"¿Qué productos nunca se han vendido? Usa `NOT EXISTS`.","ordered":false,"flexCols":true,"sql":{"en":"SELECT p.product_id, p.name\nFROM products p\nWHERE NOT EXISTS (\n    SELECT 1 FROM order_items oi WHERE oi.product_id = p.product_id\n);","es":"SELECT p.product_id, p.name\nFROM products p\nWHERE NOT EXISTS (\n    SELECT 1 FROM order_items oi WHERE oi.product_id = p.product_id\n);"},"note":{"en":"","es":""}},{"id":"14","n":14,"part":1,"parts":1,"level":"joins","title":{"en":"Self join","es":"Self join"},"q":"Show each employee's name together with their manager's name. Employees without a manager must also appear.","es":"Muestra el nombre de cada empleado junto con el nombre de su jefe. Los empleados sin jefe también deben aparecer.","ordered":false,"flexCols":false,"sql":{"en":"SELECT e.name AS employee, m.name AS manager\nFROM employees e\nLEFT JOIN employees m ON m.emp_id = e.manager_id\nORDER BY e.emp_id;","es":"SELECT e.name AS employee, m.name AS manager\nFROM employees e\nLEFT JOIN employees m ON m.emp_id = e.manager_id\nORDER BY e.emp_id;"},"note":{"en":"With an `INNER JOIN` the CEO would disappear (her `manager_id` is NULL).","es":"Con `INNER JOIN` desaparecería la CEO (su `manager_id` es NULL)."}},{"id":"15","n":15,"part":1,"parts":1,"level":"joins","title":{"en":"Earning more than the manager","es":"Ganar más que el jefe"},"q":"Find the employees who earn more than their direct manager.","es":"Encuentra los empleados que ganan más que su jefe directo.","ordered":false,"flexCols":true,"sql":{"en":"SELECT e.name AS employee, e.salary, m.name AS manager, m.salary AS manager_salary\nFROM employees e\nJOIN employees m ON m.emp_id = e.manager_id\nWHERE e.salary > m.salary;","es":"SELECT e.name AS employee, e.salary, m.name AS manager, m.salary AS manager_salary\nFROM employees e\nJOIN employees m ON m.emp_id = e.manager_id\nWHERE e.salary > m.salary;"},"note":{"en":"","es":""}},{"id":"16","n":16,"part":1,"parts":1,"level":"joins","title":{"en":"Spend per customer (including zero)","es":"Gasto por cliente (incluido el cero)"},"q":"For every customer, show the total amount spent on non-cancelled orders. Customers with no purchases must appear with 0.","es":"Para cada cliente, muestra el monto total gastado en pedidos no cancelados. Los clientes sin compras deben aparecer con 0.","ordered":false,"flexCols":false,"sql":{"en":"SELECT c.name,\n       COALESCE(SUM(oi.quantity * oi.unit_price), 0) AS total_spent\nFROM customers c\nLEFT JOIN orders o\n       ON o.customer_id = c.customer_id\n      AND o.status <> 'cancelled'          -- the filter goes in the ON so no customer is lost\nLEFT JOIN order_items oi ON oi.order_id = o.order_id\nGROUP BY c.customer_id, c.name\nORDER BY total_spent DESC, c.name;","es":"SELECT c.name,\n       COALESCE(SUM(oi.quantity * oi.unit_price), 0) AS total_spent\nFROM customers c\nLEFT JOIN orders o\n       ON o.customer_id = c.customer_id\n      AND o.status <> 'cancelled'          -- el filtro va en el ON para no perder clientes\nLEFT JOIN order_items oi ON oi.order_id = o.order_id\nGROUP BY c.customer_id, c.name\nORDER BY total_spent DESC, c.name;"},"note":{"en":"María and Laura only have cancelled orders → they show 0, just like Carlos.","es":"María y Laura solo tienen pedidos cancelados → salen con 0, igual que Carlos."}},{"id":"17","n":17,"part":1,"parts":1,"level":"joins","title":{"en":"Above the average","es":"Mayor que el promedio"},"q":"List the products whose price is greater than the average price of all products.","es":"Lista los productos cuyo precio es mayor que el precio promedio de todos los productos.","ordered":false,"flexCols":true,"sql":{"en":"SELECT name, price\nFROM products\nWHERE price > (SELECT AVG(price) FROM products)\nORDER BY price DESC;","es":"SELECT name, price\nFROM products\nWHERE price > (SELECT AVG(price) FROM products)\nORDER BY price DESC;"},"note":{"en":"","es":""}},{"id":"18","n":18,"part":1,"parts":1,"level":"joins","title":{"en":"Correlated subquery","es":"Subconsulta correlacionada"},"q":"Find the employees who earn more than the average salary of their own department.","es":"Encuentra los empleados que ganan más que el salario promedio de su propio departamento.","ordered":false,"flexCols":true,"sql":{"en":"SELECT e.name, e.department, e.salary\nFROM employees e\nWHERE e.salary > (\n    SELECT AVG(x.salary) FROM employees x WHERE x.department = e.department\n)\nORDER BY e.department, e.salary DESC;","es":"SELECT e.name, e.department, e.salary\nFROM employees e\nWHERE e.salary > (\n    SELECT AVG(x.salary) FROM employees x WHERE x.department = e.department\n)\nORDER BY e.department, e.salary DESC;"},"note":{"en":"","es":""}},{"id":"19","n":19,"part":1,"parts":1,"level":"joins","title":{"en":"Second highest salary","es":"Segundo salario más alto"},"q":"Return the second highest distinct salary in the company.","es":"Devuelve el segundo salario distinto más alto de la empresa.","ordered":false,"flexCols":false,"sql":{"en":"SELECT MAX(salary) AS second_highest\nFROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees);","es":"SELECT MAX(salary) AS second_highest\nFROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees);"},"note":{"en":"Alternatives: `SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 1;` or `DENSE_RANK() = 2`. For the \"Nth\" value, the `DENSE_RANK` version is the most general.","es":"Alternativas: `SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 1;` o `DENSE_RANK() = 2`. Para el \"N-ésimo\", la de `DENSE_RANK` es la más general."}},{"id":"20","n":20,"part":1,"parts":1,"level":"joins","title":{"en":"Best customer (CTE)","es":"Mejor cliente (CTE)"},"q":"Using a CTE, find the customer who spent the most on non-cancelled orders.","es":"Usando una CTE, encuentra el cliente que más gastó en pedidos no cancelados.","ordered":false,"flexCols":true,"sql":{"en":"WITH spend AS (\n    SELECT o.customer_id, SUM(oi.quantity * oi.unit_price) AS total\n    FROM orders o\n    JOIN order_items oi ON oi.order_id = o.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY o.customer_id\n)\nSELECT c.name, s.total\nFROM spend s\nJOIN customers c ON c.customer_id = s.customer_id\nWHERE s.total = (SELECT MAX(total) FROM spend);","es":"WITH spend AS (\n    SELECT o.customer_id, SUM(oi.quantity * oi.unit_price) AS total\n    FROM orders o\n    JOIN order_items oi ON oi.order_id = o.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY o.customer_id\n)\nSELECT c.name, s.total\nFROM spend s\nJOIN customers c ON c.customer_id = s.customer_id\nWHERE s.total = (SELECT MAX(total) FROM spend);"},"note":{"en":"With `WHERE total = MAX` (instead of `ORDER BY ... LIMIT 1`) you return **all** tied customers.","es":"Con `WHERE total = MAX` (y no con `ORDER BY ... LIMIT 1`) devuelves **todos** los empatados."}},{"id":"21","n":21,"part":1,"parts":1,"level":"joins","title":{"en":"Average order value","es":"Ticket promedio"},"q":"What is the average order value (AOV) of non-cancelled orders? Round to 2 decimals.","es":"¿Cuál es el valor promedio por pedido (AOV, «average order value») de los pedidos no cancelados? Redondea a 2 decimales.","ordered":false,"flexCols":false,"sql":{"en":"WITH order_totals AS (\n    SELECT o.order_id, SUM(oi.quantity * oi.unit_price) AS total\n    FROM orders o\n    JOIN order_items oi ON oi.order_id = o.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY o.order_id\n)\nSELECT COUNT(*) AS orders, ROUND(AVG(total), 2) AS avg_order_value\nFROM order_totals;","es":"WITH order_totals AS (\n    SELECT o.order_id, SUM(oi.quantity * oi.unit_price) AS total\n    FROM orders o\n    JOIN order_items oi ON oi.order_id = o.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY o.order_id\n)\nSELECT COUNT(*) AS orders, ROUND(AVG(total), 2) AS avg_order_value\nFROM order_totals;"},"note":{"en":"⚠️ `AVG(quantity * unit_price)` directly on `order_items` gives the average **per line**, not per order. First sum per order, then average.","es":"⚠️ `AVG(quantity * unit_price)` directamente sobre `order_items` da el promedio **por línea**, no por pedido. Primero se suma por pedido y después se promedia."}},{"id":"22","n":22,"part":1,"parts":1,"level":"windows","title":{"en":"Price buckets","es":"Rangos de precio"},"q":"Classify each product as `High` (price ≥ 300), `Medium` (40 ≤ price < 300) or `Low` (price < 40).","es":"Clasifica cada producto como `High` (precio ≥ 300), `Medium` (40 ≤ precio < 300) o `Low` (precio < 40).","ordered":false,"flexCols":false,"sql":{"en":"SELECT name, price,\n       CASE\n           WHEN price >= 300 THEN 'High'\n           WHEN price >= 40  THEN 'Medium'\n           ELSE 'Low'\n       END AS price_bucket\nFROM products\nORDER BY price DESC;","es":"SELECT name, price,\n       CASE\n           WHEN price >= 300 THEN 'High'\n           WHEN price >= 40  THEN 'Medium'\n           ELSE 'Low'\n       END AS price_bucket\nFROM products\nORDER BY price DESC;"},"note":{"en":"`CASE` is evaluated in order and stops at the **first** true `WHEN`.","es":"El `CASE` se evalúa en orden y se detiene en el **primer** `WHEN` verdadero."}},{"id":"23","n":23,"part":1,"parts":1,"level":"windows","title":{"en":"Conditional aggregation","es":"Agregación condicional"},"q":"In a single row, show the number of delivered, shipped and cancelled orders, and the cancellation rate as a percentage (1 decimal).","es":"En una sola fila, muestra el número de pedidos entregados (delivered), enviados (shipped) y cancelados (cancelled), y la tasa de cancelación en porcentaje (1 decimal).","ordered":false,"flexCols":false,"sql":{"en":"SELECT\n    SUM(CASE WHEN status = 'delivered' THEN 1 ELSE 0 END) AS delivered,\n    SUM(CASE WHEN status = 'shipped'   THEN 1 ELSE 0 END) AS shipped,\n    SUM(CASE WHEN status = 'cancelled' THEN 1 ELSE 0 END) AS cancelled,\n    ROUND(100.0 * SUM(CASE WHEN status = 'cancelled' THEN 1 ELSE 0 END) / COUNT(*), 1) AS cancel_rate_pct\nFROM orders;","es":"SELECT\n    SUM(CASE WHEN status = 'delivered' THEN 1 ELSE 0 END) AS delivered,\n    SUM(CASE WHEN status = 'shipped'   THEN 1 ELSE 0 END) AS shipped,\n    SUM(CASE WHEN status = 'cancelled' THEN 1 ELSE 0 END) AS cancelled,\n    ROUND(100.0 * SUM(CASE WHEN status = 'cancelled' THEN 1 ELSE 0 END) / COUNT(*), 1) AS cancel_rate_pct\nFROM orders;"},"note":{"en":"","es":""}},{"id":"24","n":24,"part":1,"parts":1,"level":"windows","title":{"en":"Customer segmentation","es":"Segmentación de clientes"},"q":"Label each customer according to their number of orders (any status): 0 → `No orders`, 1 → `New`, 2 or more → `Returning`.","es":"Etiqueta a cada cliente según su número de pedidos (en cualquier estado): 0 → `No orders`, 1 → `New`, 2 o más → `Returning`.","ordered":false,"flexCols":false,"sql":{"en":"SELECT c.name,\n       COUNT(o.order_id) AS orders,\n       CASE\n           WHEN COUNT(o.order_id) = 0 THEN 'No orders'\n           WHEN COUNT(o.order_id) = 1 THEN 'New'\n           ELSE 'Returning'\n       END AS label\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.customer_id\nGROUP BY c.customer_id, c.name\nORDER BY orders DESC, c.name;","es":"SELECT c.name,\n       COUNT(o.order_id) AS orders,\n       CASE\n           WHEN COUNT(o.order_id) = 0 THEN 'No orders'\n           WHEN COUNT(o.order_id) = 1 THEN 'New'\n           ELSE 'Returning'\n       END AS label\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.customer_id\nGROUP BY c.customer_id, c.name\nORDER BY orders DESC, c.name;"},"note":{"en":"`COUNT(o.order_id)` (not `COUNT(*)`) so the customer without orders counts as 0, not 1.","es":"`COUNT(o.order_id)` (y no `COUNT(*)`) para que el cliente sin pedidos cuente 0 y no 1."}},{"id":"25","n":25,"part":1,"parts":1,"level":"windows","title":{"en":"Ranking functions","es":"Funciones de ranking"},"q":"Rank employees by salary (highest first) within each department using `ROW_NUMBER`, `RANK` and `DENSE_RANK`.","es":"Ordena a los empleados por salario (el más alto primero) dentro de cada departamento usando `ROW_NUMBER`, `RANK` y `DENSE_RANK`.","ordered":false,"flexCols":false,"sql":{"en":"SELECT department, name, salary,\n       ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC, name) AS row_num,\n       RANK()       OVER (PARTITION BY department ORDER BY salary DESC)       AS rnk,\n       DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC)       AS dense_rnk\nFROM employees\nORDER BY department, salary DESC, name;","es":"SELECT department, name, salary,\n       ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC, name) AS row_num,\n       RANK()       OVER (PARTITION BY department ORDER BY salary DESC)       AS rnk,\n       DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC)       AS dense_rnk\nFROM employees\nORDER BY department, salary DESC, name;"},"note":{"en":"Look at Data: Camila and Julián tie at 9000 → `RANK` jumps to 4 and `DENSE_RANK` continues with 3.","es":"Fíjate en Data: Camila y Julián empatan con 9000 → `RANK` salta al 4 y `DENSE_RANK` sigue con el 3."}},{"id":"26","n":26,"part":1,"parts":1,"level":"windows","title":{"en":"Top earner per department","es":"Mejor pagado por departamento"},"q":"Return the highest-paid employee(s) of each department.","es":"Devuelve el empleado (o los empleados) mejor pagado(s) de cada departamento.","ordered":false,"flexCols":true,"sql":{"en":"WITH ranked AS (\n    SELECT department, name, salary,\n           DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS rk\n    FROM employees\n)\nSELECT department, name, salary\nFROM ranked\nWHERE rk = 1\nORDER BY department;","es":"WITH ranked AS (\n    SELECT department, name, salary,\n           DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS rk\n    FROM employees\n)\nSELECT department, name, salary\nFROM ranked\nWHERE rk = 1\nORDER BY department;"},"note":{"en":"","es":""}},{"id":"27","n":27,"part":1,"parts":1,"level":"windows","title":{"en":"Running total","es":"Total acumulado"},"q":"For each non-cancelled order, show its date, its total and the running (cumulative) revenue ordered by date.","es":"Para cada pedido no cancelado, muestra su fecha, su total y el ingreso acumulado ordenado por fecha.","ordered":true,"flexCols":false,"sql":{"en":"WITH order_totals AS (\n    SELECT o.order_id, o.order_date, SUM(oi.quantity * oi.unit_price) AS total\n    FROM orders o\n    JOIN order_items oi ON oi.order_id = o.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY o.order_id, o.order_date\n)\nSELECT order_id, order_date, total,\n       SUM(total) OVER (ORDER BY order_date, order_id) AS running_revenue\nFROM order_totals\nORDER BY order_date, order_id;","es":"WITH order_totals AS (\n    SELECT o.order_id, o.order_date, SUM(oi.quantity * oi.unit_price) AS total\n    FROM orders o\n    JOIN order_items oi ON oi.order_id = o.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY o.order_id, o.order_date\n)\nSELECT order_id, order_date, total,\n       SUM(total) OVER (ORDER BY order_date, order_id) AS running_revenue\nFROM order_totals\nORDER BY order_date, order_id;"},"note":{"en":"","es":""}},{"id":"28","n":28,"part":1,"parts":1,"level":"windows","title":{"en":"Month-over-month growth","es":"Crecimiento mes a mes"},"q":"Calculate the revenue of each month (non-cancelled orders), the previous month's revenue and the month-over-month growth percentage (1 decimal).","es":"Calcula el ingreso de cada mes (pedidos no cancelados), el ingreso del mes anterior y el porcentaje de crecimiento mes a mes (1 decimal).","ordered":false,"flexCols":false,"sql":{"en":"WITH monthly AS (\n    SELECT strftime('%Y-%m', o.order_date) AS month,\n           SUM(oi.quantity * oi.unit_price) AS revenue\n    FROM orders o\n    JOIN order_items oi ON oi.order_id = o.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY month\n)\nSELECT month, revenue,\n       LAG(revenue) OVER (ORDER BY month) AS prev_revenue,\n       ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month))\n             / LAG(revenue) OVER (ORDER BY month), 1) AS mom_growth_pct\nFROM monthly\nORDER BY month;","es":"WITH monthly AS (\n    SELECT strftime('%Y-%m', o.order_date) AS month,\n           SUM(oi.quantity * oi.unit_price) AS revenue\n    FROM orders o\n    JOIN order_items oi ON oi.order_id = o.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY month\n)\nSELECT month, revenue,\n       LAG(revenue) OVER (ORDER BY month) AS prev_revenue,\n       ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month))\n             / LAG(revenue) OVER (ORDER BY month), 1) AS mom_growth_pct\nFROM monthly\nORDER BY month;"},"note":{"en":"In PostgreSQL: `DATE_TRUNC('month', order_date)`. The first month is `NULL` because there is no previous month.","es":"En PostgreSQL: `DATE_TRUNC('month', order_date)`. El primer mes tiene `NULL` porque no hay mes anterior."}},{"id":"29","n":29,"part":1,"parts":1,"level":"windows","title":{"en":"Share of total","es":"Participación sobre el total"},"q":"For each category, show its revenue (non-cancelled orders) and its percentage of the total revenue (1 decimal).","es":"Para cada categoría, muestra su ingreso (pedidos no cancelados) y su porcentaje del ingreso total (1 decimal).","ordered":false,"flexCols":false,"sql":{"en":"WITH cat AS (\n    SELECT p.category, SUM(oi.quantity * oi.unit_price) AS revenue\n    FROM order_items oi\n    JOIN products p ON p.product_id = oi.product_id\n    JOIN orders   o ON o.order_id   = oi.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY p.category\n)\nSELECT category, revenue,\n       ROUND(100.0 * revenue / SUM(revenue) OVER (), 1) AS pct_of_total\nFROM cat\nORDER BY revenue DESC;","es":"WITH cat AS (\n    SELECT p.category, SUM(oi.quantity * oi.unit_price) AS revenue\n    FROM order_items oi\n    JOIN products p ON p.product_id = oi.product_id\n    JOIN orders   o ON o.order_id   = oi.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY p.category\n)\nSELECT category, revenue,\n       ROUND(100.0 * revenue / SUM(revenue) OVER (), 1) AS pct_of_total\nFROM cat\nORDER BY revenue DESC;"},"note":{"en":"An empty `OVER ()` = the window is the **whole** result.","es":"`OVER ()` vacío = la ventana es **todo** el resultado."}},{"id":"30","n":30,"part":1,"parts":1,"level":"windows","title":{"en":"Days between orders","es":"Días entre pedidos"},"q":"For each order, show the customer, the order date, the date of that customer's previous order and the number of days between them.","es":"Para cada pedido, muestra el cliente, la fecha del pedido, la fecha del pedido anterior de ese mismo cliente y el número de días entre los dos.","ordered":false,"flexCols":false,"sql":{"en":"SELECT customer_id, order_id, order_date,\n       LAG(order_date) OVER w AS prev_order_date,\n       CAST(julianday(order_date) - julianday(LAG(order_date) OVER w) AS INTEGER) AS days_since_prev\nFROM orders\nWINDOW w AS (PARTITION BY customer_id ORDER BY order_date)\nORDER BY customer_id, order_date;","es":"SELECT customer_id, order_id, order_date,\n       LAG(order_date) OVER w AS prev_order_date,\n       CAST(julianday(order_date) - julianday(LAG(order_date) OVER w) AS INTEGER) AS days_since_prev\nFROM orders\nWINDOW w AS (PARTITION BY customer_id ORDER BY order_date)\nORDER BY customer_id, order_date;"},"note":{"en":"`WINDOW w AS (...)` defines the window only once (SQLite, PostgreSQL and MySQL 8 support it).","es":"`WINDOW w AS (...)` define la ventana una sola vez (SQLite, PostgreSQL y MySQL 8 lo soportan)."}},{"id":"31","n":31,"part":1,"parts":1,"level":"windows","title":{"en":"First order per customer","es":"Primer pedido de cada cliente"},"q":"Return the first order (id and date) of every customer who has ordered.","es":"Devuelve el primer pedido (id y fecha) de cada cliente que ha hecho pedidos.","ordered":false,"flexCols":false,"sql":{"en":"WITH numbered AS (\n    SELECT customer_id, order_id, order_date,\n           ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date) AS rn\n    FROM orders\n)\nSELECT customer_id, order_id, order_date\nFROM numbered\nWHERE rn = 1\nORDER BY customer_id;","es":"WITH numbered AS (\n    SELECT customer_id, order_id, order_date,\n           ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date) AS rn\n    FROM orders\n)\nSELECT customer_id, order_id, order_date\nFROM numbered\nWHERE rn = 1\nORDER BY customer_id;"},"note":{"en":"","es":""}},{"id":"32","n":32,"part":1,"parts":1,"level":"windows","title":{"en":"Top 2 products per category","es":"Top 2 productos por categoría"},"q":"For each category, return the 2 products with the most units sold (non-cancelled orders).","es":"Para cada categoría, devuelve los 2 productos con más unidades vendidas (pedidos no cancelados).","ordered":false,"flexCols":false,"sql":{"en":"WITH units AS (\n    SELECT p.category, p.name, SUM(oi.quantity) AS units_sold\n    FROM order_items oi\n    JOIN products p ON p.product_id = oi.product_id\n    JOIN orders   o ON o.order_id   = oi.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY p.category, p.name\n),\nranked AS (\n    SELECT *, ROW_NUMBER() OVER (PARTITION BY category ORDER BY units_sold DESC, name) AS rn\n    FROM units\n)\nSELECT category, name, units_sold\nFROM ranked\nWHERE rn <= 2\nORDER BY category, rn;","es":"WITH units AS (\n    SELECT p.category, p.name, SUM(oi.quantity) AS units_sold\n    FROM order_items oi\n    JOIN products p ON p.product_id = oi.product_id\n    JOIN orders   o ON o.order_id   = oi.order_id\n    WHERE o.status <> 'cancelled'\n    GROUP BY p.category, p.name\n),\nranked AS (\n    SELECT *, ROW_NUMBER() OVER (PARTITION BY category ORDER BY units_sold DESC, name) AS rn\n    FROM units\n)\nSELECT category, name, units_sold\nFROM ranked\nWHERE rn <= 2\nORDER BY category, rn;"},"note":{"en":"","es":""}},{"id":"33","n":33,"part":1,"parts":1,"level":"challenge","title":{"en":"Duplicates","es":"Duplicados"},"q":"Find the salary values that are shared by more than one employee, and how many employees have each one.","es":"Encuentra los valores de salario que comparten varios empleados, y cuántos empleados tienen cada uno.","ordered":false,"flexCols":false,"sql":{"en":"SELECT salary, COUNT(*) AS employees\nFROM employees\nGROUP BY salary\nHAVING COUNT(*) > 1;","es":"SELECT salary, COUNT(*) AS employees\nFROM employees\nGROUP BY salary\nHAVING COUNT(*) > 1;"},"note":{"en":"The same pattern finds duplicated emails or records: `GROUP BY <columns> HAVING COUNT(*) > 1`.","es":"El mismo patrón sirve para encontrar emails o registros duplicados: `GROUP BY <columnas> HAVING COUNT(*) > 1`."}},{"id":"34","n":34,"part":1,"parts":1,"level":"challenge","title":{"en":"Cross-category buyers","es":"Compradores de dos categorías"},"q":"Find the customers who bought products from BOTH the `Electronics` and the `Furniture` categories (non-cancelled orders).","es":"Encuentra los clientes que compraron productos de AMBAS categorías, `Electronics` y `Furniture` (pedidos no cancelados).","ordered":false,"flexCols":true,"sql":{"en":"SELECT c.name\nFROM customers c\nJOIN orders o       ON o.customer_id = c.customer_id\nJOIN order_items oi ON oi.order_id   = o.order_id\nJOIN products p     ON p.product_id  = oi.product_id\nWHERE o.status <> 'cancelled'\n  AND p.category IN ('Electronics', 'Furniture')\nGROUP BY c.customer_id, c.name\nHAVING COUNT(DISTINCT p.category) = 2\nORDER BY c.name;","es":"SELECT c.name\nFROM customers c\nJOIN orders o       ON o.customer_id = c.customer_id\nJOIN order_items oi ON oi.order_id   = o.order_id\nJOIN products p     ON p.product_id  = oi.product_id\nWHERE o.status <> 'cancelled'\n  AND p.category IN ('Electronics', 'Furniture')\nGROUP BY c.customer_id, c.name\nHAVING COUNT(DISTINCT p.category) = 2\nORDER BY c.name;"},"note":{"en":"❌ `WHERE category = 'Electronics' AND category = 'Furniture'` is never true: a **row** cannot have two categories. The \"both\" condition is evaluated per **group** with `HAVING`. Alternative: `INTERSECT`.","es":"❌ `WHERE category = 'Electronics' AND category = 'Furniture'` nunca es verdadero: una **fila** no puede tener dos categorías. La condición \"ambas\" se evalúa por **grupo** con `HAVING`. Alternativa: `INTERSECT`."}},{"id":"35-1","n":35,"part":1,"parts":2,"level":"challenge","title":{"en":"Signup-to-purchase conversion","es":"Conversión de registro a compra"},"q":"For each customer, compute the number of days between signup and their first order (any status). Then, in a second query, calculate what percentage of ALL customers placed their first order within 30 days of signing up.","es":"Para cada cliente, calcula el número de días entre su registro y su primer pedido (en cualquier estado). Luego, en una segunda consulta, calcula qué porcentaje de TODOS los clientes hizo su primer pedido dentro de los 30 días siguientes a su registro.","ordered":false,"flexCols":false,"sql":{"en":"WITH first_order AS (\n    SELECT customer_id, MIN(order_date) AS first_order_date\n    FROM orders\n    GROUP BY customer_id\n)\nSELECT c.name, c.signup_date, f.first_order_date,\n       CAST(julianday(f.first_order_date) - julianday(c.signup_date) AS INTEGER) AS days_to_first_order\nFROM customers c\nLEFT JOIN first_order f ON f.customer_id = c.customer_id\nORDER BY c.customer_id;","es":"WITH first_order AS (\n    SELECT customer_id, MIN(order_date) AS first_order_date\n    FROM orders\n    GROUP BY customer_id\n)\nSELECT c.name, c.signup_date, f.first_order_date,\n       CAST(julianday(f.first_order_date) - julianday(c.signup_date) AS INTEGER) AS days_to_first_order\nFROM customers c\nLEFT JOIN first_order f ON f.customer_id = c.customer_id\nORDER BY c.customer_id;"},"note":{"en":"","es":""}},{"id":"35-2","n":35,"part":2,"parts":2,"level":"challenge","title":{"en":"Signup-to-purchase conversion","es":"Conversión de registro a compra"},"q":"For each customer, compute the number of days between signup and their first order (any status). Then, in a second query, calculate what percentage of ALL customers placed their first order within 30 days of signing up.","es":"Para cada cliente, calcula el número de días entre su registro y su primer pedido (en cualquier estado). Luego, en una segunda consulta, calcula qué porcentaje de TODOS los clientes hizo su primer pedido dentro de los 30 días siguientes a su registro.","ordered":false,"flexCols":false,"sql":{"en":"WITH first_order AS (\n    SELECT customer_id, MIN(order_date) AS first_order_date\n    FROM orders\n    GROUP BY customer_id\n)\nSELECT COUNT(*) AS customers,\n       SUM(CASE WHEN julianday(f.first_order_date) - julianday(c.signup_date) <= 30\n                THEN 1 ELSE 0 END) AS converted_30d,\n       ROUND(100.0 * SUM(CASE WHEN julianday(f.first_order_date) - julianday(c.signup_date) <= 30\n                              THEN 1 ELSE 0 END) / COUNT(*), 1) AS conversion_pct\nFROM customers c\nLEFT JOIN first_order f ON f.customer_id = c.customer_id;","es":"WITH first_order AS (\n    SELECT customer_id, MIN(order_date) AS first_order_date\n    FROM orders\n    GROUP BY customer_id\n)\nSELECT COUNT(*) AS customers,\n       SUM(CASE WHEN julianday(f.first_order_date) - julianday(c.signup_date) <= 30\n                THEN 1 ELSE 0 END) AS converted_30d,\n       ROUND(100.0 * SUM(CASE WHEN julianday(f.first_order_date) - julianday(c.signup_date) <= 30\n                              THEN 1 ELSE 0 END) / COUNT(*), 1) AS conversion_pct\nFROM customers c\nLEFT JOIN first_order f ON f.customer_id = c.customer_id;"},"note":{"en":"The denominator is **all** customers (that is why it is a `LEFT JOIN`). Carlos has `NULL`; a comparison with NULL is not true, so he falls into the `ELSE 0`.","es":"El denominador es **todos** los clientes (por eso `LEFT JOIN`). Carlos tiene `NULL`; la comparación con NULL no es verdadera, así que cae en el `ELSE 0`."}}]},"py":{"items":[{"name":"is_even","section":"Basics / Básicos","doc":"Return True if n is even, False otherwise.\nDevuelve True si n es par.\n>>> is_even(4)\nTrue","stub":"def is_even(n):\n    \"\"\"Return True if n is even, False otherwise.\n    Devuelve True si n es par.\n    >>> is_even(4)\n    True\n    \"\"\"\n    raise NotImplementedError","solution":"def is_even(n):\n    return n % 2 == 0"},{"name":"reverse_string","section":"Basics / Básicos","doc":"Return the string reversed.  Invierte el texto.\n>>> reverse_string(\"data\")\n'atad'","stub":"def reverse_string(s):\n    \"\"\"Return the string reversed.  Invierte el texto.\n    >>> reverse_string(\"data\")\n    'atad'\n    \"\"\"\n    raise NotImplementedError","solution":"def reverse_string(s):\n    return s[::-1]"},{"name":"is_palindrome","section":"Basics / Básicos","doc":"Return True if s reads the same backwards, ignoring case, spaces and\npunctuation (keep only letters and digits).\nPalíndromo ignorando mayúsculas, espacios y signos.\n>>> is_palindrome(\"A man, a plan, a canal: Panama\")\nTrue","stub":"def is_palindrome(s):\n    \"\"\"Return True if s reads the same backwards, ignoring case, spaces and\n    punctuation (keep only letters and digits).\n    Palíndromo ignorando mayúsculas, espacios y signos.\n    >>> is_palindrome(\"A man, a plan, a canal: Panama\")\n    True\n    \"\"\"\n    raise NotImplementedError","solution":"def is_palindrome(s):\n    cleaned = [c.lower() for c in s if c.isalnum()]      # O(n)\n    return cleaned == cleaned[::-1]"},{"name":"count_vowels","section":"Basics / Básicos","doc":"Count the vowels (a, e, i, o, u; upper or lower case) in s.\nCuenta las vocales (sin tildes).\n>>> count_vowels(\"Blend360 Analytics\")\n4","stub":"def count_vowels(s):\n    \"\"\"Count the vowels (a, e, i, o, u; upper or lower case) in s.\n    Cuenta las vocales (sin tildes).\n    >>> count_vowels(\"Blend360 Analytics\")\n    4\n    \"\"\"\n    raise NotImplementedError","solution":"def count_vowels(s):\n    return sum(1 for c in s.lower() if c in \"aeiou\")"},{"name":"fizzbuzz","section":"Basics / Básicos","doc":"Return a list of strings for numbers 1..n: \"Fizz\" for multiples of 3,\n\"Buzz\" for multiples of 5, \"FizzBuzz\" for multiples of both, otherwise the number.\n>>> fizzbuzz(5)\n['1', '2', 'Fizz', '4', 'Buzz']","stub":"def fizzbuzz(n):\n    \"\"\"Return a list of strings for numbers 1..n: \"Fizz\" for multiples of 3,\n    \"Buzz\" for multiples of 5, \"FizzBuzz\" for multiples of both, otherwise the number.\n    >>> fizzbuzz(5)\n    ['1', '2', 'Fizz', '4', 'Buzz']\n    \"\"\"\n    raise NotImplementedError","solution":"def fizzbuzz(n):\n    result = []\n    for i in range(1, n + 1):\n        if i % 15 == 0:                                  # most specific case first / primero el caso más específico\n            result.append(\"FizzBuzz\")\n        elif i % 3 == 0:\n            result.append(\"Fizz\")\n        elif i % 5 == 0:\n            result.append(\"Buzz\")\n        else:\n            result.append(str(i))\n    return result"},{"name":"sum_digits","section":"Basics / Básicos","doc":"Return the sum of the digits of a non-negative integer.\nSuma de los dígitos.\n>>> sum_digits(2024)\n8","stub":"def sum_digits(n):\n    \"\"\"Return the sum of the digits of a non-negative integer.\n    Suma de los dígitos.\n    >>> sum_digits(2024)\n    8\n    \"\"\"\n    raise NotImplementedError","solution":"def sum_digits(n):\n    total = 0\n    while n > 0:                                         # O(number of digits / número de dígitos)\n        total += n % 10                                  # last digit / último dígito\n        n //= 10                                         # drop the last digit / quitar el último dígito\n    return total"},{"name":"max_without_builtin","section":"Basics / Básicos","doc":"Return the largest number WITHOUT using max() or sorted().\nReturn None if the list is empty.\nEl mayor de la lista sin usar max() ni sorted(); None si está vacía.\n>>> max_without_builtin([3, 9, 2])\n9","stub":"def max_without_builtin(nums):\n    \"\"\"Return the largest number WITHOUT using max() or sorted().\n    Return None if the list is empty.\n    El mayor de la lista sin usar max() ni sorted(); None si está vacía.\n    >>> max_without_builtin([3, 9, 2])\n    9\n    \"\"\"\n    raise NotImplementedError","solution":"def max_without_builtin(nums):\n    if not nums:\n        return None\n    best = nums[0]\n    for x in nums[1:]:                                   # O(n)\n        if x > best:\n            best = x\n    return best"},{"name":"remove_duplicates","section":"Lists and strings / Listas y strings","doc":"Remove duplicates keeping the ORIGINAL order of first appearance.\nQuita duplicados conservando el orden original.\n>>> remove_duplicates([3, 1, 3, 2, 1])\n[3, 1, 2]","stub":"def remove_duplicates(items):\n    \"\"\"Remove duplicates keeping the ORIGINAL order of first appearance.\n    Quita duplicados conservando el orden original.\n    >>> remove_duplicates([3, 1, 3, 2, 1])\n    [3, 1, 2]\n    \"\"\"\n    raise NotImplementedError","solution":"def remove_duplicates(items):\n    seen = set()                                         # set → O(1) lookups / búsqueda O(1)\n    result = []\n    for x in items:\n        if x not in seen:\n            seen.add(x)\n            result.append(x)\n    return result"},{"name":"word_frequency","section":"Lists and strings / Listas y strings","doc":"Return a dict {word: count}. Words are case-insensitive and the\ncharacters . , ! ? must be ignored.\nFrecuencia de palabras (sin distinguir mayúsculas, ignorando . , ! ?).\n>>> word_frequency(\"Data is good. DATA is power!\")\n{'data': 2, 'is': 2, 'good': 1, 'power': 1}","stub":"def word_frequency(text):\n    \"\"\"Return a dict {word: count}. Words are case-insensitive and the\n    characters . , ! ? must be ignored.\n    Frecuencia de palabras (sin distinguir mayúsculas, ignorando . , ! ?).\n    >>> word_frequency(\"Data is good. DATA is power!\")\n    {'data': 2, 'is': 2, 'good': 1, 'power': 1}\n    \"\"\"\n    raise NotImplementedError","solution":"from collections import Counter, defaultdict\n\ndef word_frequency(text):\n    for ch in \".,!?\":\n        text = text.replace(ch, \"\")\n    return dict(Counter(text.lower().split()))"},{"name":"longest_word","section":"Lists and strings / Listas y strings","doc":"Return the longest word in the text. If there is a tie, return the\nfirst one. Palabra más larga (en empate, la primera).\n>>> longest_word(\"we love big data\")\n'love'","stub":"def longest_word(text):\n    \"\"\"Return the longest word in the text. If there is a tie, return the\n    first one. Palabra más larga (en empate, la primera).\n    >>> longest_word(\"we love big data\")\n    'love'\n    \"\"\"\n    raise NotImplementedError","solution":"def longest_word(text):\n    best = \"\"\n    for word in text.split():\n        if len(word) > len(best):                        # strict \">\" keeps the first on ties / en empate se queda la primera\n            best = word\n    return best"},{"name":"are_anagrams","section":"Lists and strings / Listas y strings","doc":"Return True if a and b are anagrams (ignore case and spaces).\n¿Son anagramas? (ignorando mayúsculas y espacios)\n>>> are_anagrams(\"Listen\", \"Silent\")\nTrue","stub":"def are_anagrams(a, b):\n    \"\"\"Return True if a and b are anagrams (ignore case and spaces).\n    ¿Son anagramas? (ignorando mayúsculas y espacios)\n    >>> are_anagrams(\"Listen\", \"Silent\")\n    True\n    \"\"\"\n    raise NotImplementedError","solution":"from collections import Counter, defaultdict\n\ndef are_anagrams(a, b):\n    clean = lambda s: s.replace(\" \", \"\").lower()\n    return Counter(clean(a)) == Counter(clean(b))"},{"name":"second_largest","section":"Lists and strings / Listas y strings","doc":"Return the second largest DISTINCT value, or None if it does not exist.\nSegundo valor más grande (distinto); None si no existe.\n>>> second_largest([5, 9, 9, 7])\n7","stub":"def second_largest(nums):\n    \"\"\"Return the second largest DISTINCT value, or None if it does not exist.\n    Segundo valor más grande (distinto); None si no existe.\n    >>> second_largest([5, 9, 9, 7])\n    7\n    \"\"\"\n    raise NotImplementedError","solution":"def second_largest(nums):\n    first = second = None\n    for x in set(nums):                                  # O(n), a single pass / una sola pasada\n        if first is None or x > first:\n            first, second = x, first\n        elif second is None or x > second:\n            second = x\n    return second"},{"name":"flatten","section":"Lists and strings / Listas y strings","doc":"Flatten ONE level of nesting.  Aplana un nivel.\n>>> flatten([[1, 2], [3], []])\n[1, 2, 3]","stub":"def flatten(list_of_lists):\n    \"\"\"Flatten ONE level of nesting.  Aplana un nivel.\n    >>> flatten([[1, 2], [3], []])\n    [1, 2, 3]\n    \"\"\"\n    raise NotImplementedError","solution":"def flatten(list_of_lists):\n    return [x for sub in list_of_lists for x in sub]"},{"name":"transpose","section":"Lists and strings / Listas y strings","doc":"Return the transpose of a rectangular matrix (list of rows).\nTraspuesta de una matriz.\n>>> transpose([[1, 2, 3], [4, 5, 6]])\n[[1, 4], [2, 5], [3, 6]]","stub":"def transpose(matrix):\n    \"\"\"Return the transpose of a rectangular matrix (list of rows).\n    Traspuesta de una matriz.\n    >>> transpose([[1, 2, 3], [4, 5, 6]])\n    [[1, 4], [2, 5], [3, 6]]\n    \"\"\"\n    raise NotImplementedError","solution":"def transpose(matrix):\n    return [list(col) for col in zip(*matrix)]"},{"name":"compress","section":"Lists and strings / Listas y strings","doc":"Run-length encoding: each character followed by how many times it\nrepeats consecutively.  Compresión por repeticiones consecutivas.\n>>> compress(\"aaabccdd\")\n'a3b1c2d2'","stub":"def compress(s):\n    \"\"\"Run-length encoding: each character followed by how many times it\n    repeats consecutively.  Compresión por repeticiones consecutivas.\n    >>> compress(\"aaabccdd\")\n    'a3b1c2d2'\n    \"\"\"\n    raise NotImplementedError","solution":"def compress(s):\n    if not s:\n        return \"\"\n    parts = []\n    current, count = s[0], 1\n    for ch in s[1:]:\n        if ch == current:\n            count += 1\n        else:\n            parts.append(f\"{current}{count}\")\n            current, count = ch, 1\n    parts.append(f\"{current}{count}\")                    # do not forget the last group / no olvidar el último grupo\n    return \"\".join(parts)"},{"name":"count_by","section":"Data (analysis style) / Datos (estilo análisis)","doc":"Given a list of dicts, count how many records there are for each value\nof `key`.  Cuenta registros por el valor de una clave (como un GROUP BY + COUNT).\n>>> count_by([{\"city\": \"Cali\"}, {\"city\": \"Bogotá\"}, {\"city\": \"Cali\"}], \"city\")\n{'Cali': 2, 'Bogotá': 1}","stub":"def count_by(records, key):\n    \"\"\"Given a list of dicts, count how many records there are for each value\n    of `key`.  Cuenta registros por el valor de una clave (como un GROUP BY + COUNT).\n    >>> count_by([{\"city\": \"Cali\"}, {\"city\": \"Bogotá\"}, {\"city\": \"Cali\"}], \"city\")\n    {'Cali': 2, 'Bogotá': 1}\n    \"\"\"\n    raise NotImplementedError","solution":"def count_by(records, key):\n    counts = {}\n    for r in records:\n        counts[r[key]] = counts.get(r[key], 0) + 1\n    return counts"},{"name":"average_by","section":"Data (analysis style) / Datos (estilo análisis)","doc":"Return {group: average of value_key}, rounded to 2 decimals.\nPromedio por grupo (GROUP BY + AVG), redondeado a 2 decimales.\n>>> average_by([{\"d\": \"A\", \"s\": 10}, {\"d\": \"A\", \"s\": 20}, {\"d\": \"B\", \"s\": 5}], \"d\", \"s\")\n{'A': 15.0, 'B': 5.0}","stub":"def average_by(records, group_key, value_key):\n    \"\"\"Return {group: average of value_key}, rounded to 2 decimals.\n    Promedio por grupo (GROUP BY + AVG), redondeado a 2 decimales.\n    >>> average_by([{\"d\": \"A\", \"s\": 10}, {\"d\": \"A\", \"s\": 20}, {\"d\": \"B\", \"s\": 5}], \"d\", \"s\")\n    {'A': 15.0, 'B': 5.0}\n    \"\"\"\n    raise NotImplementedError","solution":"from collections import Counter, defaultdict\n\ndef average_by(records, group_key, value_key):\n    sums = defaultdict(float)\n    counts = defaultdict(int)\n    for r in records:\n        sums[r[group_key]] += r[value_key]\n        counts[r[group_key]] += 1\n    return {g: round(sums[g] / counts[g], 2) for g in sums}"},{"name":"top_n","section":"Data (analysis style) / Datos (estilo análisis)","doc":"Given {name: score}, return the list of the n names with the highest\nscore. Ties are broken alphabetically by name.\nLos n nombres con mayor puntaje; los empates se ordenan alfabéticamente.\n>>> top_n({\"ana\": 90, \"luis\": 95, \"bea\": 90}, 2)\n['luis', 'ana']","stub":"def top_n(scores, n):\n    \"\"\"Given {name: score}, return the list of the n names with the highest\n    score. Ties are broken alphabetically by name.\n    Los n nombres con mayor puntaje; los empates se ordenan alfabéticamente.\n    >>> top_n({\"ana\": 90, \"luis\": 95, \"bea\": 90}, 2)\n    ['luis', 'ana']\n    \"\"\"\n    raise NotImplementedError","solution":"def top_n(scores, n):\n    ordered = sorted(scores.items(), key=lambda kv: (-kv[1], kv[0]))  # value desc, name asc / valor desc, nombre asc\n    return [name for name, _ in ordered[:n]]"},{"name":"filter_records","section":"Data (analysis style) / Datos (estilo análisis)","doc":"Return the records whose `field` is strictly greater than threshold.\nRecords where the field is missing or None must be skipped.\nRegistros cuyo campo es mayor que el umbral (ignora los que no lo tienen o es None).\n>>> filter_records([{\"v\": 5}, {\"v\": None}, {}, {\"v\": 12}], \"v\", 6)\n[{'v': 12}]","stub":"def filter_records(records, field, threshold):\n    \"\"\"Return the records whose `field` is strictly greater than threshold.\n    Records where the field is missing or None must be skipped.\n    Registros cuyo campo es mayor que el umbral (ignora los que no l
