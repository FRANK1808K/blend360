o tienen o es None).\n    >>> filter_records([{\"v\": 5}, {\"v\": None}, {}, {\"v\": 12}], \"v\", 6)\n    [{'v': 12}]\n    \"\"\"\n    raise NotImplementedError","solution":"def filter_records(records, field, threshold):\n    return [r for r in records if r.get(field) is not None and r[field] > threshold]"},{"name":"merge_sum","section":"Data (analysis style) / Datos (estilo análisis)","doc":"Merge two dicts adding the values of common keys.\nFusiona dos diccionarios sumando los valores de las claves comunes.\n>>> merge_sum({\"a\": 1, \"b\": 2}, {\"b\": 3, \"c\": 4})\n{'a': 1, 'b': 5, 'c': 4}","stub":"def merge_sum(d1, d2):\n    \"\"\"Merge two dicts adding the values of common keys.\n    Fusiona dos diccionarios sumando los valores de las claves comunes.\n    >>> merge_sum({\"a\": 1, \"b\": 2}, {\"b\": 3, \"c\": 4})\n    {'a': 1, 'b': 5, 'c': 4}\n    \"\"\"\n    raise NotImplementedError","solution":"def merge_sum(d1, d2):\n    result = dict(d1)                                    # copy: do not modify the input / copia: no modificar la entrada\n    for k, v in d2.items():\n        result[k] = result.get(k, 0) + v\n    return result"},{"name":"clean_numbers","section":"Data (analysis style) / Datos (estilo análisis)","doc":"Convert a messy list to floats. Skip None, empty strings and values\nthat cannot be converted. Strings may contain surrounding spaces.\nLimpia una lista \"sucia\" y devuelve solo los números como float.\n>>> clean_numbers([\"3\", \" 4.5 \", None, \"abc\", \"\", 7])\n[3.0, 4.5, 7.0]","stub":"def clean_numbers(values):\n    \"\"\"Convert a messy list to floats. Skip None, empty strings and values\n    that cannot be converted. Strings may contain surrounding spaces.\n    Limpia una lista \"sucia\" y devuelve solo los números como float.\n    >>> clean_numbers([\"3\", \" 4.5 \", None, \"abc\", \"\", 7])\n    [3.0, 4.5, 7.0]\n    \"\"\"\n    raise NotImplementedError","solution":"def clean_numbers(values):\n    result = []\n    for v in values:\n        if v is None:\n            continue\n        try:\n            result.append(float(str(v).strip()))\n        except ValueError:                               # \"abc\" and \"\" raise ValueError / lanzan ValueError\n            continue\n    return result"},{"name":"is_prime","section":"Math and recursion / Matemática y recursión","doc":"Return True if n is a prime number.  ¿Es primo?\n>>> is_prime(13)\nTrue","stub":"def is_prime(n):\n    \"\"\"Return True if n is a prime number.  ¿Es primo?\n    >>> is_prime(13)\n    True\n    \"\"\"\n    raise NotImplementedError","solution":"def is_prime(n):\n    if n < 2:\n        return False\n    i = 2\n    while i * i <= n:                                    # testing up to √n is enough → O(√n) / basta probar hasta √n\n        if n % i == 0:\n            return False\n        i += 1\n    return True"},{"name":"primes_up_to","section":"Math and recursion / Matemática y recursión","doc":"Return all primes <= n (tip: Sieve of Eratosthenes).\nTodos los primos hasta n (criba de Eratóstenes).\n>>> primes_up_to(20)\n[2, 3, 5, 7, 11, 13, 17, 19]","stub":"def primes_up_to(n):\n    \"\"\"Return all primes <= n (tip: Sieve of Eratosthenes).\n    Todos los primos hasta n (criba de Eratóstenes).\n    >>> primes_up_to(20)\n    [2, 3, 5, 7, 11, 13, 17, 19]\n    \"\"\"\n    raise NotImplementedError","solution":"def primes_up_to(n):\n    if n < 2:\n        return []\n    is_p = [True] * (n + 1)\n    is_p[0] = is_p[1] = False\n    for i in range(2, int(n ** 0.5) + 1):\n        if is_p[i]:\n            for multiple in range(i * i, n + 1, i):      # cross out multiples / tachar múltiplos\n                is_p[multiple] = False\n    return [i for i, p in enumerate(is_p) if p]"},{"name":"factorial","section":"Math and recursion / Matemática y recursión","doc":"Return n! using RECURSION. Raise ValueError if n < 0.\nFactorial recursivo; ValueError si n es negativo.\n>>> factorial(5)\n120","stub":"def factorial(n):\n    \"\"\"Return n! using RECURSION. Raise ValueError if n < 0.\n    Factorial recursivo; ValueError si n es negativo.\n    >>> factorial(5)\n    120\n    \"\"\"\n    raise NotImplementedError","solution":"def factorial(n):\n    if n < 0:\n        raise ValueError(\"n must be non-negative\")\n    if n <= 1:                                           # base case / caso base\n        return 1\n    return n * factorial(n - 1)"},{"name":"fibonacci","section":"Math and recursion / Matemática y recursión","doc":"Return a list with the first n Fibonacci numbers, starting 0, 1.\nLos primeros n números de Fibonacci.\n>>> fibonacci(7)\n[0, 1, 1, 2, 3, 5, 8]","stub":"def fibonacci(n):\n    \"\"\"Return a list with the first n Fibonacci numbers, starting 0, 1.\n    Los primeros n números de Fibonacci.\n    >>> fibonacci(7)\n    [0, 1, 1, 2, 3, 5, 8]\n    \"\"\"\n    raise NotImplementedError","solution":"def fibonacci(n):\n    seq = []\n    a, b = 0, 1\n    for _ in range(n):                                   # iterative O(n); naive recursion is O(2^n) / el recursivo ingenuo es O(2^n)\n        seq.append(a)\n        a, b = b, a + b\n    return seq"}],"grader":"\"\"\"Grader for ejercicios.py (no dependencies) / Corrector de ejercicios.py (sin dependencias: no necesitas pytest).\n\n    python3 test_ejercicios.py              # grades your answers / corrige tus respuestas\n    python3 test_ejercicios.py soluciones   # checks the reference solutions / verifica las soluciones de referencia\n\"\"\"\nimport importlib\nimport sys\n\nTESTS = {\n    \"is_even\": [((4,), True), ((7,), False), ((0,), True), ((-2,), True)],\n    \"reverse_string\": [((\"data\",), \"atad\"), ((\"\",), \"\"), ((\"a\",), \"a\")],\n    \"is_palindrome\": [((\"A man, a plan, a canal: Panama\",), True), ((\"Data\",), False),\n                      ((\"\",), True), ((\"No 'x' in Nixon\",), True)],\n    \"count_vowels\": [((\"Blend360 Analytics\",), 4), ((\"xyz\",), 0), ((\"AEIOU aeiou\",), 10)],\n    \"fizzbuzz\": [((5,), [\"1\", \"2\", \"Fizz\", \"4\", \"Buzz\"]), ((0,), []),\n                 ((15,), [\"1\", \"2\", \"Fizz\", \"4\", \"Buzz\", \"Fizz\", \"7\", \"8\", \"Fizz\", \"Buzz\",\n                          \"11\", \"Fizz\", \"13\", \"14\", \"FizzBuzz\"])],\n    \"sum_digits\": [((2024,), 8), ((0,), 0), ((9999,), 36)],\n    \"max_without_builtin\": [(([3, 9, 2],), 9), (([],), None), (([-5, -2, -9],), -2)],\n    \"remove_duplicates\": [(([3, 1, 3, 2, 1],), [3, 1, 2]), (([],), []), (([\"b\", \"a\", \"b\"],), [\"b\", \"a\"])],\n    \"word_frequency\": [((\"Data is good. DATA is power!\",), {\"data\": 2, \"is\": 2, \"good\": 1, \"power\": 1}),\n                       ((\"\",), {})],\n    \"longest_word\": [((\"we love big data\",), \"love\"), ((\"a bb cc\",), \"bb\"), ((\"python\",), \"python\")],\n    \"are_anagrams\": [((\"Listen\", \"Silent\"), True), ((\"Dormitory\", \"dirty room\"), True),\n                     ((\"abc\", \"abd\"), False), ((\"aab\", \"abb\"), False)],\n    \"second_largest\": [(([5, 9, 9, 7],), 7), (([4, 4],), None), (([],), None), (([-1, -3],), -3)],\n    \"flatten\": [(([[1, 2], [3], []],), [1, 2, 3]), (([],), [])],\n    \"transpose\": [(([[1, 2, 3], [4, 5, 6]],), [[1, 4], [2, 5], [3, 6]]), (([[7]],), [[7]])],\n    \"compress\": [((\"aaabccdd\",), \"a3b1c2d2\"), ((\"\",), \"\"), ((\"z\",), \"z1\"), ((\"abab\",), \"a1b1a1b1\")],\n    \"count_by\": [(([{\"city\": \"Cali\"}, {\"city\": \"Bogotá\"}, {\"city\": \"Cali\"}], \"city\"),\n                  {\"Cali\": 2, \"Bogotá\": 1}), (([], \"x\"), {})],\n    \"average_by\": [(([{\"d\": \"A\", \"s\": 10}, {\"d\": \"A\", \"s\": 20}, {\"d\": \"B\", \"s\": 5}], \"d\", \"s\"),\n                    {\"A\": 15.0, \"B\": 5.0}),\n                   (([{\"g\": 1, \"v\": 1}, {\"g\": 1, \"v\": 2}, {\"g\": 1, \"v\": 2}], \"g\", \"v\"), {1: 1.67})],\n    \"top_n\": [(({\"ana\": 90, \"luis\": 95, \"bea\": 90}, 2), [\"luis\", \"ana\"]),\n              (({\"x\": 1}, 5), [\"x\"]), (({}, 3), [])],\n    \"filter_records\": [(([{\"v\": 5}, {\"v\": None}, {}, {\"v\": 12}], \"v\", 6), [{\"v\": 12}]),\n                       (([{\"v\": 6}], \"v\", 6), [])],\n    \"merge_sum\": [(({\"a\": 1, \"b\": 2}, {\"b\": 3, \"c\": 4}), {\"a\": 1, \"b\": 5, \"c\": 4}),\n                  (({}, {\"x\": 1}), {\"x\": 1})],\n    \"clean_numbers\": [(([\"3\", \" 4.5 \", None, \"abc\", \"\", 7],), [3.0, 4.5, 7.0]), (([],), [])],\n    \"is_prime\": [((13,), True), ((1,), False), ((2,), True), ((25,), False), ((97,), True), ((0,), False)],\n    \"primes_up_to\": [((20,), [2, 3, 5, 7, 11, 13, 17, 19]), ((1,), []), ((2,), [2])],\n    \"factorial\": [((5,), 120), ((0,), 1), ((1,), 1), ((10,), 3628800)],\n    \"fibonacci\": [((7,), [0, 1, 1, 2, 3, 5, 8]), ((0,), []), ((1,), [0]), ((2,), [0, 1])],\n}\n\n\ndef run(module_name):\n    module = importlib.import_module(module_name)\n    passed = pending = failed = 0\n    for name, cases in TESTS.items():\n        func = getattr(module, name)\n        try:\n            for args, expected in cases:\n                got = func(*args)\n                if got != expected:\n                    raise AssertionError(f\"{name}{args} → {got!r}, expected / se esperaba {expected!r}\")\n            _check_special(module, name)\n        except NotImplementedError:\n            pending += 1\n            print(f\"  ⏳ {name}: pending / pendiente\")\n            continue\n        except Exception as exc:  # noqa: BLE001 - mostrar cualquier fallo al estudiante\n            failed += 1\n            print(f\"  ❌ {name}: {exc}\")\n            continue\n        passed += 1\n        print(f\"  ✅ {name}\")\n    total = len(TESTS)\n    print(f\"\\n{module_name}.py → {passed}/{total} correct / correctos, {failed} failed / con errores, {pending} pending / pendientes\")\n    return failed == 0 and pending == 0\n\n\ndef _check_special(module, name):\n    \"\"\"Extra checks beyond input → output (also used by the simulator's Python lab).\"\"\"\n    if name == \"factorial\":\n        try:\n            module.factorial(-1)\n        except ValueError:\n            return\n        raise AssertionError(\"factorial(-1) should raise ValueError / debería lanzar ValueError\")\n    if name == \"max_without_builtin\":\n        _check_no_builtin(module.max_without_builtin)\n\n\ndef _check_no_builtin(func):\n    import builtins\n    original_max, original_sorted = builtins.max, builtins.sorted\n\n    def forbidden(*_a, **_k):\n        raise AssertionError(\"max_without_builtin must not use max() or sorted() / no debe usar max() ni sorted()\")\n\n    builtins.max, builtins.sorted = forbidden, forbidden\n    try:\n        func([1, 5, 3])\n    finally:\n        builtins.max, builtins.sorted = original_max, original_sorted\n\n\nif __name__ == \"__main__\":\n    target = sys.argv[1] if len(sys.argv) > 1 else \"ejercicios\"\n    sys.exit(0 if run(target) else 1)\n","prelude":""},"algo":{"items":[{"name":"two_sum","section":"🟢 Hash map / arrays","doc":"🟢 Return the indices [i, j] (i < j) of the two numbers that add up to\ntarget, or [] if none. Each input has at most one solution.\nÍndices de los dos números que suman target.\n>>> two_sum([2, 7, 11, 15], 9)\n[0, 1]","stub":"def two_sum(nums, target):\n    \"\"\"🟢 Return the indices [i, j] (i < j) of the two numbers that add up to\n    target, or [] if none. Each input has at most one solution.\n    Índices de los dos números que suman target.\n    >>> two_sum([2, 7, 11, 15], 9)\n    [0, 1]\n    \"\"\"\n    raise NotImplementedError","solution":"def two_sum(nums, target):\n    # Idea: for each x, have I already seen its complement (target - x)? → dict value→index.\n    # Idea: para cada x, ¿ya vi su complemento (target - x)? → dict valor→índice.\n    # Time O(n), space O(n). (Brute force with two loops is O(n²).)\n    seen = {}\n    for i, x in enumerate(nums):\n        if target - x in seen:\n            return [seen[target - x], i]\n        seen[x] = i\n    return []"},{"name":"first_unique_char","section":"🟢 Hash map / arrays","doc":"🟢 Return the index of the first non-repeating character, or -1.\nÍndice del primer carácter que no se repite.\n>>> first_unique_char(\"blendblend360\")\n10","stub":"def first_unique_char(s):\n    \"\"\"🟢 Return the index of the first non-repeating character, or -1.\n    Índice del primer carácter que no se repite.\n    >>> first_unique_char(\"blendblend360\")\n    10\n    \"\"\"\n    raise NotImplementedError","solution":"from collections import Counter, defaultdict, deque\n\ndef first_unique_char(s):\n    # Two passes: count, then find the first with count 1. O(n).\n    # Dos pasadas: contar y luego buscar el primero con conteo 1. O(n).\n    counts = Counter(s)\n    for i, ch in enumerate(s):\n        if counts[ch] == 1:\n            return i\n    return -1"},{"name":"missing_number","section":"🟢 Hash map / arrays","doc":"🟢 nums contains n distinct numbers from the range [0, n]. Return the\none that is missing.  Falta un número del rango 0..n.\n>>> missing_number([3, 0, 1])\n2","stub":"def missing_number(nums):\n    \"\"\"🟢 nums contains n distinct numbers from the range [0, n]. Return the\n    one that is missing.  Falta un número del rango 0..n.\n    >>> missing_number([3, 0, 1])\n    2\n    \"\"\"\n    raise NotImplementedError","solution":"def missing_number(nums):\n    # Expected sum of 0..n minus the real sum (Gauss's formula). O(n), O(1) space.\n    # Suma esperada de 0..n menos la suma real (fórmula de Gauss). O(n), espacio O(1).\n    n = len(nums)\n    return n * (n + 1) // 2 - sum(nums)"},{"name":"move_zeros","section":"🟢 Hash map / arrays","doc":"🟢 Return a list with all the zeros moved to the end, keeping the\nrelative order of the non-zero elements.\nMueve los ceros al final conservando el orden de los demás.\n>>> move_zeros([0, 1, 0, 3, 12])\n[1, 3, 12, 0, 0]","stub":"def move_zeros(nums):\n    \"\"\"🟢 Return a list with all the zeros moved to the end, keeping the\n    relative order of the non-zero elements.\n    Mueve los ceros al final conservando el orden de los demás.\n    >>> move_zeros([0, 1, 0, 3, 12])\n    [1, 3, 12, 0, 0]\n    \"\"\"\n    raise NotImplementedError","solution":"def move_zeros(nums):\n    # Two pointers: \"write\" marks where the next non-zero goes. O(n).\n    # Dos punteros: \"write\" marca dónde va el siguiente no-cero. O(n).\n    result = list(nums)\n    write = 0\n    for x in result[:]:\n        if x != 0:\n            result[write] = x\n            write += 1\n    for i in range(write, len(result)):\n        result[i] = 0\n    return result"},{"name":"rotate_right","section":"🟢 Hash map / arrays","doc":"🟢 Rotate the list to the right by k steps (k may be larger than len).\nRota la lista k posiciones a la derecha.\n>>> rotate_right([1, 2, 3, 4, 5], 2)\n[4, 5, 1, 2, 3]","stub":"def rotate_right(nums, k):\n    \"\"\"🟢 Rotate the list to the right by k steps (k may be larger than len).\n    Rota la lista k posiciones a la derecha.\n    >>> rotate_right([1, 2, 3, 4, 5], 2)\n    [4, 5, 1, 2, 3]\n    \"\"\"\n    raise NotImplementedError","solution":"def rotate_right(nums, k):\n    # k % n avoids useless rotations (rotating n times = not rotating). O(n).\n    # k % n evita rotaciones innecesarias (rotar n veces = no rotar). O(n).\n    if not nums:\n        return []\n    k %= len(nums)\n    return nums[-k:] + nums[:-k] if k else list(nums)"},{"name":"max_profit","section":"🟢 Hash map / arrays","doc":"🟢 prices[i] is a stock price on day i. Buy once and sell once later.\nReturn the maximum profit (0 if no profit is possible).\nMáxima ganancia comprando un día y vendiendo un día posterior.\n>>> max_profit([7, 1, 5, 3, 6, 4])\n5","stub":"def max_profit(prices):\n    \"\"\"🟢 prices[i] is a stock price on day i. Buy once and sell once later.\n    Return the maximum profit (0 if no profit is possible).\n    Máxima ganancia comprando un día y vendiendo un día posterior.\n    >>> max_profit([7, 1, 5, 3, 6, 4])\n    5\n    \"\"\"\n    raise NotImplementedError","solution":"def max_profit(prices):\n    # Greedy: remember the minimum price so far and the best profit so far. O(n).\n    # Greedy: recuerda el precio mínimo visto y la mejor ganancia hasta ahora. O(n).\n    min_price = float(\"inf\")\n    best = 0\n    for p in prices:\n        min_price = min(min_price, p)\n        best = max(best, p - min_price)\n    return best"},{"name":"valid_parentheses","section":"🟢 Stack / search / sorting — Pila / búsqueda / ordenamiento","doc":"🟢 Return True if every bracket ()[]{} is closed in the correct order.\n¿Paréntesis balanceados?\n>>> valid_parentheses(\"([]{})\")\nTrue","stub":"def valid_parentheses(s):\n    \"\"\"🟢 Return True if every bracket ()[]{} is closed in the correct order.\n    ¿Paréntesis balanceados?\n    >>> valid_parentheses(\"([]{})\")\n    True\n    \"\"\"\n    raise NotImplementedError","solution":"def valid_parentheses(s):\n    # Stack: each closing bracket must match the last pending opening one. O(n).\n    # Pila: cada cierre debe coincidir con la última apertura pendiente. O(n).\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n    return not stack"},{"name":"binary_search","section":"🟢 Stack / search / sorting — Pila / búsqueda / ordenamiento","doc":"🟢 arr is sorted ascending. Return the index of target or -1. Must be O(log n).\nBúsqueda binaria.\n>>> binary_search([1, 3, 5, 7, 9], 7)\n3","stub":"def binary_search(arr, target):\n    \"\"\"🟢 arr is sorted ascending. Return the index of target or -1. Must be O(log n).\n    Búsqueda binaria.\n    >>> binary_search([1, 3, 5, 7, 9], 7)\n    3\n    \"\"\"\n    raise NotImplementedError","solution":"def binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo <= hi:             # O(log n)\n        mid = (lo + hi) // 2\n        if arr[mid] == target:\n            return mid\n        if arr[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1"},{"name":"bubble_sort","section":"🟢 Stack / search / sorting — Pila / búsqueda / ordenamiento","doc":"🟢 Return a NEW sorted list implementing bubble sort (no sorted()/sort()).\nImplementa bubble sort sin modificar la lista original.\n>>> bubble_sort([5, 1, 4, 2])\n[1, 2, 4, 5]","stub":"def bubble_sort(nums):\n    \"\"\"🟢 Return a NEW sorted list implementing bubble sort (no sorted()/sort()).\n    Implementa bubble sort sin modificar la lista original.\n    >>> bubble_sort([5, 1, 4, 2])\n    [1, 2, 4, 5]\n    \"\"\"\n    raise NotImplementedError","solution":"def bubble_sort(nums):\n    arr = list(nums)            # copy: do not modify the input / copia: no modificar la entrada\n    n = len(arr)\n    for i in range(n - 1):      # O(n²) worst case, O(n) if already sorted / O(n) si ya está ordenada\n        swapped = False\n        for j in range(n - 1 - i):          # the last i are already in place / los últimos i ya están en su lugar\n            if arr[j] > arr[j + 1]:\n                arr[j], arr[j + 1] = arr[j + 1], arr[j]\n                swapped = True\n        if not swapped:\n            break\n    return arr"},{"name":"merge_sorted","section":"🟢 Stack / search / sorting — Pila / búsqueda / ordenamiento","doc":"🟢 Merge two sorted lists into one sorted list in O(n + m).\nMezcla dos listas ordenadas (el paso clave de merge sort).\n>>> merge_sorted([1, 4, 9], [2, 3, 10])\n[1, 2, 3, 4, 9, 10]","stub":"def merge_sorted(a, b):\n    \"\"\"🟢 Merge two sorted lists into one sorted list in O(n + m).\n    Mezcla dos listas ordenadas (el paso clave de merge sort).\n    >>> merge_sorted([1, 4, 9], [2, 3, 10])\n    [1, 2, 3, 4, 9, 10]\n    \"\"\"\n    raise NotImplementedError","solution":"def merge_sorted(a, b):\n    i = j = 0\n    result = []\n    while i < len(a) and j < len(b):        # O(n + m)\n        if a[i] <= b[j]:                    # \"<=\" keeps it stable / mantiene la estabilidad\n            result.append(a[i])\n            i += 1\n        else:\n            result.append(b[j])\n            j += 1\n    result.extend(a[i:])                    # whatever is left in either list / lo que sobre de cualquiera\n    result.extend(b[j:])\n    return result"},{"name":"MinStack","section":"🟢 Stack / search / sorting — Pila / búsqueda / ordenamiento","doc":"🟡 Stack that supports push, pop, top and get_min, ALL in O(1).\nPila que devuelve su mínimo en O(1).","stub":"class MinStack:\n    \"\"\"🟡 Stack that supports push, pop, top and get_min, ALL in O(1).\n    Pila que devuelve su mínimo en O(1).\n    \"\"\"\n\n    def __init__(self):\n        raise NotImplementedError\n\n    def push(self, x):\n        raise NotImplementedError\n\n    def pop(self):\n        raise NotImplementedError\n\n    def top(self):\n        raise NotImplementedError\n\n    def get_min(self):\n        raise NotImplementedError","solution":"class MinStack:\n    # Trick: store, next to each value, the minimum up to that point.\n    # Truco: guardar junto a cada valor el mínimo que había hasta ese punto.\n    def __init__(self):\n        self._stack = []        # pairs (value, min_so_far) / pares (valor, mínimo_hasta_aquí)\n\n    def push(self, x):\n        current_min = min(x, self._stack[-1][1]) if self._stack else x\n        self._stack.append((x, current_min))\n\n    def pop(self):\n        return self._stack.pop()[0]\n\n    def top(self):\n        return self._stack[-1][0]\n\n    def get_min(self):\n        return self._stack[-1][1]"},{"name":"reverse_linked_list","section":"🟢 Stack / search / sorting — Pila / búsqueda / ordenamiento","doc":"🟡 Reverse a singly linked list and return the new head.\nInvierte una lista enlazada.\n1 -> 2 -> 3   =>   3 -> 2 -> 1","stub":"def reverse_linked_list(head):\n    \"\"\"🟡 Reverse a singly linked list and return the new head.\n    Invierte una lista enlazada.\n    1 -> 2 -> 3   =>   3 -> 2 -> 1\n    \"\"\"\n    raise NotImplementedError","solution":"def reverse_linked_list(head):\n    # Three pointers: prev, current, next. O(n) time, O(1) space.\n    # Tres punteros: prev, current, next. O(n) tiempo, O(1) espacio.\n    prev = None\n    current = head\n    while current:\n        nxt = current.next      # save the next node before breaking the link / guardar el siguiente antes de romper el enlace\n        current.next = prev     # reverse the link / invertir el enlace\n        prev = current\n        current = nxt\n    return prev"},{"name":"merge_sort","section":"🟡 Patterns / Patrones","doc":"🟡 Return a NEW sorted list using merge sort (divide and conquer).\nImplementa merge sort.\n>>> merge_sort([38, 27, 43, 3, 9, 82, 10])\n[3, 9, 10, 27, 38, 43, 82]","stub":"def merge_sort(nums):\n    \"\"\"🟡 Return a NEW sorted list using merge sort (divide and conquer).\n    Implementa merge sort.\n    >>> merge_sort([38, 27, 43, 3, 9, 82, 10])\n    [3, 9, 10, 27, 38, 43, 82]\n    \"\"\"\n    raise NotImplementedError","solution":"def merge_sorted(a, b):\n    i = j = 0\n    result = []\n    while i < len(a) and j < len(b):        # O(n + m)\n        if a[i] <= b[j]:                    # \"<=\" keeps it stable / mantiene la estabilidad\n            result.append(a[i])\n            i += 1\n        else:\n            result.append(b[j])\n            j += 1\n    result.extend(a[i:])                    # whatever is left in either list / lo que sobre de cualquiera\n    result.extend(b[j:])\n    return result\n\n\ndef merge_sort(nums):\n    # Divide and conquer: always O(n log n), O(n) space. / Divide y vencerás.\n    if len(nums) <= 1:\n        return list(nums)\n    mid = len(nums) // 2\n    return merge_sorted(merge_sort(nums[:mid]), merge_sort(nums[mid:]))"},{"name":"max_subarray_sum","section":"🟡 Patterns / Patrones","doc":"🟡 Return the largest sum of a contiguous, non-empty subarray (Kadane).\nMayor suma de un subarreglo contiguo.\n>>> max_subarray_sum([-2, 1, -3, 4, -1, 2, 1, -5, 4])\n6","stub":"def max_subarray_sum(nums):\n    \"\"\"🟡 Return the largest sum of a contiguous, non-empty subarray (Kadane).\n    Mayor suma de un subarreglo contiguo.\n    >>> max_subarray_sum([-2, 1, -3, 4, -1, 2, 1, -5, 4])\n    6\n    \"\"\"\n    raise NotImplementedError","solution":"def max_subarray_sum(nums):\n    # Kadane: at each position, is it better to extend the subarray or to start again? O(n).\n    # Kadane: en cada posición, ¿conviene extender el subarreglo o empezar de nuevo? O(n).\n    best = current = nums[0]\n    for x in nums[1:]:\n        current = max(x, current + x)\n        best = max(best, current)\n    return best"},{"name":"longest_unique_substring","section":"🟡 Patterns / Patrones","doc":"🟡 Return the LENGTH of the longest substring without repeating\ncharacters (sliding window).\nLongitud del substring más largo sin caracteres repetidos.\n>>> longest_unique_substring(\"abcabcbb\")\n3","stub":"def longest_unique_substring(s):\n    \"\"\"🟡 Return the LENGTH of the longest substring without repeating\n    characters (sliding window).\n    Longitud del substring más largo sin caracteres repetidos.\n    >>> longest_unique_substring(\"abcabcbb\")\n    3\n    \"\"\"\n    raise NotImplementedError","solution":"def longest_unique_substring(s):\n    # Sliding window [left, i]; last_seen stores the last position of each character. O(n).\n    # Ventana deslizante [left, i]; last_seen guarda la última posición de cada carácter. O(n).\n    last_seen = {}\n    left = best = 0\n    for i, ch in enumerate(s):\n        if ch in last_seen and last_seen[ch] >= left:\n            left = last_seen[ch] + 1            # move the window start past the repeat / mover el inicio tras el repetido\n        last_seen[ch] = i\n        best = max(best, i - left + 1)\n    return best"},{"name":"group_anagrams","section":"🟡 Patterns / Patrones","doc":"🟡 Group words that are anagrams. Return a list of groups where each\ngroup is sorted alphabetically and the groups are sorted by their first word.\nAgrupa anagramas.\n>>> group_anagrams([\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"])\n[['ate', 'eat', 'tea'], ['bat'], ['nat', 'tan']]","stub":"def group_anagrams(words):\n    \"\"\"🟡 Group words that are anagrams. Return a list of groups where each\n    group is sorted alphabetically and the groups are sorted by their first word.\n    Agrupa anagramas.\n    >>> group_anagrams([\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"])\n    [['ate', 'eat', 'tea'], ['bat'], ['nat', 'tan']]\n    \"\"\"\n    raise NotImplementedError","solution":"from collections import Counter, defaultdict, deque\n\ndef group_anagrams(words):\n    # Key = the word with its letters sorted: anagrams share the key.\n    # Clave = la palabra con sus letras ordenadas: los anagramas comparten la clave.\n    groups = defaultdict(list)\n    for w in words:\n        groups[\"\".join(sorted(w))].append(w)\n    return sorted(sorted(g) for g in groups.values())"},{"name":"top_k_frequent","section":"🟡 Patterns / Patrones","doc":"🟡 Return the k most frequent elements, most frequent first. Ties are\nbroken by the smaller value first.\nLos k elementos más frecuentes.\n>>> top_k_frequent([1, 1, 1, 2, 2, 3], 2)\n[1, 2]","stub":"def top_k_frequent(nums, k):\n    \"\"\"🟡 Return the k most frequent elements, most frequent first. Ties are\n    broken by the smaller value first.\n    Los k elementos más frecuentes.\n    >>> top_k_frequent([1, 1, 1, 2, 2, 3], 2)\n    [1, 2]\n    \"\"\"\n    raise NotImplementedError","solution":"from collections import Counter, defaultdict, deque\n\ndef top_k_frequent(nums, k):\n    counts = Counter(nums)\n    ordered = sorted(counts, key=lambda x: (-counts[x], x))   # O(n log n); with a heap: O(n log k)\n    return ordered[:k]"},{"name":"climb_stairs","section":"🟡 Patterns / Patrones","doc":"🟡 You can climb 1 or 2 steps at a time. In how many distinct ways can\nyou reach step n? (dynamic programming)\n¿De cuántas formas subes n escalones dando pasos de 1 o 2?\n>>> climb_stairs(4)\n5","stub":"def climb_stairs(n):\n    \"\"\"🟡 You can climb 1 or 2 steps at a time. In how many distinct ways can\n    you reach step n? (dynamic programming)\n    ¿De cuántas formas subes n escalones dando pasos de 1 o 2?\n    >>> climb_stairs(4)\n    5\n    \"\"\"\n    raise NotImplementedError","solution":"def climb_stairs(n):\n    # To reach n you come from n-1 or n-2 → ways(n) = ways(n-1) + ways(n-2) (it is Fibonacci!).\n    # Para llegar a n vienes de n-1 o de n-2 → ways(n) = ways(n-1) + ways(n-2) (¡es Fibonacci!).\n    a, b = 1, 1                 # ways to reach steps 0 and 1 / formas de llegar a los escalones 0 y 1\n    for _ in range(n - 1):\n        a, b = b, a + b\n    return b if n >= 1 else 1"},{"name":"count_islands","section":"🟡 Patterns / Patrones","doc":"🟡 grid is a list of strings of '1' (land) and '0' (water). Count the\nislands (groups of '1' connected horizontally or vertically). DFS/BFS.\nCuenta las islas.\n>>> count_islands([\"110\", \"010\", \"001\"])\n2","stub":"def count_islands(grid):\n    \"\"\"🟡 grid is a list of strings of '1' (land) and '0' (water). Count the\n    islands (groups of '1' connected horizontally or vertically). DFS/BFS.\n    Cuenta las islas.\n    >>> count_islands([\"110\", \"010\", \"001\"])\n    2\n    \"\"\"\n    raise NotImplementedError","solution":"def count_islands(grid):\n    # DFS: when you find unvisited land, count one island and \"sink\" the whole island. O(rows × cols).\n    # DFS: al encontrar tierra no visitada, cuenta una isla y \"hunde\" toda la isla. O(filas × columnas).\n    if not grid:\n        return 0\n    rows, cols = len(grid), len(grid[0])\n    seen = set()\n\n    def sink(r, c):\n        stack = [(r, c)]        # iterative DFS (avoids the recursion limit) / DFS iterativo (evita el límite de recursión)\n        while stack:\n            r, c = stack.pop()\n            if (r, c) in seen or not (0 <= r < rows and 0 <= c < cols) or grid[r][c] != \"1\":\n                continue\n            seen.add((r, c))\n            stack.extend([(r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)])\n\n    islands = 0\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == \"1\" and (r, c) not in seen:\n                islands += 1\n                sink(r, c)\n    return islands"},{"name":"shortest_path","section":"🟡 Patterns / Patrones","doc":"🟡 grid is a list of strings: '.' = open cell, '#' = wall. Return the\nminimum number of moves (up/down/left/right) from the top-left to the\nbottom-right cell, or -1 if impossible. BFS.\nCamino más corto en un laberinto.\n>>> shortest_path([\"..#\", \"#..\", \"...\"])\n4","stub":"def shortest_path(grid):\n    \"\"\"🟡 grid is a list of strings: '.' = open cell, '#' = wall. Return the\n    minimum number of moves (up/down/left/right) from the top-left to the\n    bottom-right cell, or -1 if impossible. BFS.\n    Camino más corto en un laberinto.\n    >>> shortest_path([\"..#\", \"#..\", \"...\"])\n    4\n    \"\"\"\n    raise NotImplementedError","solution":"from collections import Counter, defaultdict, deque\n\ndef shortest_path(grid):\n    # BFS explores level by level, so the first time it reaches the target is via the shortest path.\n    # BFS explora por niveles: la primera vez que llega al destino es por el camino más corto.\n    rows, cols = len(grid), len(grid[0])\n    if grid[0][0] == \"#\" or grid[rows - 1][cols - 1] == \"#\":\n        return -1\n    queue = deque([(0, 0, 0)])  # (row, col, distance) / (fila, columna, distancia)\n    seen = {(0, 0)}\n    while queue:\n        r, c, dist = queue.popleft()\n        if (r, c) == (rows - 1, cols - 1):\n            return dist\n        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            nr, nc = r + dr, c + dc\n            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == \".\" and (nr, nc) not in seen:\n                seen.add((nr, nc))\n                queue.append((nr, nc, dist + 1))\n    return -1"}],"grader":"\"\"\"Grader for problemas.py (no dependencies) / Corrector de problemas.py (sin dependencias).\n\n    python3 test_problemas.py              # grades your answers / corrige tus respuestas\n    python3 test_problemas.py soluciones   # checks the reference solutions / verifica las soluciones de referencia\n\"\"\"\nimport importlib\nimport random\nimport sys\n\nCASES = {\n    \"two_sum\": [(([2, 7, 11, 15], 9), [0, 1]), (([3, 2, 4], 6), [1, 2]), (([3, 3], 6), [0, 1]),\n                (([1, 2], 7), [])],\n    \"first_unique_char\": [((\"blendblend360\",), 10), ((\"aabb\",), -1), ((\"x\",), 0)],\n    \"missing_number\": [(([3, 0, 1],), 2), (([0, 1],), 2), (([1],), 0)],\n    \"move_zeros\": [(([0, 1, 0, 3, 12],), [1, 3, 12, 0, 0]), (([0],), [0]), (([1, 2],), [1, 2])],\n    \"rotate_right\": [(([1, 2, 3, 4, 5], 2), [4, 5, 1, 2, 3]), (([1, 2], 5), [2, 1]),\n                     (([1, 2, 3], 0), [1, 2, 3]), (([], 3), [])],\n    \"max_profit\": [(([7, 1, 5, 3, 6, 4],), 5), (([7, 6, 4, 3, 1],), 0), (([2, 4, 1, 7],), 6)],\n    \"valid_parentheses\": [((\"([]{})\",), True), ((\"(]\",), False), ((\"((\",), False), ((\")\",), False),\n                          ((\"\",), True), ((\"{[()()]}\",), True)],\n    \"binary_search\": [(([1, 3, 5, 7, 9], 7), 3), (([1, 3, 5, 7, 9], 4), -1), (([], 1), -1),\n                      (([5], 5), 0)],\n    \"bubble_sort\": [(([5, 1, 4, 2],), [1, 2, 4, 5]), (([],), []), (([3, 3, 1],), [1, 3, 3])],\n    \"merge_sorted\": [(([1, 4, 9], [2, 3, 10]), [1, 2, 3, 4, 9, 10]), (([], [1]), [1]), (([], []), [])],\n    \"merge_sort\": [(([38, 27, 43, 3, 9, 82, 10],), [3, 9, 10, 27, 38, 43, 82]), (([],), []),\n                   (([2, 1],), [1, 2])],\n    \"max_subarray_sum\": [(([-2, 1, -3, 4, -1, 2, 1, -5, 4],), 6), (([-3, -1, -2],), -1), (([5],), 5)],\n    \"longest_unique_substring\": [((\"abcabcbb\",), 3), ((\"bbbbb\",), 1), ((\"pwwkew\",), 3), ((\"\",), 0),\n                                 ((\"abba\",), 2)],\n    \"group_anagrams\": [(([\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"],),\n                        [[\"ate\", \"eat\", \"tea\"], [\"bat\"], [\"nat\", \"tan\"]]), (([],), [])],\n    \"top_k_frequent\": [(([1, 1, 1, 2, 2, 3], 2), [1, 2]), (([4, 4, 5, 5, 6], 2), [4, 5]), (([7], 1), [7])],\n    \"climb_stairs\": [((1,), 1), ((2,), 2), ((4,), 5), ((10,), 89)],\n    \"count_islands\": [(([\"110\", \"010\", \"001\"],), 2), (([\"000\"],), 0),\n                      (([\"11000\", \"11000\", \"00100\", \"00011\"],), 3)],\n    \"shortest_path\": [(([\"..#\", \"#..\", \"...\"],), 4), (([\".#\", \"#.\"],), -1), (([\".\"],), 0)],\n}\n\n\ndef _linked(values, node_cls):\n    head = None\n    for v in reversed(values):\n        head = node_cls(v, head)\n    return head\n\n\ndef _to_list(head):\n    out = []\n    while head:\n        out.append(head.val)\n        head = head.next\n    return out\n\n\ndef _check_special(module, name):\n    if name == \"MinStack\":\n        s = module.MinStack()\n        for x in (5, 3, 7, 3, 1):\n            s.push(x)\n        assert s.get_min() == 1, \"get_min should be 1 / debería ser 1\"\n        assert s.pop() == 1 and s.get_min() == 3, \"after pop, get_min should be 3 / tras pop, debería ser 3\"\n        s.pop()\n        assert s.get_min() == 3 and s.top() == 7, \"min is still 3 (there is another 3) / el mínimo 3 sigue (hay otro 3)\"\n        s.pop()\n        s.pop()\n        assert s.get_min() == 5 and s.top() == 5\n    elif name == \"reverse_linked_list\":\n        for values in ([1, 2, 3], [], [9]):\n            got = _to_list(module.reverse_linked_list(_linked(values, module.ListNode)))\n            assert got == values[::-1], f\"{values} → {got}\"\n    elif name == \"bubble_sort\":\n        data = [3, 1, 2]\n        module.bubble_sort(data)\n        assert data == [3, 1, 2], \"bubble_sort must not modify the input / no debe modificar la lista original\"\n    elif name == \"merge_sort\":\n        rng = random.Random(360)\n        for _ in range(50):\n            data = [rng.randint(-50, 50) for _ in range(rng.randint(0, 30))]\n            assert module.merge_sort(data) == sorted(data), f\"merge_sort fails with / falla con {data}\"\n\n\ndef run(module_name):\n    module = importlib.import_module(module_name)\n    names = list(CASES) + [\"MinStack\", \"reverse_linked_list\"]\n    passed = failed = pending = 0\n    for name in names:\n        try:\n            for args, expected in CASES.get(name, []):\n                got = getattr(module, name)(*args)\n                if got != expected:\n                    raise AssertionError(f\"{name}{args} → {got!r}, expected / se esperaba {expected!r}\")\n            _check_special(module, name)\n        except NotImplementedError:\n            pending += 1\n            print(f\"  ⏳ {name}: pending / pendiente\")\n            continue\n        except Exception as exc:  # noqa: BLE001\n            failed += 1\n            print(f\"  ❌ {name}: {exc}\")\n            continue\n        passed += 1\n        print(f\"  ✅ {name}\")\n    print(f\"\\n{module_name}.py → {passed}/{len(names)} correct / correctos, {failed} failed / con errores, {pending} pending / pendientes\")\n    return failed == 0 and pending == 0\n\n\nif __name__ == \"__main__\":\n    target = sys.argv[1] if len(sys.argv) > 1 else \"problemas\"\n    sys.exit(0 if run(target) else 1)\n","prelude":"class ListNode:\n    \"\"\"Singly linked list node / Nodo de lista enlazada simple.\"\"\"\n\n    def __init__(self, val, next=None):\n        self.val = val\n        self.next = next"}}</script><!-- LAB-DATA-END -->
<script>
"use strict";
// ---------------------------------------------------------------- utilidades

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const KEYS = ["A", "B", "C", "D"];
let uid = 0;

// ---------------------------------------------------------------- figuras SVG
// Todo se dibuja con currentColor (tinta) y var(--card) (papel) para funcionar en ambos temas.

const svg = (body, vb = 100) => `<svg class="fig" viewBox="0 0 ${vb} ${vb}" aria-hidden="true">${body}</svg>`;

function fillAttrs(fill, id) {
  if (fill === "black") return `fill="${INK}"`;
  if (fill === "striped") return `fill="url(#p${id})"`;
  return PP;
}
function stripeDef(id) {
  return `<defs><pattern id="p${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" ${PP}/><rect width="2.4" height="6" fill="${INK}"/></pattern></defs>`;
}
function shapePath(shape, cx, cy, r) {
  switch (shape) {
    case "circle": return `<circle cx="${cx}" cy="${cy}" r="${r}"`;
    case "square": return `<rect x="${cx - r * 0.88}" y="${cy - r * 0.88}" width="${r * 1.76}" height="${r * 1.76}"`;
    case "triangle": return `<polygon points="${cx},${cy - r} ${cx + r * 0.95},${cy + r * 0.75} ${cx - r * 0.95},${cy + r * 0.75}"`;
    case "diamond": return `<polygon points="${cx},${cy - r} ${cx + r},${cy} ${cx},${cy + r} ${cx - r},${cy}"`;
    case "star": {
      const pts = [];
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; pts.push(`${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`); }
      return `<polygon points="${pts.join(" ")}"`;
    }
  }

function shapeSVG(shape, cx, cy, r, fill) {

  return (fill === "striped" ? stripeDef(id) : "") + `${shapePath(shape, cx, cy, r)} ${fillAttrs(fill, id)} stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
}
function arrowSVG(angle, dotFill) {
  let s = `<g transform="rotate(${angle} 50 50)"><path d="M50 12 L72 40 L58 40 L58 86 L42 86 L42 40 L28 40 Z" fill="${INK}"/></g>`;
  if (dotFill) s += `<circle cx="80" cy="80" r="9" ${dotFill === "black" ? `fill="${INK}"` : PP} stroke="${INK}" stroke-width="3"/>`;
  return svg(s);

function flagSVG(angle) {

}
function countSVG(n, shape, fill = "black") {
  const cols = n <= 4 ? 2 : n <= 9 ? 3 : 4, rows = Math.ceil(n / cols), step = 84 / Math.max(cols, rows), r = step * 0.34;
  let body = "";
  for (let i = 0; i < n; i++) {
    const c = i % cols, rw = Math.floor(i / cols);
    const cx = 50 + (c - (cols - 1) / 2) * step, cy = 50 + (rw - (rows - 1) / 2) * step;
    body += shapeSVG(shape, +cx.toFixed(1), +cy.toFixed(1), +r.toFixed(1), fill);

}
function polygonSVG(n) {
  if (n === 0) return svg(`<circle cx="50" cy="50" r="36" ${PP} stroke="${INK}" stroke-width="3.5"/>`);
  const pts = [];
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; pts.push(`${(50 + 38 * Math.cos(a)).toFixed(1)},${(52 + 38 * Math.sin(a)).toFixed(1)}`); }
  return svg(`<polygon points="${pts.join(" ")}" ${PP} stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`);

const BORDER = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];
function gridDotSVG(cell, cell2) {
  let body = "";
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) body += `<rect x="${8 + c * 28}" y="${8 + r * 28}" width="28" height="28" ${PP} stroke="${INK}" stroke-width="2"/>`;
  const dot = (p, f) => `<circle cx="${22 + p[0] * 28}" cy="${22 + p[1] * 28}" r="9" ${f} stroke="${INK}" stroke-width="2.5"/>`;

function finish(q, correct, distractors) {
  const key = o => o.key;
  const seen = new Set([key(correct)]);
  const opts = [correct];
  for (const d of distractors) { if (opts.length === 4) break; if (!seen.has(key(d))) { seen.add(key(d)); opts.push(d); } }
  const order = shuffle(opts);
  q.options = order.map(o => ({ svg: o.svg, text: o.text }));
  q.answer = order.indexOf(correct);
  return q;
}

const TECH_TOPICS = ["SQL", "Python", "Algorithms", "Databases", "AWS", "Stats"];
const TOPIC_NAME = { SQL: { es: "SQL", en: "SQL" }, Python: { es: "Python", en: "Python" }, Algorithms: { es: "Algoritmos", en: "Algorithms" },
  Databases: { es: "Bases de datos", en: "Databases" }, AWS: { es: "AWS", en: "AWS" }, Stats: { es: "Estadística y ML", en: "Statistics and ML" } };

function techQuestion(row) {
  const [topic, prompt, code, opts, ans, exEs, promptEs, exEn, optsEs] = row;
  const order = shuffle(opts.map((txt, i) => ({ txt, i })));
  return { topic: TOPIC_NAME[topic], prompt, es: promptEs, code, options: order.map(o => ({ text: o.txt })),
    optsEs: optsEs ? order.map(o => optsEs[o.i]) : null, answer: order.findIndex(o => o.i === ans), explain: { es: exEs, en: exEn } };
}
function buildTechExam(n = 40) {
  const per = { SQL: 11, Python: 10, Algorithms: 8, Databases: 4, AWS: 7 };
  let qs = [];
  for (const tp of TECH_TOPICS) qs = qs.concat(shuffle(BANK.filter(r => r[0] === tp)).slice(0, per[tp] || 0));   // Stats: solo práctica / practice only
  return shuffle(qs).slice(0, n).map(techQuestion);
}

  get() { try { return JSON.parse(localStorage.getItem("sim3090-history") || "[]"); } catch { return []; } },

let tick = null;

function startExam(mode) {
  const m = MODES[mode];
  const questions = mode === "abstract" ? ABSTRACT_PLAN.map(g => g()) : buildTechExam(m.count);
  S = { view: "exam", mode, questions, answers: Array(questions.length).fill(null), flags: Array(questions.length).fill(false), tr: {}, cur: 0,
        endsAt: Date.now() + m.minutes * 60000, startedAt: Date.now() };
  runTimer(); render();
}
function startPractice(topic) {
  S = { view: "practice", practiceTopic: topic, q: practiceQuestion(topic), chosen: null, done: 0, right: 0, tr: {} };
  render();
}
const VISUAL_GENS = [genRotation, genCount, genTwoRules, genPosition, genSides, genQuadrant, genMatrix, genLatin, genDomino];
function practiceQuestion(topic) {
  if (topic === "visual") return pick(VISUAL_GENS)();
  if (topic === "series") return pick([genNumber, genLetters, genDomino])();
  return techQuestion(pick(BANK.filter(r => r[0] === topic)));
}
function runTimer() {
  clearInterval(tick);
  tick = setInterval(() => {
    if (S.view !== "exam") return clearInterval(tick);
    const left = S.endsAt - Date.now();
    if (left <= 0) { finishExam(true); return; }
    const el = $("#timer");
    if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left < 5 * 60000); }
  }, 500);
}
const fmtTime = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
function finishExam(timeUp = false) {
  clearInterval(tick);
  const correct = S.questions.filter((q, i) => S.answers[i] === q.answer).length;
  const used = Math.min(Date.now(), S.endsAt) - S.startedAt;
  S = { ...S, view: "results", correct, used, timeUp };
  store.add({ mode: S.mode, score: `${correct}/${S.questions.length}`, date: new Date().toISOString(), time: fmtTime(used) });
  render(); window.scrollTo({ top: 0 });
}

// ---------------------------------------------------------------- SQL: motor (SQLite compilado a WebAssembly)
let SQLjs = null, sqlLoading = null, LABDB = null;
function sqlEngine() {
  if (SQLjs) return Promise.resolve(SQLjs);
  if (!sqlLoading) {
    sqlLoading = (async () => {
      try {
        await loadScript(CDN_SQL + "sql-wasm.js");
        SQLjs = await window.initSqlJs({ locateFile: f => CDN_SQL + f });
      } catch {
        // Sin WebAssembly (o si no se puede descargar el .wasm): versión asm.js, más lenta pero autónoma.
        await loadScript(CDN_SQL + "sql-asm.js");
        SQLjs = await window.initSqlJs();
      }
      LABDB = freshDb();
      return SQLjs;
    })().catch(e => { sqlLoading = null; throw e; });
  }
  return sqlLoading;
}
function freshDb() { const db = new SQLjs.Database(); db.exec(LAB.sql.schema); return db; }

// Ejecuta una o varias sentencias y devuelve el último resultado con columnas (aunque tenga 0 filas).
function runSql(db, code) {
  let last = null, changed = 0;
  for (const stmt of db.iterateStatements(code)) {
    try {
      const cols = stmt.getColumnNames();
      const rows = [];
      while (stmt.step()) rows.push(stmt.get());
      if (cols.length) last = { cols, rows };
      else changed += db.getRowsModified();
    } finally { stmt.free(); }
  }
  return { result: last, changed };
}

const normVal = v => (v === null || v === undefined ? "NULL" : typeof v === "number" ? (Math.round(v * 100) / 100).toFixed(2) : String(v));
const rowKey = r => r.map(normVal).join("\u0001");
const sameList = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

// ¿La solución ordena en el nivel superior (no dentro de OVER(...) ni de una subconsulta)?
function topLevelOrder(code) {
  const s = code.replace(/--[^\n]*/g, "").replace(/'(?:[^']|'')*'/g, "''").toLowerCase();
  let depth = 0;
  for (let i = 0; i < s.length; i++) {
    if (s[i] === "(") depth++;
    else if (s[i] === ")") depth--;
    else if (depth === 0 && /^order\s+by\b/.test(s.slice(i, i + 12)) && !/\w/.test(s[i - 1] || " ")) return true;
  }
  return false;
}

// Busca, para cada columna esperada, una columna distinta del usuario con los mismos valores.
// Así se aceptan columnas en otro orden o columnas de más: se califica el resultado, no la forma.
// Con flexible = true (el enunciado no dice qué columnas mostrar) basta con un subconjunto de las columnas
// esperadas que identifique las mismas filas.
function alignColumns(user, sol, ordered, flexible = false) {
  const col = (res, k) => res.rows.map(r => normVal(r[k]));
  const sig = (vals, keepOrder) => (keepOrder ? vals : [...vals].sort()).join("\u0001");
  const userSig = user.cols.map((_, k) => sig(col(user, k), false));
  const cands = sol.cols.map((_, j) => { const want = sig(col(sol, j), false); return user.cols.map((_, k) => k).filter(k => userSig[k] === want); });
  const pick = [], used = new Set(); // pick[j] = columna del usuario para la esperada j, o -1 si se omite
  let unordered = null;
  const tryMap = () => {
    const js = pick.map((k, j) => j).filter(j => pick[j] >= 0);
    if (!js.length) return null;
    const E = sol.rows.map(r => rowKey(js.map(j => r[j])));
    const U = user.rows.map(r => rowKey(js.map(j => r[pick[j]])));
    if (sameList(U, E)) return "ok";
    if (sameList([...U].sort(), [...E].sort())) return ordered ? "order" : "ok";
    return null;
  };
  const walk = j => {
    if (j === sol.cols.length) { const r = tryMap(); if (r === "ok") return pick.slice(); if (r === "order" && !unordered) unordered = pick.slice(); return null; }
    for (const k of cands[j]) {
      if (used.has(k)) continue;
      used.add(k); pick.push(k);
      const found = walk(j + 1);
      used.delete(k); pick.pop();
      if (found) return found;
    }
    if (flexible) { pick.push(-1); const found = walk(j + 1); pick.pop(); if (found) return found; }
    return null;
  };
  const exact = walk(0);
  return exact ? { status: "ok", map: exact } : unordered ? { status: "order", map: unordered } : null;
}

async function checkSql(item, code) {
  await sqlEngine();
  const ref = item.sql.en;
  const dbU = freshDb(), dbS = freshDb();
  try {
    let user;
    try { user = runSql(dbU, code).result; } catch (e) { return { status: "error", error: e.message }; }
    const sol = runSql(dbS, ref).result;
    // Si la solución tiene empates en su ORDER BY, el orden de esas filas no es único: no se exige.
    dbS.run("PRAGMA reverse_unordered_selects = ON");
    const sol2 = runSql(dbS, ref).result;
    const ordered = item.ordered && sameList(sol.rows.map(rowKey), sol2.rows.map(rowKey));
    const base = { expected: sol, got: user };
    if (!user) return { ...base, status: "norows" };
    if (user.cols.length < sol.cols.length && !item.flexCols) return { ...base, status: "cols" };
    if (user.rows.length !== sol.rows.length) return { ...base, status: "rows" };
    const match = alignColumns(user, sol, ordered, item.flexCols);
    if (!match) return { ...base, status: "values" };
    if (match.status === "order") return { ...base, status: "order" };
    // Correcta. Si las columnas no están igual que en la solución, se avisa sin restar.
    const same = user.cols.length === sol.cols.length && match.map.every((k, j) => k === j);
    const shape = same ? null : match.map.includes(-1) ? "subset" : user.cols.length > sol.cols.length ? "extra" : "moved";
    return { ...base, status: "ok", shape };
  } finally { dbU.close(); dbS.close(); }
}

// Palabras reservadas de SQL que no sirven como alias (p. ej. "orders AS or").
const RESERVED = new Set(("or and not order group by as on in is from where select join left right inner outer full cross natural using " +
  "case when then else end limit offset desc asc set to all distinct union except intersect key index table values into null like between exists " +
  "having primary references default check unique create drop insert update delete").split(" "));

// Mensajes de SQLite → explicación corta (los errores reales salen en inglés).

    en: `<code>${esc(m[1])}</code> is a <strong>SQL reserved word</strong> (${esc(m[1].toUpperCase())}), so it cannot be an alias or a name. If you used it as an alias (for example <code>orders AS ${esc(m[1])}</code>), pick another one: <code>o</code>, <code>ord</code>, <code>t1</code>… This fails the same way in PostgreSQL, MySQL and SQL Server.` })],

  [/ambiguous column name: ([\w.]+)/i, m => ({ es: `<code>${esc(m[1])}</code> existe en dos tablas del JOIN: escribe <code>tabla.columna</code> (por ejemplo <code>o.customer_id</code>).`, en: `<code>${esc(m[1])}</code> exists in two tables of the JOIN: write <code>table.column</code> (for example <code>o.customer_id</code>).` })],
  [/misuse of window function/i, () => ({ es: "No se puede usar una función de ventana en WHERE ni en GROUP BY. Calcúlala en un CTE o subconsulta y filtra afuera.", en: "A window function cannot be used in WHERE or GROUP BY. Compute it in a CTE or subquery and filter outside." })],

// ---------------------------------------------------------------- Python: motor (Pyodide en un Web Worker)
const PY_HARNESS = `
import contextlib, copy, io, json, sys, traceback, types
_GRADERS, _PRELUDES = {}, {}

def setup(kind, grader_src, prelude):
    module = types.ModuleType("grader_" + kind)
    exec(grader_src, module.__dict__)
    _GRADERS[kind], _PRELUDES[kind] = module, prelude

def _short():
    etype, exc, tb = sys.exc_info()
    lines = [f.lineno for f in traceback.extract_tb(tb) if f.filename == "<code>"]
    return f"{etype.__name__}: {exc}" + (f" (line {lines[-1]})" if lines else "")

def grade(kind, name, code):
    out, res = io.StringIO(), {"cases": [], "error": None, "special": None, "stdout": ""}
    grader, module = _GRADERS[kind], types.ModuleType("user_code")
    try:
        with contextlib.redirect_stdout(out):
            exec(_PRELUDES[kind], module.__dict__)
            exec(compile(code, "<code>", "exec"), module.__dict__)
    except SyntaxError as exc:
        res["error"] = f"{type(exc).__name__}: {exc.msg} (line {exc.lineno})"
    except BaseException:
        res["error"] = _short()
    func = getattr(module, name, None)
    if res["error"] is None and func is None:
        res["error"] = f"NameError: '{name}' is not defined"
    if res["error"] is None:
        table = getattr(grader, "TESTS", None) or getattr(grader, "CASES", {})
        for args, expected in table.get(name, []):
            case = {"call": f"{name}({', '.join(map(repr, args))})", "expected": repr(expected)}
            try:
                with contextlib.redirect_stdout(out):
                    got = func(*copy.deepcopy(args))
                case.update(got=repr(got), ok=bool(got == expected))
            except NotImplementedError:
                case["pending"] = True
            except BaseException:
                case["error"] = _short()
            res["cases"].append(case)
        if all(c.get("ok") for c in res["cases"]):
            try:
                with contextlib.redirect_stdout(out):
                    grader._check_special(module, name)
                res["special"] = "ok"
            except NotImplementedError:
                res["special"] = "pending"
            except BaseException:
                res["special"] = _short()
    res["stdout"] = out.getvalue()[-4000:]
    return json.dumps(res)
`;
const PY_WORKER = `
importScripts("${CDN_PY}pyodide.js");
let py = null;
self.onmessage = async e => {
  const { id, op, args } = e.data;
  try {
    if (!py) py = await loadPyodide({ indexURL: "${CDN_PY}" });
    const result = op === "init" ? (py.runPython(args.harness), args.graders.forEach(g => py.globals.get("setup")(...g)), "ready")
      : py.globals.get("grade")(...args);
    self.postMessage({ id, result });
  } catch (err) { self.postMessage({ id, error: String((err && err.message) || err) }); }
};`;
const PY_TIMEOUT = 8000;
let pyWorker = null, pyReady = null, pyMain = null, pySeq = 0;
const pyWaiting = {};
const pyInit = () => ({ harness: PY_HARNESS, graders: ["py", "algo"].map(k => [k, LAB[k].grader, LAB[k].prelude]) });

function pyPost(op, args, timeout) {
  return new Promise((ok, fail) => {
    const id = ++pySeq;
    const timer = timeout && setTimeout(() => { delete pyWaiting[id]; pyWorker.terminate(); pyWorker = null; pyReady = null; fail(new Error("timeout")); }, timeout);
    pyWaiting[id] = { ok: v => { clearTimeout(timer); ok(v); }, fail: v => { clearTimeout(timer); fail(v); } };
    pyWorker.postMessage({ id, op, args });
  });
}
function pyEngine() {
  if (pyReady) return pyReady;
  pyReady = (async () => {
    try {
      pyWorker = new Worker(URL.createObjectURL(new Blob([PY_WORKER], { type: "text/javascript" })));
      pyWorker.onerror = ev => { // p. ej. si importScripts no puede descargar Pyodide
        ev.preventDefault();
        Object.keys(pyWaiting).forEach(id => { const w = pyWaiting[id]; delete pyWaiting[id]; w.fail(new Error(ev.message || "worker error")); });
      };
      pyWorker.onmessage = e => { const w = pyWaiting[e.data.id]; if (!w) return; delete pyWaiting[e.data.id]; e.data.error ? w.fail(new Error(e.data.error)) : w.ok(e.data.result); };
      await pyPost("init", pyInit());
      return "worker";
    } catch (e) {
      // Si este navegador no permite el worker, Python corre en la página (sin límite de tiempo).
      if (pyWorker) { pyWorker.terminate(); pyWorker = null; }
      await loadScript(CDN_PY + "pyodide.js");
      pyMain = await window.loadPyodide({ indexURL: CDN_PY });
      const init = pyInit();
      pyMain.runPython(init.harness);
      init.graders.forEach(g => pyMain.globals.get("setup")(...g));
      return "main";
    }
  })().catch(e => { pyReady = null; throw e; });
  return pyReady;
}
async function gradePy(set, name, code) {
  const mode = await pyEngine();
  const raw = mode === "worker" ? await pyPost("grade", [set, name, code], PY_TIMEOUT) : pyMain.globals.get("grade")(set, name, code);
  return JSON.parse(raw);
}

// ---------------------------------------------------------------- editor: sangría, Tab y Ctrl+Enter
function editorKeys(e) {
  const ed = e.target;
  if (ed.id !== "editor") return;
  const indent = "    ";
  const { selectionStart: a, selectionEnd: b, value: v } = ed;
  const insert = (text, from = a, to = b) => { ed.setRangeText(text, from, to, "end"); ed.dispatchEvent(new Event("input", { bubbles: true })); };
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    return S.view === "sql" ? (currentSql() ? sqlCheck() : sqlRun()) : pyRun();
  }
  if (e.key === "Tab" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    const lineStart = v.lastIndexOf("\n", a - 1) + 1;
    if (e.shiftKey) {
      const n = (v.slice(lineStart).match(/^ {1,4}/) || [""])[0].length;
      if (n) { ed.setRangeText("", lineStart, lineStart + n, "preserve"); ed.selectionStart = ed.selectionEnd = Math.max(lineStart, a - n); ed.dispatchEvent(new Event("input", { bubbles: true })); }
      return;
    }
    return insert(indent);
  }
  if (e.key === "Enter" && !e.shiftKey) {
    const lineStart = v.lastIndexOf("\n", a - 1) + 1;
    const line = v.slice(lineStart, a);
    let pad = line.match(/^\s*/)[0];
    if (S.view === "py" && /:\s*$/.test(line)) pad += indent;
    e.preventDefault();
    insert("\n" + pad);
  }
}

  return `<main class="wrap">
    <header class="hero">
      <div class="top"><span class="eyebrow">${L.chTitle}${ch.timeUp ? t("timeUp") : ""}</span>${langSwitch()}</div>
      <div class="score">${ringSVG(Math.round(100 * ch.score / ch.ids.length))}<div style="display:grid;gap:6px"><span class="big">${ch.score}/${ch.ids.length}</span><span class="progress">${t("timeUsed")} ${fmtTime(ch.used)}</span></div></div>
      <p>${ch.score >= 4 ? t("v1") : ch.score >= 3 ? t("v2") : t("v3")}</p>
    </header>
    <div class="row"><button class="btn primary" data-sqlch>${t("repeat")}</button><button class="btn ghost" data-home>${t("backHome")}</button></div>
    <section class="review"><h3>${t("review")}</h3>${ch.ids.map((ix, i) => {
      const item = LAB.sql.items[ix], ok = ch.status[i];
      return `<details ${ok ? "" : "open"}><summary><span class="pill ${ok ? "ok" : "no"}">${ok ? t("ok") : t("ko")}</span><span>${i + 1}. ${esc(tx(item.title))}</span></summary>
        <div style="display:grid;gap:10px;margin-top:10px"><p>${md(sqlPrompt(item))}</p>
        <h3 class="sub">${L.yours}</h3><pre class="code">${esc(lab.draft(`ch:${item.id}`) || "—")}</pre>
        <h3 class="sub">${L.solution}</h3><pre class="code">${esc(item.sql[LANG])}</pre>${item.note[LANG] ? `<p>${md(item.note[LANG])}</p>` : ""}
        <button class="btn ghost" data-lopen="${ix}" style="justify-self:start">${L.practiceIt}</button></div></details>`;
    }).join("")}</section>
  </main>`;
}
function pyView() {
  const L = t("lab"), item = currentPy(), key = pyKey(S.set, item), items = LAB[S.set].items, solved = lab.solved();
  const code = lab.draft(key) ?? item.stub;
  return `${labBar(L.pyTitle)}
  <main class="wrap">
    <div class="seg pytabs" role="tablist">${Object.keys(PYSETS).map(k => `<button role="tab" data-pyset="${k}" class="${S.set === k ? "on" : ""}" aria-selected="${S.set === k}">${esc(tx(PYSETS[k]))} (${LAB[k].items.length})</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" data-lprev ${S.idx <= 0 ? "disabled" : ""} aria-label="${t("prev")}">←</button>
      <select id="lsel" aria-label="${L.exercise}" style="flex:1;min-width:0">${items.map((it, i) => `<option value="${i}" ${i === S.idx ? "selected" : ""}>${solved.has(pyKey(S.set, it)) ? "✅" : "▫️"} ${i + 1}. ${esc(it.name)}</option>`).join("")}</select>
      <button class="btn ghost" data-lnext ${S.idx >= items.length - 1 ? "disabled" : ""} aria-label="${t("next")}">→</button></div>
    <div id="engine"></div>
    <article class="qcard">
      <div class="row" style="justify-content:space-between"><span class="tag">${esc(item.section)} · ${L.goal(PYSETS[S.set].min)}</span>
        ${solved.has(key) ? `<span class="pill ok">${L.solvedOne}</span>` : ""}</div>
      <h2><code>${esc(item.name)}</code></h2>
      <pre class="doc">${esc(item.doc)}</pre>
    </article>
    <section class="edcard">
      ${editorHtml(code, L.editor)}
      <div class="row">
        <button class="btn primary" data-pyrun>${L.runTests}</button>
        <button class="btn ghost" data-pyreset>${L.restore}</button>
        <span class="note">${L.keysPy}</span>
      </div>
    </section>
    <section id="lab-out" aria-live="polite">${S.out || ""}</section>
    <details class="sol" ${S.sol ? "open" : ""}><summary>${L.seeSolution}</summary><pre class="code">${esc(item.solution)}</pre></details>
    <p class="note">${L.pyNote}</p>
  </main>`;
}
function labCards() {
  const L = t("lab"), solved = lab.solved();
  const nSql = LAB.sql.items.filter(i => solved.has(sqlKey(i))).length;
  const nPy = ["py", "algo"].reduce((n, k) => n + LAB[k].items.filter(i => solved.has(pyKey(k, i))).length, 0);
  return `<section class="section-h"><span class="eyebrow">02 · ${L.eyebrow}</span><h2>${L.homeTitle}</h2><p class="muted">${L.homeDesc}</p></section>
    <section class="modes">
      <article class="mode featured">
        <span class="ico">${icon("sql")}</span>
        <h2>${L.sqlTitle}</h2>
        <p class="meta">${L.sqlMeta(LAB.sql.items.length)} · ${nSql}/${LAB.sql.items.length} ${L.solved}</p>
        <p>${L.sqlDesc}</p>
        <div class="row"><button class="btn primary" data-sqllab>${L.openSql}</button><button class="btn" data-sqlch>${L.chStart}</button></div>
      </article>
      <article class="mode">
        <span class="ico">${icon("py")}</span>
        <h2>${L.pyTitle}</h2>
        <p class="meta">${L.pyMeta(LAB.py.items.length, LAB.algo.items.length)} · ${nPy}/${LAB.py.items.length + LAB.algo.items.length} ${L.solved}</p>
        <p>${L.pyDesc}</p>
        <button class="btn primary" data-pylab>${L.openPy}</button>
      </article>
    </section>`;
}

// Eventos del laboratorio. Devuelve true si atendió el clic.
function labClick(b) {
  if (b.hasAttribute("data-sqllab")) { openSqlLab(0); return true; }
  if (b.hasAttribute("data-sqlch")) { startSqlChallenge(); return true; }
  if (b.hasAttribute("data-pylab")) { openPyLab("py", 0); return true; }
  if (S.view !== "sql" && S.view !== "py") return false;
  if (b.dataset.lopen !== undefined) { openSqlLab(Number(b.dataset.lopen)); return true; }
  if (b.dataset.peek) {
    sqlEngine().then(() => setOut(`<h3 class="sub">${esc(b.dataset.peek)}</h3>${tableHtml(runSql(LABDB, `SELECT * FROM "${b.dataset.peek}" LIMIT 20`).result)}`))
      .catch(() => {});
    return true;
  }
  if (b.dataset.pyset) { saveEditor(); S.set = b.dataset.pyset; goExercise(0, false); return true; }
  if (b.dataset.lgo !== undefined) { goExercise(Number(b.dataset.lgo)); return true; }
  if (b.hasAttribute("data-lprev")) { goExercise(S.idx - 1); return true; }
  if (b.hasAttribute("data-lnext")) { goExercise(S.idx + 1); return true; }
  if (b.hasAttribute("data-ltr")) { saveEditor(); S.tr = !S.tr; render(); return true; }
  if (b.hasAttribute("data-lrun")) { saveEditor(); sqlRun(); return true; }
  if (b.hasAttribute("data-lcheck")) { saveEditor(); sqlCheck(); return true; }
  if (b.hasAttribute("data-pyrun")) { saveEditor(); pyRun(); return true; }
  if (b.hasAttribute("data-lclear")) { const ed = $("#editor"); ed.value = ""; saveEditor(); ed.focus(); return true; }
  if (b.hasAttribute("data-pyreset")) { lab.clearDraft(pyKey(S.set, currentPy())); $("#editor").value = currentPy().stub; setOut(""); return true; }
  if (b.hasAttribute("data-lreset")) { if (SQLjs) { LABDB.close(); LABDB = freshDb(); } setOut(`<div class="feedback">${t("lab").dbReset}</div>`); return true; }
  if (b.hasAttribute("data-chfinish")) {
    if (!b.dataset.confirm) { b.dataset.confirm = "1"; b.textContent = t("lab").chConfirm; return true; }
    finishChallenge(false); return true;
  }
  return false;
}
document.addEventListener("keydown", editorKeys);
document.addEventListener("input", e => { if (e.target.id === "editor") saveEditor(); });
document.addEventListener("change", e => { if (e.target.id === "lsel") goExercise(Number(e.target.value)); });
document.addEventListener("toggle", e => { if (e.target.classList && e.target.classList.contains("sol")) S.sol = e.target.open; }, true);

// ---------------------------------------------------------------- eventos
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.lang) { saveEditor(); return setLang(b.dataset.lang); }
  if (b.dataset.qlang) { saveEditor(); return setQLang(b.dataset.qlang); }
  if (b.hasAttribute("data-theme-toggle")) { saveEditor(); return setTheme(THEME === "dark" ? "light" : "dark"); }
  if (labClick(b)) return;
  if (b.dataset.start) return startExam(b.dataset.start);
  if (b.hasAttribute("data-practice")) return startPractice($("#ptopic").value);
  if (b.hasAttribute("data-tr")) return toggleTr();
  if (b.hasAttribute("data-resample") || b.hasAttribute("data-home")) { saveEditor(); clearInterval(tick); S = { view: "home", practiceTopic: S.practiceTopic }; return render(); }
  if (b.dataset.opt !== undefined) {
    const i = Number(b.dataset.opt);
    if (S.view === "exam") { S.answers[S.cur] = i; return render(); }
    if (S.view === "practice" && S.chosen === null) { S.chosen = i; S.done++; if (i === S.q.answer) S.right++; return render(); }
    return;
  }
  if (b.hasAttribute("data-pnext")) { S.q = practiceQuestion(S.practiceTopic); S.chosen = null; S.tr = {}; return render(); }
  if (b.hasAttribute("data-next")) { S.cur++; return render(); }
  if (b.hasAttribute("data-prev")) { S.cur--; return render(); }
  if (b.hasAttribute("data-flag")) { S.flags[S.cur] = !S.flags[S.cur]; return render(); }
  if (b.dataset.go !== undefined) { S.cur = Number(b.dataset.go); return render(); }
  if (b.hasAttribute("data-finish")) {
    const blank = S.answers.filter(a => a === null).length;
    if (blank && !b.dataset.confirm) { b.dataset.confirm = "1"; b.textContent = t("blank")(blank); return; }
    return finishExam(false);
  }
});
document.addEventListener("keydown", e => {
  if (e.target.closest("select, input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  const idx = "ABCD".indexOf(k) >= 0 ? "ABCD".indexOf(k) : "1234".indexOf(k);
  if ((S.view === "exam" || S.view === "practice") && k === "T") return toggleTr();
  if (S.view === "exam") {
    if (idx >= 0 && idx < S.questions[S.cur].options.length) { S.answers[S.cur] = idx; render(); }
    else if (e.key === "ArrowRight" && S.cur < S.questions.length - 1) { S.cur++; render(); }
    else if (e.key === "ArrowLeft" && S.cur > 0) { S.cur--; render(); }
  } else if (S.view === "practice" && S.chosen === null && idx >= 0 && idx < S.q.options.length) {
    S.chosen = idx; S.done++; if (idx === S.q.answer) S.right++; render();
  }
});

// Conservar el intento en curso si la página se actualiza mientras está abierta.
window.claude?.hot?.snapshot?.(() => S);
function boot(data) {
  document.documentElement.lang = LANG;
  if (data && data.view) { S = data; if (S.view === "exam") runTimer(); }
  render();
  if (S.view === "sql" || S.view === "py") { labTimer(); S.view === "sql" ? prepareSql() : prepareEngineNote(); }
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
