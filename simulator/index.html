<style>

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {

    --paper: #11161b; --card: #1a2128; --ink: #e6eae2; --muted: #9aa4ae; --rule: #2d3640; --grid: #1d252c;
    --accent: #3fc9b8; --accent-ink: #0b1a18; --mark: #8a7420; --ok: #6fd08d; --ok-bg: #173323;
    --bad: #ff8a80; --bad-bg: #3a1b19; --flag: #f2b45a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161b; --card: #1a2128; --ink: #e6eae2; --muted: #9aa4ae; --rule: #2d3640; --grid: #1d252c;
  --accent: #3fc9b8; --accent-ink: #0b1a18; --mark: #8a7420; --ok: #6fd08d; --ok-bg: #173323;
  --bad: #ff8a80; --bad-bg: #3a1b19; --flag: #f2b45a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}

.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { border: 1.5px solid var(--ink); background: var(--card); border-radius: 6px; padding: 10px 16px; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.hero { display: grid; gap: 10px; }

.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.mode { background: var(--card); border: 1.5px solid var(--rule); border-radius: 10px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.mode .meta { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mode .btn { justify-self: start; }

.bar .in { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.timer { font-family: var(--font-mono); font-weight: 600; font-size: 1.25rem; font-variant-numeric: tabular-nums; }

.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.palette button { border: 1.5px solid var(--rule); background: var(--card); border-radius: 5px; padding: 5px 0; font-family: var(--font-mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.palette button.done { background: var(--ink); color: var(--card); border-color: var(--ink); }
.palette button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.palette button.flagged { border-color: var(--flag); box-shadow: inset 0 -3px 0 var(--flag); }
.feedback { border-left: 4px solid var(--ok); background: var(--ok-bg); padding: 10px 12px; border-radius: 0 6px 6px 0; }

.meter { height: 10px; background: var(--grid); border-radius: 999px; overflow: hidden; border: 1px solid var(--rule); }
.meter span { display: block; height: 100%; background: var(--accent); }
.review { display: grid; gap: 12px; }
.review details { background: var(--card); border: 1.5px solid var(--rule); border-radius: 8px; padding: 10px 14px; min-width: 0; }
.review summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.review .ans { font-family: var(--font-mono); font-size: 0.85rem; }
.pill { font-family: var(--font-mono); font-size: 0.75rem; padding: 1px 8px; border-radius: 999px; flex: none; }

.pill.no { background: var(--bad-bg); color: var(--bad); }
.note { font-size: 0.85rem; color: var(--muted); max-width: 70ch; }
.langsw { display: inline-flex; border: 1.5px solid var(--rule); border-radius: 6px; overflow: hidden; }

.langsw button.on { background: var(--ink); color: var(--card); }
.trbtn { justify-self: start; font-size: 0.9rem; padding: 7px 12px; }
.tr { border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card)); padding: 10px 14px; border-radius: 0 6px 6px 0; display: grid; gap: 6px; }
.tropts { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 2px; }
@media (max-width: 520px) {
  .options { grid-template-columns: 1fr; }
  .options.visual { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .seq .cell { width: 60px; height: 60px; }
  .opt .cell { width: 100%; max-width: 64px; height: auto; aspect-ratio: 1; }
  .options.visual .opt .k { width: 22px; height: 22px; font-size: 0.75rem; }
  .topics .t { grid-template-columns: 1fr auto; }
  .topics .t .meter { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt { transition: background-color .12s, border-color .12s; }
}

<script>
"use strict";
// ---------------------------------------------------------------- utilidades
const $ = (s, el = document) => el.querySelector(s);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mod = (a, m) => ((a % m) + m) % m;
const KEYS = ["A", "B", "C", "D"];
let uid = 0;

// ---------------------------------------------------------------- figuras SVG
// Todo se dibuja con currentColor (tinta) y var(--card) (papel) para funcionar en ambos temas.
const INK = "currentColor", PP = 'class="pp"'; // "papel": el fondo de tarjeta, vía CSS (var() no funciona en atributos SVG)
const svg = (body, vb = 100) => `<svg class="fig" viewBox="0 0 ${vb} ${vb}" aria-hidden="true">${body}</svg>`;

function fillAttrs(fill, id) {
  if (fill === "black") return `fill="${INK}"`;
  if (fill === "striped") return `fill="url(#p${id})"`;
  return PP;
}
function stripeDef(id) {
  return `<defs><pattern id="p${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" ${PP}/><rect width="2.4" height="6" fill="${INK}"/></pattern></defs>`;
}
function shapePath(shape, cx, cy, r) {
  switch (shape) {
    case "circle": return `<circle cx="${cx}" cy="${cy}" r="${r}"`;
    case "square": return `<rect x="${cx - r * 0.88}" y="${cy - r * 0.88}" width="${r * 1.76}" height="${r * 1.76}"`;
    case "triangle": return `<polygon points="${cx},${cy - r} ${cx + r * 0.95},${cy + r * 0.75} ${cx - r * 0.95},${cy + r * 0.75}"`;
    case "diamond": return `<polygon points="${cx},${cy - r} ${cx + r},${cy} ${cx},${cy + r} ${cx - r},${cy}"`;
    case "star": {
      const pts = [];
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; pts.push(`${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`); }
      return `<polygon points="${pts.join(" ")}"`;
    }
  }
}
function shapeSVG(shape, cx, cy, r, fill) {
  const id = ++uid;
  return (fill === "striped" ? stripeDef(id) : "") + `${shapePath(shape, cx, cy, r)} ${fillAttrs(fill, id)} stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
}
function arrowSVG(angle, dotFill) {
  let s = `<g transform="rotate(${angle} 50 50)"><path d="M50 12 L72 40 L58 40 L58 86 L42 86 L42 40 L28 40 Z" fill="${INK}"/></g>`;
  if (dotFill) s += `<circle cx="80" cy="80" r="9" ${dotFill === "black" ? `fill="${INK}"` : PP} stroke="${INK}" stroke-width="3"/>`;
  return svg(s);
}
function flagSVG(angle) {
  return svg(`<g transform="rotate(${angle} 50 50)"><rect x="46" y="14" width="7" height="72" fill="${INK}"/><polygon points="53,14 84,26 53,38" fill="${INK}"/><circle cx="49.5" cy="86" r="6" fill="${INK}"/></g>`);
}
function countSVG(n, shape, fill = "black") {
  const cols = n <= 4 ? 2 : n <= 9 ? 3 : 4, rows = Math.ceil(n / cols), step = 84 / Math.max(cols, rows), r = step * 0.34;
  let body = "";
  for (let i = 0; i < n; i++) {
    const c = i % cols, rw = Math.floor(i / cols);
    const cx = 50 + (c - (cols - 1) / 2) * step, cy = 50 + (rw - (rows - 1) / 2) * step;
    body += shapeSVG(shape, +cx.toFixed(1), +cy.toFixed(1), +r.toFixed(1), fill);
  }
  return svg(body);
}
function polygonSVG(n) {
  if (n === 0) return svg(`<circle cx="50" cy="50" r="36" ${PP} stroke="${INK}" stroke-width="3.5"/>`);
  const pts = [];
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; pts.push(`${(50 + 38 * Math.cos(a)).toFixed(1)},${(52 + 38 * Math.sin(a)).toFixed(1)}`); }
  return svg(`<polygon points="${pts.join(" ")}" ${PP} stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`);
}
const BORDER = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];
function gridDotSVG(cell, cell2) {
  let body = "";
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) body += `<rect x="${8 + c * 28}" y="${8 + r * 28}" width="28" height="28" ${PP} stroke="${INK}" stroke-width="2"/>`;
  const dot = (p, f) => `<circle cx="${22 + p[0] * 28}" cy="${22 + p[1] * 28}" r="9" ${f} stroke="${INK}" stroke-width="2.5"/>`;
  body += dot(cell, `fill="${INK}"`);
  if (cell2) body += dot(cell2, PP);
  return svg(body);
}
function quadrantSVG(q) { // q: 0 arriba-der, 1 abajo-der, 2 abajo-izq, 3 arriba-izq (sentido horario)
  const paths = ["M50 50 L50 14 A36 36 0 0 1 86 50 Z", "M50 50 L86 50 A36 36 0 0 1 50 86 Z", "M50 50 L50 86 A36 36 0 0 1 14 50 Z", "M50 50 L14 50 A36 36 0 0 1 50 14 Z"];
  return svg(`<circle cx="50" cy="50" r="36" ${PP} stroke="${INK}" stroke-width="3"/><path d="${paths[q]}" fill="${INK}"/><line x1="14" y1="50" x2="86" y2="50" stroke="${INK}" stroke-width="2"/><line x1="50" y1="14" x2="50" y2="86" stroke="${INK}" stroke-width="2"/>`);
}
const PIPS = { 0: [], 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]], 5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] };
function dominoSVG(top, bottom) {
  const half = (v, y0) => PIPS[v].map(([c, r]) => `<circle cx="${34 + c * 16}" cy="${y0 + 10 + r * 12}" r="4.6" fill="${INK}"/>`).join("");
  return svg(`<rect x="22" y="6" width="56" height="88" rx="8" ${PP} stroke="${INK}" stroke-width="3"/><line x1="26" y1="50" x2="74" y2="50" stroke="${INK}" stroke-width="2.5"/>${half(top, 7)}${half(bottom, 51)}`);
}
function matrixSVG(cells) { // cells: 9 items {shape, fill} or null para "?"
  let body = "";
  cells.forEach((c, i) => {
    const x = (i % 3) * 100, y = Math.floor(i / 3) * 100;
    body += `<rect x="${x + 2}" y="${y + 2}" width="96" height="96" ${PP} stroke="${INK}" stroke-width="2" ${c ? "" : 'stroke-dasharray="6 5"'}/>`;
    body += c ? shapeSVG(c.shape, x + 50, y + 50, 30, c.fill) : `<text x="${x + 50}" y="${y + 66}" text-anchor="middle" font-size="48" class="qmark">?</text>`;
  });
  return `<svg class="fig matrix" viewBox="0 0 300 300" aria-hidden="true">${body}</svg>`;
}
const single = (shape, fill) => svg(shapeSVG(shape, 50, 50, 32, fill));

// ---------------------------------------------------------------- idioma / language
// Los textos bilingües son objetos {es, en}; tx() elige el del idioma activo.
let LANG = (() => { try { return localStorage.getItem("sim3090-lang") === "en" ? "en" : "es"; } catch { return "es"; } })();
const tx = v => (v && typeof v === "object" && "es" in v ? v[LANG] : v);
const T = {
  es: {

    absMeta: "30 preguntas · 30:00", absDesc: "Series, dominós D-48, matrices 3×3, rotaciones y figuras con dos reglas. La dificultad aumenta.",
    techMeta: "40 preguntas · 50:00", techDesc: "Parte 1 del examen técnico, en inglés. Después, practica la parte de código con los problemas del repositorio.",
    start: "Empezar simulacro", pracTitle: "Práctica por tema", pracMeta: "Sin tiempo · retroalimentación inmediata", practice: "Practicar",
    pracTopic: "Tema de práctica", tVisual: "Figuras (visual)", tSeries: "Series y dominós",
    sample: "Ejemplo de pregunta", another: "Otra figura", seeAnswer: "Ver respuesta",
    lastTitle: "Tus últimos intentos", noHist: "Aún no hay intentos guardados en este navegador. Al terminar un simulacro, tu puntaje aparece aquí.",
    note: "Material de estudio no oficial, creado para practicar. No contiene preguntas reales de ningún examen.",
    answered: "respondidas", finish: "Terminar", question: (i, n) => `Pregunta ${i} de ${n}`, prev: "← Anterior", next: "Siguiente →",
    flag: "Marcar para revisar", unflag: "Quitar marca", finishSee: "Terminar y ver resultado", goTo: "Ir a la pregunta",
    shortcuts: "Atajos: teclas A–D o 1–4 para responder, ← y → para moverte, T para ver la traducción. Si no ves la regla en 60 segundos: marca, responde algo y sigue.",
    blank: n => `Hay ${n} sin responder. ¿Terminar igual?`, home: "← Inicio", correctCount: "correctas",
    right: "Correcto.", wrong: k => `Incorrecto. La respuesta es ${k}.`, nextQ: "Siguiente pregunta →",
    timeUp: " · se acabó el tiempo", timeUsed: "Tiempo usado", byTopic: "Resultado por tema", repeat: "Repetir con preguntas nuevas",
    backHome: "Volver al inicio", review: "Revisión pregunta por pregunta", ok: "Bien", ko: "Mal", yourAns: "Tu respuesta",
    unanswered: "sin responder", correctAns: "Correcta",
    v1: "Excelente: estás listo para este bloque.", v2: "Bien. Repasa los temas más bajos y repite en 2–3 días.",
    v3: "Todavía en construcción. Vuelve a los módulos de los temas con menor puntaje.",
    showTr: "Ver traducción", hideTr: "Ocultar traducción", trLabel: "Traducción al español", langLabel: "Idioma",
    modes: { abstract: "Razonamiento abstracto", tech: "Técnico: opción múltiple" },
  },

function finish(q, correct, distractors) {
  const key = o => o.key;
  const seen = new Set([key(correct)]);
  const opts = [correct];
  for (const d of distractors) { if (opts.length === 4) break; if (!seen.has(key(d))) { seen.add(key(d)); opts.push(d); } }
  const order = shuffle(opts);
  q.options = order.map(o => ({ svg: o.svg, text: o.text }));
  q.answer = order.indexOf(correct);
  return q;
}

const TECH_TOPICS = ["SQL", "Python", "Algorithms", "Databases", "AWS", "Stats"];
const TOPIC_NAME = { SQL: { es: "SQL", en: "SQL" }, Python: { es: "Python", en: "Python" }, Algorithms: { es: "Algoritmos", en: "Algorithms" },
  Databases: { es: "Bases de datos", en: "Databases" }, AWS: { es: "AWS", en: "AWS" }, Stats: { es: "Estadística y ML", en: "Statistics and ML" } };

function techQuestion(row) {
  const [topic, prompt, code, opts, ans, exEs, promptEs, exEn, optsEs] = row;
  const order = shuffle(opts.map((txt, i) => ({ txt, i })));
  return { topic: TOPIC_NAME[topic], prompt, es: promptEs, code, options: order.map(o => ({ text: o.txt })),
    optsEs: optsEs ? order.map(o => optsEs[o.i]) : null, answer: order.findIndex(o => o.i === ans), explain: { es: exEs, en: exEn } };
}
function buildTechExam(n = 40) {
  const per = { SQL: 11, Python: 10, Algorithms: 8, Databases: 4, AWS: 7 };
  let qs = [];
  for (const tp of TECH_TOPICS) qs = qs.concat(shuffle(BANK.filter(r => r[0] === tp)).slice(0, per[tp] || 0));   // Stats: solo práctica / practice only
  return shuffle(qs).slice(0, n).map(techQuestion);
}

// ---------------------------------------------------------------- estado y almacenamiento
const MODES = { abstract: { minutes: 30, count: 30 }, tech: { minutes: 50, count: 40 } };
let S = { view: "home", practiceTopic: "visual" };
const store = {
  get() { try { return JSON.parse(localStorage.getItem("sim3090-history") || "[]"); } catch { return []; } },
  add(r) { try { const h = store.get(); h.unshift(r); localStorage.setItem("sim3090-history", JSON.stringify(h.slice(0, 8))); } catch { /* sin almacenamiento */ } },
};
let tick = null;

function startExam(mode) {
  const m = MODES[mode];
  const questions = mode === "abstract" ? ABSTRACT_PLAN.map(g => g()) : buildTechExam(m.count);
  S = { view: "exam", mode, questions, answers: Array(questions.length).fill(null), flags: Array(questions.length).fill(false), tr: {}, cur: 0,
        endsAt: Date.now() + m.minutes * 60000, startedAt: Date.now() };
  runTimer(); render();
}
function startPractice(topic) {
  S = { view: "practice", practiceTopic: topic, q: practiceQuestion(topic), chosen: null, done: 0, right: 0, tr: {} };
  render();
}
const VISUAL_GENS = [genRotation, genCount, genTwoRules, genPosition, genSides, genQuadrant, genMatrix, genLatin, genDomino];
function practiceQuestion(topic) {
  if (topic === "visual") return pick(VISUAL_GENS)();
  if (topic === "series") return pick([genNumber, genLetters, genDomino])();
  return techQuestion(pick(BANK.filter(r => r[0] === topic)));
}
function runTimer() {
  clearInterval(tick);
  tick = setInterval(() => {
    if (S.view !== "exam") return clearInterval(tick);
    const left = S.endsAt - Date.now();
    if (left <= 0) { finishExam(true); return; }
    const el = $("#timer");
    if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left < 5 * 60000); }
  }, 500);
}
const fmtTime = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
function finishExam(timeUp = false) {
  clearInterval(tick);
  const correct = S.questions.filter((q, i) => S.answers[i] === q.answer).length;
  const used = Math.min(Date.now(), S.endsAt) - S.startedAt;
  S = { ...S, view: "results", correct, used, timeUp };
  store.add({ mode: S.mode, score: `${correct}/${S.questions.length}`, date: new Date().toISOString(), time: fmtTime(used) });
  render(); window.scrollTo({ top: 0 });
}
const trKey = () => (S.view === "exam" ? S.cur : "p");
function toggleTr() { if (!S.tr) S.tr = {}; S.tr[trKey()] = !S.tr[trKey()]; render(); }

// ---------------------------------------------------------------- render
function langSwitch() {
  return `<div class="langsw" role="group" aria-label="${t("langLabel")}">${["es", "en"].map(l =>
    `<button data-lang="${l}" aria-pressed="${LANG === l}" class="${LANG === l ? "on" : ""}">${l.toUpperCase()}</button>`).join("")}</div>`;
}
function figureBlock(q) {
  if (q.matrix) return `<div>${q.matrix}</div>`;
  if (q.seq) return `<div class="seq">${q.seq.map(s => `<div class="cell">${s}</div>`).join("")}<div class="cell q">?</div></div>`;
  if (q.text) return `<pre class="code" style="font-size:1.25rem">${esc(q.text)}</pre>`;
  return "";
}
function optionsBlock(q, chosen, reveal) {
  const visual = q.options.some(o => o.svg);
  return `<div class="options ${visual ? "visual" : ""}" role="radiogroup">${q.options.map((o, i) => {
    let cls = "opt";
    if (reveal) { if (i === q.answer) cls += " right"; else if (i === chosen) cls += " wrong"; }
    else if (i === chosen) cls += " sel";
    const body = o.svg ? `<span class="cell">${o.svg}</span>` : `<span class="t">${esc(o.text)}</span>`;
    return `<button class="${cls}" data-opt="${i}" role="radio" aria-checked="${i === chosen}"><span class="k">${KEYS[i]}</span>${body}</button>`;
  }).join("")}</div>`;
}
function trBlock(q, open) {
  if (!q.es) return "";
  const btn = `<button class="btn ghost trbtn" data-tr aria-expanded="${open}">${open ? t("hideTr") : t("showTr")}</button>`;
  if (!open) return btn;
  const opts = q.optsEs ? `<ol class="tropts">${q.optsEs.map((o, i) => `<li><strong>${KEYS[i]})</strong> ${esc(o)}</li>`).join("")}</ol>` : "";
  return `${btn}<div class="tr"><span class="eyebrow">${t("trLabel")}</span><p>${esc(q.es)}</p>${opts}</div>`;
}
function questionCard(q, idx, total, chosen, reveal, trOpen) {
  return `<section class="qcard" aria-live="polite">
    <div class="row"><span class="tag">${esc(tx(q.topic))}</span>${total ? `<span class="progress">${t("question")(idx + 1, total)}</span>` : ""}</div>
    <p class="prompt">${esc(q.prompt)}</p>
    ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ""}
    ${figureBlock(q)}
    ${optionsBlock(q, chosen, reveal)}
    ${trBlock(q, !!trOpen)}
  </section>`;
}
function homeView() {
  const sample = genTwoRules();
  const hist = store.get();
  const fmtDate = d => { const dt = new Date(d); return isNaN(dt) ? d : dt.toLocaleDateString(LANG === "es" ? "es-CO" : "en-US"); };
  const opt = (v, label) => `<option value="${v}">${esc(label)}</option>`;
  return `<main class="wrap">
    <header class="hero">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">${t("eyebrow")}</span>${langSwitch()}</div>
      <h1>Simulacro 30·90</h1>
      <p class="muted">${t("hero")}</p>
    </header>
    <section class="modes">
      <article class="mode featured">
        <h2>${t("modes").abstract}</h2>
        <p class="meta">${t("absMeta")}</p>
        <p>${t("absDesc")}</p>
        <button class="btn primary" data-start="abstract">${t("start")}</button>
      </article>
      <article class="mode">
        <h2>${t("modes").tech}</h2>
        <p class="meta">${t("techMeta")}</p>
        <p>${t("techDesc")}</p>
        <button class="btn" data-start="tech">${t("start")}</button>
      </article>
      <article class="mode">
        <h2>${t("pracTitle")}</h2>
        <p class="meta">${t("pracMeta")}</p>
        <select id="ptopic" aria-label="${t("pracTopic")}">
          ${opt("visual", t("tVisual"))}${opt("series", t("tSeries"))}${TECH_TOPICS.map(tp => opt(tp, tx(TOPIC_NAME[tp]))).join("")}
        </select>
        <button class="btn" data-practice>${t("practice")}</button>
      </article>
    </section>
    <section class="sample">
      <div class="row"><span class="eyebrow">${t("sample")}</span><button class="btn ghost" data-resample>${t("another")}</button></div>
      ${questionCard(sample, 0, 0, null, false, false).replace('class="qcard"', 'class="qcard" style="border:none;padding:0"')}
      <details><summary>${t("seeAnswer")}</summary><p style="margin-top:8px"><strong>${KEYS[sample.answer]}</strong>. ${esc(tx(sample.explain))}</p></details>
    </section>
    <section class="mode">
      <h3>${t("lastTitle")}</h3>
      ${hist.length ? `<div class="history">${hist.map(h => `<div><span>${esc(fmtDate(h.date))} · ${esc(t("modes")[h.mode] || h.mode)}</span><span>${esc(h.score)} · ${esc(h.time)}</span></div>`).join("")}</div>`
        : `<p class="muted">${t("noHist")}</p>`}
    </section>
    <p class="note">${t("note")}</p>
  </main>`;
}
function examView() {
  const q = S.questions[S.cur], n = S.questions.length;
  const answered = S.answers.filter(a => a !== null).length;
  return `<div class="bar"><div class="in">
      <strong>${esc(t("modes")[S.mode])}</strong>
      <span class="progress">${answered}/${n} ${t("answered")}</span>
      <span class="timer" id="timer">${fmtTime(S.endsAt - Date.now())}</span>
      ${langSwitch()}
      <button class="btn ghost" data-finish>${t("finish")}</button>
    </div></div>
    <main class="wrap">
      ${questionCard(q, S.cur, n, S.answers[S.cur], false, S.tr && S.tr[S.cur])}
      <div class="nav">
        <button class="btn ghost" data-prev ${S.cur === 0 ? "disabled" : ""}>${t("prev")}</button>
        <button class="btn ghost" data-flag>${S.flags[S.cur] ? t("unflag") : t("flag")}</button>
        ${S.cur < n - 1 ? `<button class="btn primary" data-next>${t("next")}</button>` : `<button class="btn primary" data-finish>${t("finishSee")}</button>`}
      </div>
      <nav class="palette" aria-label="${t("goTo")}">${S.questions.map((_, i) =>
        `<button data-go="${i}" class="${S.answers[i] !== null ? "done" : ""} ${i === S.cur ? "cur" : ""} ${S.flags[i] ? "flagged" : ""}" aria-label="${t("question")(i + 1, n)}">${i + 1}</button>`).join("")}</nav>
      <p class="note">${t("shortcuts")}</p>
    </main>`;
}
function practiceView() {
  const q = S.q, reveal = S.chosen !== null, ok = S.chosen === q.answer;
  return `<main class="wrap">
    <div class="row" style="justify-content:space-between"><button class="btn ghost" data-home>${t("home")}</button>${langSwitch()}<span class="progress">${S.right}/${S.done} ${t("correctCount")}</span></div>
    ${questionCard(q, 0, 0, S.chosen, reveal, S.tr && S.tr.p)}
    ${reveal ? `<div class="feedback ${ok ? "" : "bad"}"><strong>${ok ? t("right") : t("wrong")(KEYS[q.answer])}</strong> ${esc(tx(q.explain))}</div>
      <div class="row"><button class="btn primary" data-pnext>${t("nextQ")}</button></div>` : ""}
  </main>`;
}
function resultsView() {
  const n = S.questions.length, pct = Math.round(100 * S.correct / n);
  const byTopic = {};
  S.questions.forEach((q, i) => { const k = tx(q.topic); const g = byTopic[k] || (byTopic[k] = { ok: 0, n: 0 }); g.n++; if (S.answers[i] === q.answer) g.ok++; });
  const verdict = pct >= 85 ? t("v1") : pct >= 70 ? t("v2") : t("v3");
  return `<main class="wrap">
    <header class="hero">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(t("modes")[S.mode])}${S.timeUp ? t("timeUp") : ""}</span>${langSwitch()}</div>
      <div class="score"><span class="big">${S.correct}/${n}</span><span class="timer">${pct}%</span><span class="progress">${t("timeUsed")} ${fmtTime(S.used)}</span></div>
      <p>${verdict}</p>
    </header>
    <section class="qcard"><h3>${t("byTopic")}</h3><div class="topics">${Object.entries(byTopic).map(([k, v]) =>
      `<div class="t"><span>${esc(k)}</span><span class="meter"><span style="width:${Math.round(100 * v.ok / v.n)}%"></span></span><span class="progress">${v.ok}/${v.n}</span></div>`).join("")}</div></section>
    <div class="row"><button class="btn primary" data-start="${S.mode}">${t("repeat")}</button><button class="btn ghost" data-home>${t("backHome")}</button></div>
    <section class="review"><h3>${t("review")}</h3>${S.questions.map((q, i) => {
      const ok = S.answers[i] === q.answer;
      return `<details ${ok ? "" : "open"}><summary><span class="pill ${ok ? "ok" : "no"}">${ok ? t("ok") : t("ko")}</span><span>${i + 1}. ${esc(q.prompt)}</span></summary>
        <div style="display:grid;gap:10px;margin-top:10px">${q.es ? `<p class="muted">${esc(q.es)}</p>` : ""}${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ""}${figureBlock(q)}${optionsBlock(q, S.answers[i], true)}
        <p class="ans">${t("yourAns")}: ${S.answers[i] === null ? t("unanswered") : KEYS[S.answers[i]]} · ${t("correctAns")}: ${KEYS[q.answer]}</p><p>${esc(tx(q.explain))}</p></div></details>`;
    }).join("")}</section>
  </main>`;
}
function render() {
  const app = $("#app");
  app.innerHTML = S.view === "exam" ? examView() : S.view === "practice" ? practiceView() : S.view === "results" ? resultsView() : homeView();
  if (S.view === "home") { const sel = $("#ptopic"); if (sel) sel.value = S.practiceTopic || "visual"; }
}

// ---------------------------------------------------------------- eventos
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.lang) return setLang(b.dataset.lang);
  if (b.dataset.start) return startExam(b.dataset.start);
  if (b.hasAttribute("data-practice")) return startPractice($("#ptopic").value);
  if (b.hasAttribute("data-tr")) return toggleTr();
  if (b.hasAttribute("data-resample") || b.hasAttribute("data-home")) { clearInterval(tick); S = { view: "home", practiceTopic: S.practiceTopic }; return render(); }
  if (b.dataset.opt !== undefined) {
    const i = Number(b.dataset.opt);
    if (S.view === "exam") { S.answers[S.cur] = i; return render(); }
    if (S.view === "practice" && S.chosen === null) { S.chosen = i; S.done++; if (i === S.q.answer) S.right++; return render(); }
    return;
  }
  if (b.hasAttribute("data-pnext")) { S.q = practiceQuestion(S.practiceTopic); S.chosen = null; S.tr = {}; return render(); }
  if (b.hasAttribute("data-next")) { S.cur++; return render(); }
  if (b.hasAttribute("data-prev")) { S.cur--; return render(); }
  if (b.hasAttribute("data-flag")) { S.flags[S.cur] = !S.flags[S.cur]; return render(); }
  if (b.dataset.go !== undefined) { S.cur = Number(b.dataset.go); return render(); }
  if (b.hasAttribute("data-finish")) {
    const blank = S.answers.filter(a => a === null).length;
    if (blank && !b.dataset.confirm) { b.dataset.confirm = "1"; b.textContent = t("blank")(blank); return; }
    return finishExam(false);
  }
});
document.addEventListener("keydown", e => {
  if (e.target.closest("select, input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  const idx = "ABCD".indexOf(k) >= 0 ? "ABCD".indexOf(k) : "1234".indexOf(k);
  if ((S.view === "exam" || S.view === "practice") && k === "T") return toggleTr();
  if (S.view === "exam") {
    if (idx >= 0 && idx < S.questions[S.cur].options.length) { S.answers[S.cur] = idx; render(); }
    else if (e.key === "ArrowRight" && S.cur < S.questions.length - 1) { S.cur++; render(); }
    else if (e.key === "ArrowLeft" && S.cur > 0) { S.cur--; render(); }
  } else if (S.view === "practice" && S.chosen === null && idx >= 0 && idx < S.q.options.length) {
    S.chosen = idx; S.done++; if (idx === S.q.answer) S.right++; render();
  }
});

// Conservar el intento en curso si la página se actualiza mientras está abierta.
window.claude?.hot?.snapshot?.(() => S);
function boot(data) {
  document.documentElement.lang = LANG;
  if (data && data.view) { S = data; if (S.view === "exam") runTimer(); }
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
<!-- ARTIFACT-END -->
</body>
</html>
