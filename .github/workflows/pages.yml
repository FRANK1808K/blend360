# Publishes the interactive simulator to GitHub Pages from the repository's default branch.
# Publica el simulador interactivo en GitHub Pages desde la rama por defecto del repositorio.
# If the first run cannot enable Pages by itself / Si la primera ejecución no puede activar Pages sola:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pages

on:
  push:
    paths: ["simulator/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only the default branch deploys; private repos need PAGES_ENABLED=true (paid plan).
    # Solo despliega la rama por defecto; los repos privados necesitan PAGES_ENABLED=true (plan de pago).
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (!github.event.repository.private || vars.PAGES_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: simulator
      - id: deployment
        uses: actions/deploy-pages@v4
