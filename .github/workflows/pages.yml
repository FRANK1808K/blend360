name: Pages

# Publishes the Quarto study website at the site root, with the simulators at /simulador/ and /simulador-aif/.
# Publica el sitio de estudio Quarto en la raíz, con los simuladores en /simulador/ y /simulador-aif/.
on:
  push:
    paths:
      - "simulator/**"
      - "quarto/**"
      - "aws-ai-practitioner/**"
      - "**.md"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only the default branch is published / Solo se publica la rama por defecto.
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (!github.event.repository.private || vars.PAGES_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Build the study website (includes both simulators)
        run: python scripts/build_site.py --strict --out _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
