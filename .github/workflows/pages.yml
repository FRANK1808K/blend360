name: Pages

# Publishes the simulator at the site root and the study guide at /guia/.
# Publica el simulador en la raíz del sitio y la guía de estudio en /guia/.
on:
  push:
    paths:
      - "simulator/**"
      - "guide/**"
      - "aws-ai-practitioner/**"
      - "**.md"
      - "scripts/build_guide.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only the default branch is published / Solo se publica la rama por defecto.
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (!github.event.repository.private || vars.PAGES_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Build the study guide
        run: |
          pip install --quiet -r guide/requirements.txt
          python scripts/build_guide.py --strict --out _site/guia
      - name: Add the simulator
        run: |
          cp -r simulator/. _site/
          mkdir -p _site/aws-ai-practitioner/simulator
          cp -r aws-ai-practitioner/simulator/. _site/aws-ai-practitioner/simulator/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
