<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador AWS Certified AI Practitioner (AIF-C01)</title>
<meta name="description" content="Simulador cronometrado oficial del examen AWS Certified AI Practitioner (AIF-C01) con interfaz interactiva, modo oscuro, versión en inglés, cronómetro oficial y reporte detallado por dominio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root {
  --paper: #f8fafc;
  --card: #ffffff;
  --surface: #f1f5f9;
  --surface-hover: #e2e8f0;
  --ink: #0f172a;
  --muted: #64748b;
  --rule: #e2e8f0;
  --grid: #e2e8f0;
  --accent: #FF9900;
  --accent-hover: #ffad26;
  --accent-ink: #000000;
  --accent-soft: rgba(255, 153, 0, 0.12);
  --brand: #232f3e;
  --good: #10b981;
  --good-soft: #ecfdf5;
  --bad: #ef4444;
  --bad-soft: #fef2f2;
  --flag: #f59e0b;
  --flag-soft: #fef3c7;
  --en: #475569;
  --en-soft: #f8fafc;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 12px 28px -6px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
  --shadow-glow: 0 0 25px rgba(255, 153, 0, 0.35);
  --font-body: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --r: 16px;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --paper: #09090b;
  --card: #111116;
  --surface: #181820;
  --surface-hover: #22222e;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --rule: #272733;
  --grid: #1a1a24;
  --accent: #FF9900;
  --accent-hover: #ffad26;
  --accent-ink: #000000;
  --accent-soft: rgba(255, 153, 0, 0.18);
  --brand: #13131a;
  --good: #34d399;
  --good-soft: rgba(16, 185, 129, 0.15);
  --bad: #f87171;
  --bad-soft: rgba(239, 68, 68, 0.15);
  --flag: #fbbf24;
  --flag-soft: rgba(245, 158, 11, 0.15);
  --en: #cbd5e1;
  --en-soft: #14141d;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 12px 28px -6px rgba(0, 0, 0, 0.7);
  --shadow-glow: 0 0 35px rgba(255, 153, 0, 0.45);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #09090b;
    --card: #111116;
    --surface: #181820;
    --surface-hover: #22222e;
    --ink: #f8fafc;
    --muted: #94a3b8;
    --rule: #272733;
    --grid: #1a1a24;
    --accent: #FF9900;
    --accent-hover: #ffad26;
    --accent-ink: #000000;
    --accent-soft: rgba(255, 153, 0, 0.18);
    --brand: #13131a;
    --good: #34d399;
    --good-soft: rgba(16, 185, 129, 0.15);
    --bad: #f87171;
    --bad-soft: rgba(239, 68, 68, 0.15);
    --flag: #fbbf24;
    --flag-soft: rgba(245, 158, 11, 0.15);
    --en: #cbd5e1;
    --en-soft: #14141d;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 12px 28px -6px rgba(0, 0, 0, 0.7);
    --shadow-glow: 0 0 35px rgba(255, 153, 0, 0.45);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
  transition: background-color .35s var(--ease), color .35s var(--ease);
  min-height: 100vh;
}

.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 24px 64px;
  animation: enterFade .35s var(--ease);
}

@keyframes enterFade {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

h1, h2, h3 {
  line-height: 1.2;
  margin: 0;
  text-wrap: balance;
  font-weight: 700;
}
h1 { font-size: clamp(2rem, 5vw, 2.85rem); letter-spacing: -0.035em; }
h2 { font-size: 1.35rem; letter-spacing: -0.02em; }
h3 { font-size: 1.12rem; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: var(--font-mono); font-size: 0.9em; background: var(--surface); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--rule); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}

/* Botones y controles táctiles */
button, select { font: inherit; }
.btn {
  appearance: none;
  border: 1.5px solid var(--rule);
  background: var(--card);
  color: var(--ink);
  border-radius: 999px;
  padding: 10px 20px;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
  text-decoration: none;
  box-shadow: var(--shadow-sm);
  transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .2s, background-color .2s, color .2s;
  user-select: none;
}
.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
  border-color: var(--ink);
}
.btn:active:not(:disabled) {
  transform: translateY(0) scale(.97);
}
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  box-shadow: var(--shadow-glow);
}
.btn.ghost { border-color: var(--rule); background: transparent; box-shadow: none; }
.btn.ghost:hover:not(:disabled) { border-color: var(--ink); background: var(--surface); }
.btn.mini { padding: 5px 14px; font-size: 0.82rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { justify-content: space-between; }

/* Barra superior */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--card) 85%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--rule);
  padding: 12px 20px;
  transition: border-color .25s var(--ease);
}
.top-in {
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 0.98rem;
  letter-spacing: -0.01em;
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: var(--accent);
  color: #000;
  font-weight: 900;
  font-size: 0.88rem;
  box-shadow: 0 2px 8px rgba(255, 153, 0, 0.4);
}
.iconbtn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1.5px solid var(--rule);
  background: var(--card);
  color: var(--ink);
  display: grid;
  place-items: center;
  padding: 0;
  cursor: pointer;
  transition: transform .25s var(--ease), border-color .2s, box-shadow .2s;
}
.iconbtn:hover { border-color: var(--ink); transform: rotate(-15deg); box-shadow: var(--shadow); }
.iconbtn svg { width: 19px; height: 19px; }

/* Hero de Inicio */
.hero {
  display: grid;
  gap: 16px;
  position: relative;
  isolation: isolate;
  padding-block: 20px 10px;
}
.hero::after {
  content: "";
  position: absolute;
  z-index: -1;
  right: -20px;
  top: -30px;
  width: min(380px, 65vw);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--accent) 40%, transparent), transparent 65%);
  filter: blur(20px);
  opacity: .5;
}
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  width: fit-content;
}
.hero-tag .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}
.gradient-text {
  background: linear-gradient(135deg, var(--accent) 0%, #ffbe4d 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  border: 1.5px solid var(--rule);
  background: var(--card);
  border-radius: 999px;
  padding: 6px 15px;
  font-size: 0.88rem;
  box-shadow: var(--shadow-sm);
  transition: transform .2s, border-color .2s;
}
.chip:hover { transform: translateY(-1px); border-color: var(--ink); }
.chip strong {
  font-family: var(--font-mono);
  font-size: 0.98rem;
  color: var(--accent);
}

/* Selector de Modos */
.modes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  margin-block: 20px 24px;
}
.mode-card {
  position: relative;
  background: var(--card);
  border: 1.5px solid var(--rule);
  border-radius: var(--r);
  padding: 22px;
  display: grid;
  gap: 10px;
  align-content: start;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform .25s var(--ease), border-color .25s, box-shadow .25s;
}
.mode-card:hover {
  transform: translateY(-4px);
  border-color: var(--ink);
  box-shadow: var(--shadow-lg);
}
.mode-card input { position: absolute; opacity: 0; }
.mode-card.is-selected {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 5%, var(--card));
  box-shadow: 0 0 0 2px var(--accent), var(--shadow-lg);
}
.mode-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.mode-ico {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
}
.mode-ico svg { width: 22px; height: 22px; }
.mode-tag {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
}
.mode-card.is-selected .mode-tag {
  background: var(--accent);
  color: #000;
}
.mode-card h3 { font-size: 1.2rem; }
.mode-card .meta {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}

/* Barra de configuración */
.settings-bar {
  background: var(--card);
  border: 1.5px solid var(--rule);
  border-radius: var(--r);
  padding: 18px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 18px 28px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.settings-bar label {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
}
select {
  padding: 9px 16px;
  border-radius: 12px;
  border: 1.5px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  font-size: 0.92rem;
  transition: border-color .2s;
  cursor: pointer;
}
select:hover { border-color: var(--ink); }

/* Switch interactivo */
.switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 24px;
  flex: none;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: var(--rule);
  transition: .25s var(--ease);
  border-radius: 999px;
}
.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: var(--card);
  transition: .25s var(--ease);
  border-radius: 50%;
  box-shadow: var(--shadow-sm);
}
input:checked + .slider { background-color: var(--accent); }
input:checked + .slider:before { transform: translateX(20px); background-color: #000; }

/* Confirmación */
.confirm-box {
  background: var(--flag-soft);
  border: 1.5px solid var(--flag);
  border-radius: var(--r);
  padding: 16px 22px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  font-size: 0.95rem;
}

/* Tabla de historial */
.history-section {
  margin-top: 40px;
  display: grid;
  gap: 16px;
}
.table-wrap {
  overflow-x: auto;
  border: 1.5px solid var(--rule);
  border-radius: var(--r);
  background: var(--card);
  box-shadow: var(--shadow);
}
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th {
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 700;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: color-mix(in srgb, var(--surface) 60%, transparent); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 999px;
}
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--flag-soft); color: var(--flag); }
.pill.ko { background: var(--bad-soft); color: var(--bad); }

/* Interfaz de Examen */
.exam-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 24px;
  align-items: start;
}
@media (max-width: 860px) {
  .exam-layout { grid-template-columns: minmax(0, 1fr); }
}

.qcard {
  background: var(--card);
  border: 1.5px solid var(--rule);
  border-radius: var(--r);
  padding: 28px;
  display: grid;
  gap: 20px;
  box-shadow: var(--shadow);
}
.qhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule);
}
.qtext {
  font-size: 1.15rem;
  line-height: 1.65;
  font-weight: 500;
}
.opts { display: grid; gap: 12px; }
.opt-label {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 14px 18px;
  border: 1.5px solid var(--rule);
  border-radius: 14px;
  background: var(--card);
  cursor: pointer;
  transition: transform .18s var(--ease), border-color .2s, background-color .2s;
  user-select: none;
}
.opt-label:hover {
  border-color: var(--accent);
  background: var(--surface);
  transform: translateX(4px);
}
.opt-label input { margin-top: 4px; accent-color: var(--accent); }
.opt-letter {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--muted);
  flex: none;
  transition: background-color .2s, color .2s;
}
.opt-label.picked {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.opt-label.picked .opt-letter {
  background: var(--accent);
  color: #000;
}
.opt-label.right {
  border-color: var(--good);
  background: var(--good-soft);
}
.opt-label.wrong {
  border-color: var(--bad);
  background: var(--bad-soft);
}

/* Panel de traducción */
.en-panel {
  border: 1.5px dashed var(--rule);
  background: var(--en-soft);
  border-radius: 14px;
  padding: 18px;
  display: grid;
  gap: 12px;
  color: var(--en);
  animation: enterFade .25s var(--ease);
}
.en-panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

/* Feedback inmediato */
.feedback-box {
  padding: 16px 20px;
  border-radius: 14px;
  font-size: 0.96rem;
  display: grid;
  gap: 8px;
  animation: enterFade .25s var(--ease);
}
.feedback-box.ok { background: var(--good-soft); color: var(--ink); border: 1.5px solid var(--good); }
.feedback-box.ko { background: var(--bad-soft); color: var(--ink); border: 1.5px solid var(--bad); }

/* Navegador lateral */
.navpanel {
  background: var(--card);
  border: 1.5px solid var(--rule);
  border-radius: var(--r);
  padding: 20px;
  display: grid;
  gap: 16px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 86px;
}
.navgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(2.2rem, 1fr));
  gap: 7px;
}
.nav-cell {
  appearance: none;
  border: 1.5px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  border-radius: 9px;
  height: 2.3rem;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  position: relative;
  display: grid;
  place-items: center;
  transition: transform .15s, border-color .15s, background-color .15s;
}
.nav-cell:hover { transform: scale(1.12); border-color: var(--ink); }
.nav-cell.answered { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.nav-cell.current { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); font-weight: 800; }
.nav-cell.flagged::after {
  content: "";
  position: absolute;
  top: 3px;
  right: 3px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--flag);
  box-shadow: 0 0 4px var(--flag);
}

/* Barra de progreso */
.progress-bar {
  flex: 1 1 12rem;
  height: 9px;
  background: var(--surface);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--rule);
}
.progress-bar span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent) 0%, #ffbe4d 100%);
  transition: width .3s var(--ease);
}

.timer {
  font-family: var(--font-mono);
  font-size: 1.4rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  padding: 5px 14px;
  border-radius: 10px;
  background: var(--surface);
  border: 1.5px solid var(--rule);
}
.timer.low {
  color: var(--bad);
  border-color: var(--bad);
  background: var(--bad-soft);
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0.7; transform: scale(1.02); }
}

/* Pantalla de Informe */
.report-grid {
  display: grid;
  gap: 24px;
}
.score-card {
  background: var(--card);
  border: 1.5px solid var(--rule);
  border-radius: var(--r);
  padding: 32px;
  display: flex;
  flex-wrap: wrap;
  gap: 24px 44px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.score-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 6px;
  background: var(--accent);
}
.score-big {
  font-size: clamp(3.2rem, 9vw, 4.6rem);
  font-weight: 800;
  line-height: 1;
}

.domain-bars {
  background: var(--card);
  border: 1.5px solid var(--rule);
  border-radius: var(--r);
  padding: 28px;
  display: grid;
  gap: 18px;
  box-shadow: var(--shadow);
}
.drow {
  display: grid;
  grid-template-columns: minmax(0, 19rem) minmax(0, 1fr) 5rem 10rem;
  gap: 14px;
  align-items: center;
  font-size: 0.92rem;
}
@media (max-width: 720px) {
  .drow { grid-template-columns: minmax(0, 1fr) 4rem; }
  .drow .track { grid-column: 1 / -1; }
  .drow .pill { justify-self: start; }
}
.track {
  position: relative;
  height: 13px;
  background: var(--surface);
  border-radius: 999px;
  border: 1px solid var(--rule);
  overflow: visible;
}
.track span {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 999px;
  background: var(--accent);
}
.track .mark {
  position: absolute;
  top: -5px;
  bottom: -5px;
  width: 2.5px;
  background: var(--ink);
  left: 70%;
  box-shadow: 0 0 5px rgba(0,0,0,0.35);
}

.rcard {
  background: var(--card);
  border: 1.5px solid var(--rule);
  border-left: 5px solid var(--bad);
  border-radius: var(--r);
  padding: 20px 24px;
  display: grid;
  gap: 12px;
  box-shadow: var(--shadow);
}
.rcard.is-right { border-left-color: var(--good); }

/* Teclas de acceso rápido */
.shortcuts-hint {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  padding-block: 4px;
}
.kbd {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 5px;
  padding: 1px 6px;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--ink);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<header class="top-bar">
  <div class="top-in">
    <div class="row">
      <div class="brand">
        <span class="brand-badge">AWS</span>
        <span>AIF-C01 · Simulador Oficial</span>
      </div>
      <a href="../../" class="btn ghost mini" style="margin-left:8px">← Volver a Blend360</a>
      <a href="../" class="btn ghost mini">Guía de estudio ↗</a>
    </div>
    <div class="row">
      <button class="iconbtn" id="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema claro/oscuro">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
const DATA = /*__DATA__*/null;
const DOMAINS = {
  D1: "D1 · Fundamentos de IA y ML",
  D2: "D2 · Fundamentos de IA generativa",
  D3: "D3 · Aplicaciones de modelos fundacionales",
  D4: "D4 · Pautas para una IA responsable",
  D5: "D5 · Seguridad, cumplimiento y gobernanza",
};
const WEIGHTS = { D1: 20, D2: 24, D3: 28, D4: 14, D5: 14 };
const STORE = "aifc01-sim";
const app = document.getElementById("app");
let state = null;
let tick = null;

// Manejo del tema Dark/Light
let THEME = (() => {
  try {
    const saved = localStorage.getItem("aifc01-theme");
    if (saved) return saved;
  } catch(e) {}
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
})();

function applyTheme(t) {
  THEME = t;
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("aifc01-theme", t); } catch(e) {}
  const btn = document.getElementById("theme-icon");
  if (btn) {
    if (t === "dark") {
      btn.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
    } else {
      btn.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
    }
  }
}
applyTheme(THEME);
document.getElementById("theme-toggle").onclick = () => applyTheme(THEME === "dark" ? "light" : "dark");

const store = {
  get(k, d) { try { const v = localStorage.getItem(STORE + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(STORE + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(STORE + k); } catch (e) {} },
};

const allQuestions = () => DATA.exams.flatMap(e => e.questions.map(q => ({ ...q, exam: e.name })));
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const MODES = [
  { id: "sim01", name: "Simulacro 01", tag: "Examen oficial", desc: "65 preguntas con ponderación oficial. Cubre todos los dominios y temas de la guía v1.1.", n: 65, min: 90,
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
    pick: () => DATA.exams[0].questions.map(q => ({ ...q, exam: DATA.exams[0].name })) },
  { id: "sim02", name: "Simulacro 02", tag: "Escenarios reales", desc: "65 preguntas de escenario técnico. Mayor grado de dificultad con dos opciones plausibles.", n: 65, min: 90,
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`,
    pick: () => DATA.exams[1].questions.map(q => ({ ...q, exam: DATA.exams[1].name })) },
  { id: "weak", name: "Refuerzo D1·D3·D4·D5", tag: "Dominios débiles", desc: "40 preguntas al azar de los dominios con menor margen reportado en candidatos.", n: 40, min: 55,
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,
    pick: () => shuffle(allQuestions().filter(q => q.domain !== "D2")).slice(0, 40) },
  { id: "v11", name: "Novedades Guía v1.1", tag: "Temas nuevos", desc: "IA agéntica, MCP, Amazon Bedrock AgentCore, context engineering, tokens y grounding.", n: null, min: null,
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>`,
    pick: () => shuffle(allQuestions().filter(q => q.new)) },
];

function englishBlock(q) {
  return `<div class="en-panel" lang="en">
    <div class="row spread">
      <span class="eyebrow" style="color:var(--ink)">English version (original exam format)</span>
      <span class="pill" style="background:var(--surface)">EN</span>
    </div>
    <p class="qtext" style="font-size:1.06rem">${q.en.text}</p>
    <ul>${q.en.options.map(o => `<li><span class="opt-letter" style="display:inline-flex;width:22px;height:22px;margin-right:8px">${o.id}</span> ${o.text}</li>`).join("")}</ul>
  </div>`;
}

function fmtTime(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
function isCorrect(q, picked) {
  const p = (picked || []).slice().sort().join(",");
  return p === q.answer.slice().sort().join(",");
}

/* ---------- Pantalla de Inicio ---------- */
function renderStart() {
  clearInterval(tick);
  const saved = store.get("-current", null);
  const history = store.get("-history", []);
  const pref = store.get("-prefs", { mode: "sim01", time: "std", instant: false });
  const v11count = allQuestions().filter(q => q.new).length;

  app.innerHTML = `
  <div class="wrap">
    <div class="hero">
      <div class="hero-tag">
        <span class="dot"></span>
        <span>AWS Certified AI Practitioner · AIF-C01</span>
      </div>
      <h1>Simulador Oficial de <span class="gradient-text">Examen AWS</span></h1>
      <p class="muted" style="max-width:64ch;font-size:1.05rem">Practica bajo condiciones idénticas al examen de certificación: cronómetro oficial, interfaz con diseño dinámico, preguntas marcadas para revisión, alternador a inglés en un clic y diagnóstico por dominio «Cumple / Necesita mejora».</p>
      <div class="chips">
        <span class="chip"><strong>65</strong> preguntas</span>
        <span class="chip">⏱️ <strong>90</strong> min (120 con ESL)</span>
        <span class="chip">🎯 Aprobado: <strong>700</strong> / 1000</span>
        <span class="chip">📈 Meta recomendada: <strong>≥ 80 %</strong></span>
      </div>
    </div>

    ${saved ? `
    <div class="confirm-box" style="margin-block:16px">
      <span>⚠️ Tienes un intento sin terminar de <strong>${saved.modeName}</strong> (${saved.answeredCount} respondidas).</span>
      <div class="row">
        <button class="btn btn-primary" id="resume">Continuar intento</button>
        <button class="btn ghost" id="discard">Descartar</button>
      </div>
    </div>` : ""}

    <div class="row spread" style="margin-top:22px">
      <span class="eyebrow">Elige una modalidad de examen</span>
      <span class="mono muted" style="font-size:0.8rem">130 preguntas originales en total</span>
    </div>

    <div class="modes-grid">
      ${MODES.map(m => `
        <label class="mode-card ${pref.mode === m.id ? "is-selected" : ""}" for="mode-${m.id}">
          <input type="radio" name="mode" id="mode-${m.id}" value="${m.id}" ${pref.mode === m.id ? "checked" : ""}>
          <div class="mode-header">
            <span class="mode-ico">${m.icon}</span>
            <span class="mode-tag">${m.tag}</span>
          </div>
          <h3>${m.name}</h3>
          <p class="muted" style="font-size:0.92rem">${m.desc}</p>
          <span class="meta">⏱️ ${m.n || v11count} preguntas · ${m.min ? m.min : Math.round(v11count * 1.4)} min</span>
        </label>`).join("")}
    </div>

    <div class="settings-bar">
      <div class="row" style="gap:24px">
        <label for="time">
          <span>Tiempo de examen:</span>
          <select id="time">
            <option value="std" ${pref.time === "std" ? "selected" : ""}>Estándar (90 min)</option>
            <option value="esl" ${pref.time === "esl" ? "selected" : ""}>ESL +30 min (120 min)</option>
            <option value="none" ${pref.time === "none" ? "selected" : ""}>Sin límite de tiempo</option>
          </select>
        </label>
        <label for="instant" style="cursor:pointer">
          <span class="switch">
            <input type="checkbox" id="instant" ${pref.instant ? "checked" : ""}>
            <span class="slider"></span>
          </span>
          <span>Corrección inmediata (modo estudio)</span>
        </label>
      </div>
      <button class="btn btn-primary" id="start" style="padding-inline:28px">Empezar examen →</button>
    </div>

    <section class="history-section">
      <div class="row spread">
        <h2>Historial de intentos</h2>
        ${history.length ? `<button class="btn ghost mini" id="clear-history">Limpiar historial</button>` : ""}
      </div>
      ${history.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>Modalidad</th><th>Puntaje</th><th>D1</th><th>D2</th><th>D3</th><th>D4</th><th>D5</th><th>Tiempo</th></tr></thead>
          <tbody>${history.slice().reverse().map(h => `<tr>
            <td>${new Date(h.date).toLocaleDateString("es", { month:"short", day:"numeric" })}</td>
            <td style="font-weight:700">${h.modeName}</td>
            <td class="num"><span class="pill ${h.pct >= 80 ? "ok" : h.pct >= 70 ? "warn" : "ko"}">${h.pct} %</span></td>
            ${["D1","D2","D3","D4","D5"].map(d => `<td class="num">${h.domains[d] == null ? "–" : h.domains[d] + "%"}</td>`).join("")}
            <td class="num">${fmtTime(h.used)}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>` :
      `<p class="muted">Aún no hay intentos registrados en este navegador. Al finalizar tu primer examen verás aquí la evolución gráfica por dominio.</p>`}
    </section>
  </div>`;

  document.querySelectorAll('input[name="mode"]').forEach(r => {
    r.onchange = () => {
      document.querySelectorAll(".mode-card").forEach(c => c.classList.remove("is-selected"));
      r.closest(".mode-card").classList.add("is-selected");
    };
  });

  document.getElementById("start").onclick = () => {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const time = document.getElementById("time").value;
    const instant = document.getElementById("instant").checked;
    store.set("-prefs", { ...store.get("-prefs", {}), mode, time, instant });
    startExam(mode, time, instant);
  };

  if (saved) {
    document.getElementById("resume").onclick = () => { state = saved; renderExam(); };
    document.getElementById("discard").onclick = () => { store.del("-current"); renderStart(); };
  }
  const clear = document.getElementById("clear-history");
  if (clear) clear.onclick = () => {
    if (confirm("¿Estás seguro de borrar todo tu historial de intentos?")) {
      store.del("-history");
      renderStart();
    }
  };
}

/* ---------- Examen en Vivo ---------- */
function startExam(modeId, time, instant) {
  const mode = MODES.find(m => m.id === modeId);
  const questions = mode.pick();
  const baseMin = mode.min || Math.round(questions.length * 1.4);
  const limit = time === "none" ? null : Math.round(baseMin * (time === "esl" ? 4 / 3 : 1) * 60);
  state = {
    modeId,
    modeName: mode.name,
    questions,
    answers: {},
    flags: {},
    idx: 0,
    limit,
    used: 0,
    instant,
    checked: {},
    answeredCount: 0,
    showEn: !!store.get("-prefs", {}).showEn
  };
  renderExam();
}

function persist() {
  state.answeredCount = Object.keys(state.answers).filter(k => state.answers[k].length).length;
  store.set("-current", state);
}

function renderExam() {
  const q = state.questions[state.idx];
  const total = state.questions.length;
  const multi = q.answer.length > 1;
  const picked = state.answers[q.id] || [];
  const checked = state.instant && state.checked[q.id];
  const answered = Object.keys(state.answers).filter(k => state.answers[k].length).length;
  const flagged = Object.keys(state.flags).filter(k => state.flags[k]).length;

  app.innerHTML = `
  <div class="top-bar" style="top:59px;background:color-mix(in srgb, var(--paper) 90%, transparent)">
    <div class="top-in">
      <div class="row" style="gap:16px;flex:1 1 auto">
        <span class="eyebrow">${state.modeName}${state.instant ? " · Modo Estudio" : ""}</span>
        <div class="progress-bar"><span style="width:${pct(answered, total)}%"></span></div>
        <span class="mono muted" style="font-size:0.88rem">${answered}/${total} respondidas</span>
      </div>
      <div class="row">
        <span class="timer ${state.limit && state.limit - state.used < 300 ? "low" : ""}" id="timer">
          ${state.limit ? fmtTime(Math.max(0, state.limit - state.used)) : fmtTime(state.used)}
        </span>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="exam-layout">
      <article class="qcard">
        <div class="qhead">
          <div class="row">
            <span class="pill" style="background:var(--accent-soft);color:var(--accent)">Pregunta ${state.idx + 1} de ${total}</span>
            <span class="eyebrow">${DOMAINS[q.domain]}</span>
          </div>
          <div class="row">
            ${multi ? `<span class="pill warn">Elige ${q.answer.length === 2 ? "DOS" : q.answer.length} opciones</span>` : ""}
            <button class="btn ghost mini" id="en-toggle">${state.showEn ? "Ocultar inglés" : "🌐 Ver en inglés"}</button>
          </div>
        </div>

        <p class="qtext">${q.text}</p>

        <div class="opts" role="${multi ? "group" : "radiogroup"}">
          ${q.options.map(o => {
            const on = picked.includes(o.id);
            let cls = on ? "picked" : "";
            if (checked) cls = q.answer.includes(o.id) ? "right" : on ? "wrong" : "";
            return `
            <label class="opt-label ${cls}" for="opt-${o.id}">
              <input type="${multi ? "checkbox" : "radio"}" name="opt" id="opt-${o.id}" value="${o.id}" ${on ? "checked" : ""} ${checked ? "disabled" : ""}>
              <span class="opt-letter">${o.id}</span>
              <span style="flex:1">${o.text}</span>
            </label>`;
          }).join("")}
        </div>

        <div id="en-zone">${state.showEn ? englishBlock(q) : ""}</div>

        ${state.instant && !checked ? `
        <div class="row">
          <button class="btn btn-primary" id="check" ${picked.length ? "" : "disabled"}>Comprobar respuesta</button>
        </div>` : ""}

        ${checked ? `
        <div class="feedback-box ${isCorrect(q, picked) ? "ok" : "ko"}">
          <div><strong>${isCorrect(q, picked) ? "✓ Correcto." : "✗ Incorrecto. Respuesta correcta: " + q.answer.join(", ") + "."}</strong></div>
          <div>${q.why}</div>
        </div>` : ""}

        <div class="row spread" style="padding-top:14px;border-top:1px solid var(--rule)">
          <div class="row">
            <button class="btn ghost" id="prev" ${state.idx === 0 ? "disabled" : ""}>← Anterior</button>
            <button class="btn ${state.flags[q.id] ? "btn-primary" : "ghost"}" id="flag">
              ${state.flags[q.id] ? "🚩 Marcada" : "🏳️ Marcar"}
            </button>
          </div>
          ${state.idx < total - 1 ?
            `<button class="btn btn-primary" id="next">Siguiente →</button>` :
            `<button class="btn btn-primary" id="finish">Terminar Examen ✓</button>`
          }
        </div>

        <div class="shortcuts-hint">
          <span>Atajos: <span class="kbd">1-5</span> o <span class="kbd">A-E</span> responder · <span class="kbd">←</span> <span class="kbd">→</span> navegar · <span class="kbd">F</span> marcar · <span class="kbd">T</span> inglés</span>
        </div>
      </article>

      <aside class="navpanel">
        <div class="row spread">
          <h3>Navegador</h3>
          <span class="mono muted" style="font-size:0.82rem">${pct(answered, total)}%</span>
        </div>
        <div class="navgrid">
          ${state.questions.map((x, i) => `
            <button class="nav-cell ${(state.answers[x.id] || []).length ? "answered" : ""} ${state.flags[x.id] ? "flagged" : ""} ${i === state.idx ? "current" : ""}" data-i="${i}" title="Pregunta ${i + 1}">
              ${i + 1}
            </button>
          `).join("")}
        </div>
        <div class="row spread" style="font-size:0.8rem;color:var(--muted);padding-block:6px;border-top:1px solid var(--rule)">
          <span>🟧 Respondida</span>
          <span>🚩 Marcada (${flagged})</span>
        </div>
        <div id="finish-zone">
          <button class="btn ghost" id="finish-side" style="width:100%">Finalizar intento</button>
        </div>
      </aside>
    </div>
  </div>`;

  // Control de selección de opciones
  app.querySelectorAll('input[name="opt"]').forEach(inp => inp.onchange = () => {
    const vals = [...app.querySelectorAll('input[name="opt"]:checked')].map(i => i.value);
    state.answers[q.id] = vals; persist(); renderExam();
  });

  const go = i => { state.idx = i; persist(); renderExam(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  document.getElementById("prev").onclick = () => go(state.idx - 1);
  const next = document.getElementById("next"); if (next) next.onclick = () => go(state.idx + 1);

  document.getElementById("en-toggle").onclick = () => {
    state.showEn = !state.showEn;
    const prefs = store.get("-prefs", {}); prefs.showEn = state.showEn; store.set("-prefs", prefs);
    persist(); renderExam();
  };

  document.getElementById("flag").onclick = () => { state.flags[q.id] = !state.flags[q.id]; persist(); renderExam(); };
  const check = document.getElementById("check"); if (check) check.onclick = () => { state.checked[q.id] = true; persist(); renderExam(); };

  app.querySelectorAll(".nav-cell").forEach(b => b.onclick = () => go(Number(b.dataset.i)));

  const askFinish = () => {
    const blank = total - answered;
    document.getElementById("finish-zone").innerHTML = `
    <div class="confirm-box" style="padding:14px;flex-direction:column;align-items:stretch">
      <span style="font-size:0.88rem">${blank ? `Quedan <strong>${blank}</strong> preguntas sin responder.` : "¡Has respondido todas las preguntas!"}${flagged ? ` Tienes <strong>${flagged}</strong> marcadas.` : ""}</span>
      <button class="btn btn-primary" id="finish-yes" style="margin-top:8px">Confirmar y ver informe</button>
      <button class="btn ghost mini" id="finish-no" style="margin-top:4px">Volver al examen</button>
    </div>`;
    document.getElementById("finish-yes").onclick = finish;
    document.getElementById("finish-no").onclick = renderExam;
    document.getElementById("finish-zone").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  document.getElementById("finish-side").onclick = askFinish;
  const fin = document.getElementById("finish"); if (fin) fin.onclick = askFinish;

  // Atajos de teclado interactivos
  window.onkeydown = e => {
    if (["input", "textarea", "select"].includes(e.target.tagName.toLowerCase())) return;
    if (e.key === "ArrowLeft" && state.idx > 0) { e.preventDefault(); go(state.idx - 1); }
    if (e.key === "ArrowRight" && state.idx < total - 1) { e.preventDefault(); go(state.idx + 1); }
    if (e.key.toLowerCase() === "f") { e.preventDefault(); document.getElementById("flag").click(); }
    if (e.key.toLowerCase() === "t") { e.preventDefault(); document.getElementById("en-toggle").click(); }
    const keyMap = { "1": "A", "2": "B", "3": "C", "4": "D", "5": "E", "a": "A", "b": "B", "c": "C", "d": "D", "e": "E" };
    const mapped = keyMap[e.key.toLowerCase()];
    if (mapped) {
      const opt = document.getElementById("opt-" + mapped);
      if (opt && !opt.disabled) { opt.click(); }
    }
  };

  // Cronómetro
  clearInterval(tick);
  tick = setInterval(() => {
    state.used++;
    const el = document.getElementById("timer");
    if (state.limit) {
      const left = state.limit - state.used;
      if (el) {
        el.textContent = fmtTime(Math.max(0, left));
        el.classList.toggle("low", left < 300);
      }
      if (left <= 0) { finish(); return; }
    } else if (el) {
      el.textContent = fmtTime(state.used);
    }
    if (state.used % 10 === 0) persist();
  }, 1000);
}

/* ---------- Pantalla de Informe ---------- */
function finish() {
  clearInterval(tick);
  window.onkeydown = null;
  const res = { total: 0, right: 0, by: {} };
  state.questions.forEach(q => {
    const ok = isCorrect(q, state.answers[q.id]);
    res.total++; if (ok) res.right++;
    const d = res.by[q.domain] || (res.by[q.domain] = { n: 0, ok: 0 });
    d.n++; if (ok) d.ok++;
  });
  const p = pct(res.right, res.total);
  const domains = {};
  Object.keys(DOMAINS).forEach(d => { domains[d] = res.by[d] ? pct(res.by[d].ok, res.by[d].n) : null; });
  const history = store.get("-history", []);
  history.push({ date: Date.now(), modeName: state.modeName, pct: p, domains, used: state.used });
  store.set("-history", history.slice(-30));
  store.del("-current");
  renderReport(res, p);
}

function renderReport(res, p) {
  const level = p >= 80 ?
    ["ok", "¡Nivel de Aprobado con Margen! 🏆", "Estás listo para el examen real. Mantén el repaso ligero."] :
    p >= 70 ?
    ["warn", "Zona de Riesgo (700-790) ⚠️", "Cerca del umbral. Refuerza los dominios en naranja antes de agendar."] :
    ["ko", "Necesita Refuerzo (< 700) 📈", "Revisa los conceptos base y realiza el plan de reintento."];

  const wrong = state.questions.filter(q => !isCorrect(q, state.answers[q.id]));

  app.innerHTML = `
  <div class="wrap report-grid">
    <div class="hero" style="padding-bottom:0">
      <div class="hero-tag"><span class="dot"></span><span>Resultado Oficial · ${state.modeName}</span></div>
      <h1>Tu Desglose <span class="gradient-text">Técnico</span></h1>
    </div>

    <section class="score-card">
      <div style="display:grid;gap:6px">
        <div class="score-big">${p} %</div>
        <p class="mono muted">${res.right} de ${res.total} respuestas correctas · Tiempo: ${fmtTime(state.used)}</p>
      </div>
      <div style="display:grid;gap:8px;max-width:28rem">
        <span class="pill ${level[0]}" style="font-size:0.95rem;padding:6px 16px">${level[1]}</span>
        <p class="muted" style="font-size:0.92rem">${level[2]} La puntuación de AWS es compensatoria y va de 100 a 1000 (mínimo 700 para certificar).</p>
      </div>
    </section>

    <section class="domain-bars">
      <h2>Rendimiento por Dominio</h2>
      ${Object.keys(DOMAINS).filter(d => res.by[d]).map(d => {
        const v = pct(res.by[d].ok, res.by[d].n);
        const ok = v >= 70;
        return `
        <div class="drow">
          <div><strong>${DOMAINS[d]}</strong> <span class="mono muted">(${WEIGHTS[d]}%)</span></div>
          <div class="track" role="img" aria-label="${v}%">
            <span style="width:${v}%;background:${ok ? 'var(--good)' : 'var(--flag)'}"></span>
            <i class="mark" title="Umbral de aprobación (70%)"></i>
          </div>
          <span class="mono" style="font-weight:700">${res.by[d].ok}/${res.by[d].n}</span>
          <span class="pill ${ok ? 'ok' : 'warn'}">${ok ? '✓ Cumple' : '⚠️ Necesita mejora'}</span>
        </div>`;
      }).join("")}
      <p class="muted" style="font-size:0.85rem;margin-top:6px">La línea vertical negra marca el 70 % orientativo. Si un dominio queda en «Necesita mejora», repasa sus cheatsheets antes de volver a intentar.</p>
    </section>

    <div class="row spread" style="margin-top:10px">
      <div class="row">
        <button class="btn btn-primary" id="again">← Repetir o Volver al Inicio</button>
        <a href="../../" class="btn ghost">Ir al inicio de Blend360</a>
      </div>
      <label for="only-wrong" class="btn ghost" style="cursor:pointer">
        <input type="checkbox" id="only-wrong" checked style="accent-color:var(--accent)">
        <span>Mostrar solo preguntas falladas (${wrong.length})</span>
      </label>
    </div>

    <section class="review" id="review" style="display:grid;gap:16px"></section>
  </div>`;

  const drawReview = onlyWrong => {
    const list = onlyWrong ? wrong : state.questions;
    document.getElementById("review").innerHTML = list.length ? list.map(q => {
      const ok = isCorrect(q, state.answers[q.id]);
      const mine = (state.answers[q.id] || []).join(", ") || "Sin responder";
      return `
      <article class="rcard ${ok ? 'is-right' : ''}">
        <div class="row spread">
          <span class="eyebrow">${DOMAINS[q.domain]}${q.new ? ' · Guía v1.1' : ''}</span>
          <span class="pill ${ok ? 'ok' : 'ko'}">${ok ? '✓ Correcta' : '✗ Fallada'}</span>
        </div>
        <p style="font-size:1.08rem;font-weight:600">${q.text}</p>
        <div class="row" style="gap:16px;font-size:0.94rem">
          <div><strong>Tu respuesta:</strong> <span class="mono">${mine}</span></div>
          <div><strong>Correcta:</strong> <span class="mono" style="color:var(--good);font-weight:700">${q.answer.join(', ')}</span></div>
        </div>
        <div style="display:grid;gap:5px;font-size:0.92rem;background:var(--surface);padding:12px 16px;border-radius:10px">
          ${q.options.filter(o => q.answer.includes(o.id)).map(o => `<div><span class="mono" style="font-weight:700">${o.id}.</span> ${o.text}</div>`).join('')}
        </div>
        <p class="muted" style="font-size:0.94rem">💡 ${q.why}</p>
        <details class="en-details" style="font-size:0.9rem;color:var(--accent);cursor:pointer"><summary>Ver versión en inglés</summary>${englishBlock(q)}</details>
      </article>`;
    }).join("") : `<p class="muted" style="padding:24px;text-align:center">¡Excelente! No tienes preguntas falladas en este intento.</p>`;
  };

  drawReview(true);
  document.getElementById("only-wrong").onchange = e => drawReview(e.target.checked);
  document.getElementById("again").onclick = renderStart;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

renderStart();
</script>
</body>
</html>
