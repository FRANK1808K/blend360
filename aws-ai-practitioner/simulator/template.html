<title>Simulador AIF-C01</title>
<meta name="description" content="Simulador cronometrado del examen AWS Certified AI Practitioner (AIF-C01) en español, con versión en inglés de cada pregunta e informe por dominio.">
<style>
/* Layout: interfaz de examen en blanco, como la del examen real. Barra superior con cronómetro, pregunta en una columna de lectura y navegador lateral que pasa abajo en móvil. Tema único claro a propósito. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #1a1a1a;
  --muted: #5f6368;
  --line: #d0d4d9;
  --accent: #1f5fa6;
  --accent-soft: #e8f0fa;
  --flag: #a85f00;
  --flag-soft: #fdf1df;
  --good: #1e7a45;
  --good-soft: #e3f3e9;
  --bad: #b3261e;
  --bad-soft: #fbe9e7;
  --en: #4a5560;
  --en-soft: #f5f7f9;
  --font-body: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --font-display: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.55; }
.wrap { max-width: 68rem; margin: 0 auto; padding-inline: 16px; padding-block: 1.5rem 3rem; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 700; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { font-family: var(--font-mono); font-size: 0.9em; background: var(--en-soft); border: 1px solid var(--line); padding: 0 0.25em; border-radius: 3px; }
button, select { font: inherit; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 4px; padding: 0.5rem 1rem; cursor: pointer; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .opt:focus-within, .nav-cell:focus-visible, .mode:focus-within, .en-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.btn-primary:hover { filter: brightness(1.1); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }

/* Inicio */
.intro { display: grid; gap: 0.75rem; max-width: 44rem; }
.facts { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; font-size: 0.9rem; }
.facts b { font-family: var(--font-mono); font-weight: 600; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; margin-block: 1.75rem; }
.mode { position: relative; display: grid; gap: 0.4rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; cursor: pointer; }
.mode input { position: absolute; opacity: 0; }
.mode:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mode .meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.1rem 0.45rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); justify-self: start; }
.settings { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: center; margin-bottom: 1.5rem; }
.settings label { display: flex; gap: 0.5rem; align-items: center; }
select { border: 1px solid var(--line); border-radius: 8px; padding: 0.4rem 0.6rem; background: var(--surface); color: var(--ink); }
.history { margin-top: 2.5rem; display: grid; gap: 0.75rem; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Examen */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-inner { max-width: 68rem; margin: 0 auto; padding-inline: 16px; padding-block: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; align-items: center; justify-content: space-between; }
.timer { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.progress { flex: 1 1 10rem; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 8rem; }
.progress span { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
.exam { display: grid; grid-template-columns: minmax(0, 1fr) 15rem; gap: 1.5rem; align-items: start; }
@media (max-width: 52rem) { .exam { grid-template-columns: minmax(0, 1fr); } }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem 1.4rem; display: grid; gap: 1rem; min-width: 0; }
.qhead { display: flex; justify-content: space-between; gap: 1rem; align-items: center; flex-wrap: wrap; }
.qtext { font-size: 1.08rem; max-width: 65ch; }
.hint { font-family: var(--font-mono); font-size: 0.8rem; color: var(--flag); }
.opts { display: grid; gap: 0.6rem; }
.opt { display: flex; gap: 0.75rem; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 0.7rem 0.85rem; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 0.3rem; accent-color: var(--accent); }
.opt .letter { font-family: var(--font-mono); font-weight: 600; color: var(--muted); }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { border-radius: 8px; padding: 0.75rem 0.9rem; font-size: 0.95rem; }
.feedback.ok { background: var(--good-soft); }
.feedback.ko { background: var(--bad-soft); }
.qfoot { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: space-between; }
.flag-btn[aria-pressed="true"] { border-color: var(--flag); background: var(--flag-soft); color: var(--ink); }
.navpanel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; display: grid; gap: 0.75rem; }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.2rem, 1fr)); gap: 0.35rem; }
.nav-cell { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; height: 2.2rem; font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer; position: relative; }
.nav-cell.answered { background: var(--accent-soft); border-color: var(--accent); }
.nav-cell.current { outline: 2px solid var(--ink); outline-offset: 1px; }
.nav-cell.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); }
.legend { display: grid; gap: 0.3rem; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 3px; margin-right: 0.4rem; vertical-align: -0.1rem; border: 1px solid var(--line); }
.confirm { border: 1px solid var(--flag); background: var(--flag-soft); border-radius: 8px; padding: 0.75rem; display: grid; gap: 0.6rem; font-size: 0.9rem; }

/* Informe */
.report { display: grid; gap: 1.5rem; }
.verdict { display: flex; flex-wrap: wrap; gap: 1.5rem 3rem; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem 1.4rem; }
.big { font-family: var(--font-display); font-size: clamp(2.6rem, 8vw, 3.6rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 999px; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--flag-soft); color: var(--flag); }
.pill.ko { background: var(--bad-soft); color: var(--bad); }
.domains { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem 1.4rem; display: grid; gap: 0.9rem; }
.drow { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) 4.5rem 9.5rem; gap: 0.75rem; align-items: center; font-size: 0.9rem; }
@media (max-width: 40rem) { .drow { grid-template-columns: minmax(0, 1fr) 4rem; } .drow .track { grid-column: 1 / -1; grid-row: 2; } .drow .pill { justify-self: start; } }
.track { position: relative; height: 10px; background: var(--line); border-radius: 999px; }
.track span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }
.track .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); left: 70%; }
.review { display: grid; gap: 1rem; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: var(--radius); padding: 1rem 1.2rem; display: grid; gap: 0.6rem; min-width: 0; }
.rcard.is-right { border-left-color: var(--good); }
.rmeta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.note { font-size: 0.85rem; color: var(--muted); max-width: 65ch; }
.en-toggle { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 4px; padding: 0.3rem 0.7rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.en-toggle[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.en-panel { border: 1px dashed var(--line); background: var(--en-soft); border-radius: var(--radius); padding: 0.85rem 1rem; display: grid; gap: 0.5rem; color: var(--en); }
.en-panel .qtext { font-size: 1rem; color: var(--ink); }
.en-panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
.en-panel li { font-size: 0.95rem; }
.en-panel .letter { font-family: var(--font-mono); font-weight: 700; color: var(--muted); }
details.en-details summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 0.9rem; }
details.en-details[open] summary { margin-bottom: 0.5rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>

<script>
const DATA = /*__DATA__*/null;
const DOMAINS = {
  D1: "D1 · Fundamentos de IA y ML",
  D2: "D2 · Fundamentos de IA generativa",
  D3: "D3 · Aplicaciones de modelos fundacionales",
  D4: "D4 · Pautas para una IA responsable",
  D5: "D5 · Seguridad, cumplimiento y gobernanza",
};
const WEIGHTS = { D1: 20, D2: 24, D3: 28, D4: 14, D5: 14 };
const STORE = "aifc01-sim";
const app = document.getElementById("app");
let state = null;
let tick = null;

const store = {
  get(k, d) { try { const v = localStorage.getItem(STORE + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(STORE + k, JSON.stringify(v)); } catch (e) { /* almacenamiento no disponible */ } },
  del(k) { try { localStorage.removeItem(STORE + k); } catch (e) { /* almacenamiento no disponible */ } },
};

const allQuestions = () => DATA.exams.flatMap(e => e.questions.map(q => ({ ...q, exam: e.name })));
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const MODES = [
  { id: "sim01", name: "Simulacro 01", tag: "Examen completo", desc: "65 preguntas con los pesos oficiales, incluye temas de la guía v1.1.", n: 65, min: 90,
    pick: () => DATA.exams[0].questions.map(q => ({ ...q, exam: DATA.exams[0].name })) },
  { id: "sim02", name: "Simulacro 02", tag: "Examen completo", desc: "65 preguntas de escenario, más difícil. Dos opciones plausibles en casi todas.", n: 65, min: 90,
    pick: () => DATA.exams[1].questions.map(q => ({ ...q, exam: DATA.exams[1].name })) },
  { id: "weak", name: "Refuerzo D1 · D3 · D4 · D5", tag: "Dominios débiles", desc: "40 preguntas al azar de los dominios marcados como «Necesita mejora» en tu informe.", n: 40, min: 55,
    pick: () => shuffle(allQuestions().filter(q => q.domain !== "D2")).slice(0, 40) },
  { id: "v11", name: "Novedades v1.1", tag: "Temas nuevos", desc: "Todas las preguntas de IA agéntica, MCP, AgentCore, tokens, grounding y servicios nuevos.", n: null, min: null,
    pick: () => shuffle(allQuestions().filter(q => q.new)) },
];

function englishBlock(q) {
  return `<div class="en-panel" lang="en">
    <span class="eyebrow">English version</span>
    <p class="qtext">${q.en.text}</p>
    <ul>${q.en.options.map(o => `<li><span class="letter">${o.id}.</span> ${o.text}</li>`).join("")}</ul>
  </div>`;
}
function fmtTime(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
function isCorrect(q, picked) {
  const p = (picked || []).slice().sort().join(",");
  return p === q.answer.slice().sort().join(",");
}

/* ---------- Inicio ---------- */
function renderStart() {
  clearInterval(tick);
  const saved = store.get("-current", null);
  const history = store.get("-history", []);
  const pref = store.get("-prefs", { mode: "sim01", time: "std", instant: false });
  const v11count = allQuestions().filter(q => q.new).length;
  app.innerHTML = `
  <div class="wrap">
    <div class="intro">
      <span class="eyebrow">AWS Certified AI Practitioner · AIF-C01</span>
      <h1>Simulador de examen</h1>
      <p class="muted">Practica en condiciones reales: interfaz en blanco como la del examen, cronómetro, preguntas marcadas para revisar e informe final por dominio con el mismo formato «Cumple / Necesita mejora» que envía AWS. Cada pregunta tiene un botón «Ver en inglés» para ver cómo aparecería en la versión inglesa del examen.</p>
      <div class="facts"><span><b>65</b> preguntas</span><span><b>90</b> min (<b>120</b> con ESL +30)</span><span>aprobado <b>700</b>/1000</span><span>objetivo en simulacros <b>≥ 80 %</b></span></div>
    </div>
    ${saved ? `<div class="confirm" style="margin-top:1.5rem"><span>Tienes un intento sin terminar de <strong>${saved.modeName}</strong> (${saved.answeredCount} respondidas).</span><div class="row"><button class="btn btn-primary" id="resume">Continuar intento</button><button class="btn" id="discard">Descartar</button></div></div>` : ""}
    <fieldset class="modes" style="border:0;padding:0">
      <legend class="eyebrow" style="margin-bottom:0.75rem">Elige una prueba</legend>
      ${MODES.map(m => `
        <label class="mode">
          <input type="radio" name="mode" id="mode-${m.id}" value="${m.id}" ${pref.mode === m.id ? "checked" : ""}>
          <span class="tag">${m.tag}</span>
          <h3>${m.name}</h3>
          <p class="muted" style="font-size:0.92rem">${m.desc}</p>
          <span class="meta">${m.n || v11count} preguntas · ${m.min ? m.min : Math.round(v11count * 1.4)} min</span>
        </label>`).join("")}
    </fieldset>
    <div class="settings">
      <label for="time">Tiempo
        <select id="time">
          <option value="std" ${pref.time === "std" ? "selected" : ""}>Estándar</option>
          <option value="esl" ${pref.time === "esl" ? "selected" : ""}>ESL +30 min (×1,33)</option>
          <option value="none" ${pref.time === "none" ? "selected" : ""}>Sin límite</option>
        </select>
      </label>
      <label for="instant"><input type="checkbox" id="instant" ${pref.instant ? "checked" : ""}> Corrección inmediata (modo estudio)</label>
      <button class="btn btn-primary" id="start">Empezar</button>
    </div>
    <section class="history">
      <h2>Tus intentos</h2>
      ${history.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Fecha</th><th>Prueba</th><th>Resultado</th><th>D1</th><th>D2</th><th>D3</th><th>D4</th><th>D5</th><th>Tiempo</th></tr></thead>
        <tbody>${history.slice().reverse().map(h => `<tr>
          <td>${new Date(h.date).toLocaleDateString("es")}</td><td>${h.modeName}</td>
          <td class="num"><span class="pill ${h.pct >= 80 ? "ok" : h.pct >= 70 ? "warn" : "ko"}">${h.pct} %</span></td>
          ${["D1","D2","D3","D4","D5"].map(d => `<td class="num">${h.domains[d] == null ? "–" : h.domains[d] + " %"}</td>`).join("")}
          <td class="num">${fmtTime(h.used)}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="row"><button class="btn" id="clear-history">Borrar historial</button></div>` :
      `<p class="muted">Aún no hay intentos. Al terminar una prueba, aquí verás tu puntuación por dominio para seguir tu progreso hacia el ≥ 80 %. El historial se guarda solo en este navegador.</p>`}
    </section>
  </div>`;
  document.getElementById("start").onclick = () => {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const time = document.getElementById("time").value;
    const instant = document.getElementById("instant").checked;
    store.set("-prefs", { ...store.get("-prefs", {}), mode, time, instant });
    startExam(mode, time, instant);
  };
  if (saved) {
    document.getElementById("resume").onclick = () => { state = saved; renderExam(); };
    document.getElementById("discard").onclick = () => { store.del("-current"); renderStart(); };
  }
  const clear = document.getElementById("clear-history");
  if (clear) clear.onclick = () => {
    clear.outerHTML = `<span class="confirm" id="clear-confirm">¿Borrar todos los intentos? <button class="btn" id="clear-yes">Sí, borrar</button> <button class="btn" id="clear-no">Cancelar</button></span>`;
    document.getElementById("clear-yes").onclick = () => { store.del("-history"); renderStart(); };
    document.getElementById("clear-no").onclick = renderStart;
  };
}

/* ---------- Examen ---------- */
function startExam(modeId, time, instant) {
  const mode = MODES.find(m => m.id === modeId);
  const questions = mode.pick();
  const baseMin = mode.min || Math.round(questions.length * 1.4);
  const limit = time === "none" ? null : Math.round(baseMin * (time === "esl" ? 4 / 3 : 1) * 60);
  state = { modeId, modeName: mode.name, questions, answers: {}, flags: {}, idx: 0, limit, used: 0, instant, checked: {}, answeredCount: 0, showEn: !!store.get("-prefs", {}).showEn };
  renderExam();
}
function persist() { state.answeredCount = Object.keys(state.answers).filter(k => state.answers[k].length).length; store.set("-current", state); }

function renderExam() {
  const q = state.questions[state.idx];
  const total = state.questions.length;
  const multi = q.answer.length > 1;
  const picked = state.answers[q.id] || [];
  const checked = state.instant && state.checked[q.id];
  const answered = Object.keys(state.answers).filter(k => state.answers[k].length).length;
  const flagged = Object.keys(state.flags).filter(k => state.flags[k]).length;
  app.innerHTML = `
  <div class="bar"><div class="bar-inner">
    <span class="eyebrow">${state.modeName}${state.instant ? " · modo estudio" : ""}</span>
    <div class="progress" aria-hidden="true"><span style="width:${pct(answered, total)}%"></span></div>
    <span class="mono muted" style="font-size:0.85rem">${answered}/${total} respondidas</span>
    <span class="timer ${state.limit && state.limit - state.used < 300 ? "low" : ""}" id="timer" aria-live="off">${state.limit ? fmtTime(Math.max(0, state.limit - state.used)) : fmtTime(state.used)}</span>
  </div></div>
  <div class="wrap">
    <div class="exam">
      <article class="qcard">
        <div class="qhead">
          <span class="eyebrow">Pregunta ${state.idx + 1} de ${total}</span>
          <div class="row" style="gap:0.5rem">
            ${multi ? `<span class="hint">Elige ${q.answer.length === 2 ? "DOS" : q.answer.length} respuestas</span>` : ""}
            <button class="en-toggle" id="en-toggle" aria-expanded="${!!state.showEn}" aria-controls="en-zone">${state.showEn ? "Ocultar inglés" : "Ver en inglés"}</button>
          </div>
        </div>
        <p class="qtext">${q.text}</p>
        <div class="opts" role="${multi ? "group" : "radiogroup"}">
          ${q.options.map(o => {
            const on = picked.includes(o.id);
            let cls = on ? "picked" : "";
            if (checked) cls = q.answer.includes(o.id) ? "right" : on ? "wrong" : "";
            return `<label class="opt ${cls}" for="opt-${o.id}">
              <input type="${multi ? "checkbox" : "radio"}" name="opt" id="opt-${o.id}" value="${o.id}" ${on ? "checked" : ""} ${checked ? "disabled" : ""}>
              <span><span class="letter">${o.id}.</span> ${o.text}</span></label>`;
          }).join("")}
        </div>
        <div id="en-zone">${state.showEn ? englishBlock(q) : ""}</div>
        ${state.instant && !checked ? `<div><button class="btn" id="check" ${picked.length ? "" : "disabled"}>Comprobar respuesta</button></div>` : ""}
        ${checked ? `<div class="feedback ${isCorrect(q, picked) ? "ok" : "ko"}"><strong>${isCorrect(q, picked) ? "Correcta." : "Incorrecta. Respuesta: " + q.answer.join(", ") + "."}</strong> ${q.why} <span class="rmeta">(${DOMAINS[q.domain]})</span></div>` : ""}
        <div class="qfoot">
          <div class="row">
            <button class="btn" id="prev" ${state.idx === 0 ? "disabled" : ""}>← Anterior</button>
            <button class="btn flag-btn" id="flag" aria-pressed="${!!state.flags[q.id]}">${state.flags[q.id] ? "Marcada para revisar" : "Marcar para revisar"}</button>
          </div>
          ${state.idx < total - 1 ? `<button class="btn btn-primary" id="next">Siguiente →</button>` : `<button class="btn btn-primary" id="finish">Terminar examen</button>`}
        </div>
      </article>
      <aside class="navpanel" aria-label="Navegador de preguntas">
        <h3>Navegador</h3>
        <div class="navgrid">
          ${state.questions.map((x, i) => `<button class="nav-cell ${(state.answers[x.id] || []).length ? "answered" : ""} ${state.flags[x.id] ? "flagged" : ""} ${i === state.idx ? "current" : ""}" data-i="${i}" aria-label="Pregunta ${i + 1}">${i + 1}</button>`).join("")}
        </div>
        <div class="legend">
          <span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>Respondida</span>
          <span><i style="background:var(--flag)"></i>Marcada (${flagged})</span>
        </div>
        <div id="finish-zone"><button class="btn" id="finish-side" style="width:100%">Terminar examen</button></div>
      </aside>
    </div>
  </div>`;

  app.querySelectorAll('input[name="opt"]').forEach(inp => inp.onchange = () => {
    const vals = [...app.querySelectorAll('input[name="opt"]:checked')].map(i => i.value);
    state.answers[q.id] = vals; persist(); renderExam();
  });
  const go = i => { state.idx = i; persist(); renderExam(); window.scrollTo(0, 0); };
  document.getElementById("prev").onclick = () => go(state.idx - 1);
  const next = document.getElementById("next"); if (next) next.onclick = () => go(state.idx + 1);
  document.getElementById("en-toggle").onclick = () => {
    state.showEn = !state.showEn;
    const prefs = store.get("-prefs", {}); prefs.showEn = state.showEn; store.set("-prefs", prefs);
    persist(); renderExam();
  };
  document.getElementById("flag").onclick = () => { state.flags[q.id] = !state.flags[q.id]; persist(); renderExam(); };
  const check = document.getElementById("check"); if (check) check.onclick = () => { state.checked[q.id] = true; persist(); renderExam(); };
  app.querySelectorAll(".nav-cell").forEach(b => b.onclick = () => go(Number(b.dataset.i)));
  const askFinish = () => {
    const blank = total - answered;
    document.getElementById("finish-zone").innerHTML = `<div class="confirm">
      <span>${blank ? `Quedan <strong>${blank}</strong> sin responder: en el examen real no penalizan los errores, así que responde todas.` : "Has respondido todas."}${flagged ? ` Tienes <strong>${flagged}</strong> marcadas.` : ""}</span>
      <button class="btn btn-primary" id="finish-yes">Terminar y ver informe</button>
      <button class="btn" id="finish-no">Seguir revisando</button></div>`;
    document.getElementById("finish-yes").onclick = finish;
    document.getElementById("finish-no").onclick = renderExam;
    document.getElementById("finish-zone").scrollIntoView({ block: "nearest" });
  };
  document.getElementById("finish-side").onclick = askFinish;
  const fin = document.getElementById("finish"); if (fin) fin.onclick = askFinish;

  clearInterval(tick);
  tick = setInterval(() => {
    state.used++;
    const el = document.getElementById("timer");
    if (state.limit) {
      const left = state.limit - state.used;
      if (el) { el.textContent = fmtTime(Math.max(0, left)); el.classList.toggle("low", left < 300); }
      if (left <= 0) { finish(); return; }
    } else if (el) el.textContent = fmtTime(state.used);
    if (state.used % 10 === 0) persist();
  }, 1000);
}

/* ---------- Informe ---------- */
function finish() {
  clearInterval(tick);
  const res = { total: 0, right: 0, by: {} };
  state.questions.forEach(q => {
    const ok = isCorrect(q, state.answers[q.id]);
    res.total++; if (ok) res.right++;
    const d = res.by[q.domain] || (res.by[q.domain] = { n: 0, ok: 0 });
    d.n++; if (ok) d.ok++;
  });
  const p = pct(res.right, res.total);
  const domains = {};
  Object.keys(DOMAINS).forEach(d => { domains[d] = res.by[d] ? pct(res.by[d].ok, res.by[d].n) : null; });
  const history = store.get("-history", []);
  history.push({ date: Date.now(), modeName: state.modeName, pct: p, domains, used: state.used });
  store.set("-history", history.slice(-30));
  store.del("-current");
  renderReport(res, p);
}

function renderReport(res, p) {
  const level = p >= 80 ? ["ok", "Listo: nivel de aprobado con margen"] : p >= 70 ? ["warn", "Zona de riesgo: refuerza los dominios en naranja"] : ["ko", "Aún no: sigue el plan de reintento"];
  const wrong = state.questions.filter(q => !isCorrect(q, state.answers[q.id]));
  app.innerHTML = `
  <div class="wrap report">
    <div class="intro">
      <span class="eyebrow">Informe · ${state.modeName}</span>
      <h1>Desglose de resultados</h1>
    </div>
    <section class="verdict">
      <div><div class="big">${p} %</div><p class="muted mono">${res.right} de ${res.total} correctas · ${fmtTime(state.used)}</p></div>
      <div style="display:grid;gap:0.4rem;justify-items:start;flex:1 1 18rem;min-width:0"><span class="pill ${level[0]}">${level[1]}</span>
      <p class="note">Objetivo antes de reservar: ≥ 80 % en simulacros. La puntuación real de AWS es escalada (100–1000, aprobado 700) y no equivale directamente a este porcentaje.</p></div>
    </section>
    <section class="domains">
      <h2>Rendimiento por dominio</h2>
      ${Object.keys(DOMAINS).filter(d => res.by[d]).map(d => {
        const v = pct(res.by[d].ok, res.by[d].n);
        const ok = v >= 70;
        return `<div class="drow"><span>${DOMAINS[d]} <span class="muted mono" style="white-space:nowrap">(${WEIGHTS[d]} %)</span></span>
          <div class="track" role="img" aria-label="${v} %"><span style="width:${v}%;background:${ok ? "var(--good)" : "var(--flag)"}"></span><i class="mark" title="Umbral orientativo 70 %"></i></div>
          <span class="mono">${res.by[d].ok}/${res.by[d].n}</span>
          <span class="pill ${ok ? "ok" : "warn"}">${ok ? "Cumple" : "Necesita mejora"}</span></div>`;
      }).join("")}
      <p class="note">La línea vertical marca el 70 %, umbral orientativo para «Cumple». AWS usa puntuación compensatoria: no hace falta aprobar cada dominio, pero el total sí.</p>
    </section>
    <div class="row">
      <button class="btn btn-primary" id="again">Volver al inicio</button>
      <label for="only-wrong"><input type="checkbox" id="only-wrong" checked> Mostrar solo las falladas (${wrong.length})</label>
    </div>
    <section class="review" id="review"></section>
  </div>`;
  const drawReview = onlyWrong => {
    const list = onlyWrong ? wrong : state.questions;
    document.getElementById("review").innerHTML = list.length ? list.map(q => {
      const ok = isCorrect(q, state.answers[q.id]);
      const mine = (state.answers[q.id] || []).join(", ") || "sin responder";
      return `<article class="rcard ${ok ? "is-right" : ""}">
        <span class="rmeta">${q.exam} · P${q.n} · ${DOMAINS[q.domain]}${q.new ? " · v1.1" : ""}</span>
        <p>${q.text}</p>
        <p><strong>Tu respuesta:</strong> ${mine} · <strong>Correcta:</strong> ${q.answer.join(", ")}</p>
        <div style="display:grid;gap:0.2rem;font-size:0.92rem">${q.options.filter(o => q.answer.includes(o.id)).map(o => `<span><span class="mono">${o.id}.</span> ${o.text}</span>`).join("")}</div>
        <p class="muted">${q.why}</p>
        <details class="en-details"><summary>Ver en inglés</summary>${englishBlock(q)}</details></article>`;
    }).join("") : `<p class="muted">Ninguna fallada. Excelente.</p>`;
  };
  drawReview(true);
  document.getElementById("only-wrong").onchange = e => drawReview(e.target.checked);
  document.getElementById("again").onclick = renderStart;
  window.scrollTo(0, 0);
}

renderStart();
</script>
