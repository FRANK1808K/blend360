<title>Simulador AIF-C01</title>
<meta name="description" content="Simulador cronometrado del examen AWS Certified AI Practitioner (AIF-C01) en español, con versión en inglés de cada pregunta e informe por dominio.">
<style>
/* Layout: interfaz de examen en blanco, como la del examen real. Barra superior con cronómetro, pregunta en una columna de lectura y navegador lateral que pasa abajo en móvil. Tema único claro a propósito. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #1a1a1a;
  --muted: #5f6368;
  --line: #d0d4d9;
  --accent: #1f5fa6;
  --accent-soft: #e8f0fa;
  --flag: #a85f00;
  --flag-soft: #fdf1df;
  --good: #1e7a45;
  --good-soft: #e3f3e9;
  --bad: #b3261e;
  --bad-soft: #fbe9e7;
  --en: #4a5560;
  --en-soft: #f5f7f9;
  --font-body: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --font-display: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.55; }
.wrap { max-width: 68rem; margin: 0 auto; padding-inline: 16px; padding-block: 1.5rem 3rem; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 700; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { font-family: var(--font-mono); font-size: 0.9em; background: var(--en-soft); border: 1px solid var(--line); padding: 0 0.25em; border-radius: 3px; }
button, select { font: inherit; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 4px; padding: 0.5rem 1rem; cursor: pointer; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .opt:focus-within, .nav-cell:focus-visible, .mode:focus-within, .en-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.btn-primary:hover { filter: brightness(1.1); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }

/* Inicio */
.intro { display: grid; gap: 0.75rem; max-width: 44rem; }
.facts { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; font-size: 0.9rem; }
.facts b { font-family: var(--font-mono); font-weight: 600; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; margin-block: 1.75rem; }
.mode { position: relative; display: grid; gap: 0.4rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; cursor: pointer; }
.mode input { position: absolute; opacity: 0; }
.mode:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mode .meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.1rem 0.45rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); justify-self: start; }
.settings { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: center; margin-bottom: 1.5rem; }
.settings label { display: flex; gap: 0.5rem; align-items: center; }
select { border: 1px solid var(--line); border-radius: 8px; padding: 0.4rem 0.6rem; background: var(--surface); color: var(--ink); }
.history { margin-top: 2.5rem; display: grid; gap: 0.75rem; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Examen */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-inner { max-width: 68rem; margin: 0 auto; padding-inline: 16px; padding-block: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; align-items: center; justify-content: space-between; }
.timer { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.progress { flex: 1 1 10rem; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 8rem; }
.progress span { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
.exam { display: grid; grid-template-columns: minmax(0, 1fr) 15rem; gap: 1.5rem; align-items: start; }
@media (max-width: 52rem) { .exam { grid-template-columns: minmax(0, 1fr); } }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem 1.4rem; display: grid; gap: 1rem; min-width: 0; }
.qhead { display: flex; justify-content: space-between; gap: 1rem; align-items: center; flex-wrap: wrap; }
.qtext { font-size: 1.08rem; max-width: 65ch; }
.hint { font-family: var(--font-mono); font-size: 0.8rem; color: var(--flag); }
.opts { display: grid; gap: 0.6rem; }
.opt { display: flex; gap: 0.75rem; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 0.7rem 0.85rem; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 0.3rem; accent-color: var(--accent); }
.opt .letter { font-family: var(--font-mono); font-weight: 600; color: var(--muted); }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { border-radius: 8px; padding: 0.75rem 0.9rem; font-size: 0.95rem; }
.feedback.ok { background: var(--good-soft); }
.feedback.ko { background: var(--bad-soft); }
.qfoot { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: space-between; }
.flag-btn[aria-pressed="true"] { border-color: var(--flag); background: var(--flag-soft); color: var(--ink); }
.navpanel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; display: grid; gap: 0.75rem; }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.2rem, 1fr)); gap: 0.35rem; }
.nav-cell { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; height: 2.2rem; font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer; position: relative; }
.nav-cell.answered { background: var(--accent-soft); border-color: var(--accent); }
.nav-cell.current { outline: 2px solid var(--ink); outline-offset: 1px; }
.nav-cell.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); }
.legend { display: grid; gap: 0.3rem; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 3px; margin-right: 0.4rem; vertical-align: -0.1rem; border: 1px solid var(--line); }
.confirm { border: 1px solid var(--flag); background: var(--flag-soft); border-radius: 8px; padding: 0.75rem; display: grid; gap: 0.6rem; font-size: 0.9rem; }

/* Informe */
.report { display: grid; gap: 1.5rem; }
.verdict { display: flex; flex-wrap: wrap; gap: 1.5rem 3rem; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem 1.4rem; }
.big { font-family: var(--font-display); font-size: clamp(2.6rem, 8vw, 3.6rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 999px; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--flag-soft); color: var(--flag); }
.pill.ko { background: var(--bad-soft); color: var(--bad); }
.domains { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem 1.4rem; display: grid; gap: 0.9rem; }
.drow { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) 4.5rem 9.5rem; gap: 0.75rem; align-items: center; font-size: 0.9rem; }
@media (max-width: 40rem) { .drow { grid-template-columns: minmax(0, 1fr) 4rem; } .drow .track { grid-column: 1 / -1; grid-row: 2; } .drow .pill { justify-self: start; } }
.track { position: relative; height: 10px; background: var(--line); border-radius: 999px; }
.track span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }
.track .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); left: 70%; }
.review { display: grid; gap: 1rem; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: var(--radius); padding: 1rem 1.2rem; display: grid; gap: 0.6rem; min-width: 0; }
.rcard.is-right { border-left-color: var(--good); }
.rmeta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.note { font-size: 0.85rem; color: var(--muted); max-width: 65ch; }
.en-toggle { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 4px; padding: 0.3rem 0.7rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.en-toggle[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.en-panel { border: 1px dashed var(--line); background: var(--en-soft); border-radius: var(--radius); padding: 0.85rem 1rem; display: grid; gap: 0.5rem; color: var(--en); }
.en-panel .qtext { font-size: 1rem; color: var(--ink); }
.en-panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
.en-panel li { font-size: 0.95rem; }
.en-panel .letter { font-family: var(--font-mono); font-weight: 700; color: var(--muted); }
details.en-details summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 0.9rem; }
details.en-details[open] summary { margin-bottom: 0.5rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>

<script>
const DATA = {"exams": [{"id": "sim01", "name": "Simulacro 01", "questions": [{"text": "Una tienda online quiere agrupar a sus clientes por comportamiento de compra. No tiene etiquetas de segmento. ¿Qué enfoque es el adecuado?", "options": [{"id": "A", "text": "Clasificación supervisada"}, {"id": "B", "text": "Regresión lineal"}, {"id": "C", "text": "Clustering (aprendizaje no supervisado)"}, {"id": "D", "text": "Aprendizaje por refuerzo"}], "answer": ["C"], "domain": "D1", "new": false, "why": "Sin etiquetas + agrupar = clustering.", "id": "sim01-1", "n": 1, "en": {"text": "An online store wants to group its customers by purchasing behavior. It has no segment labels. Which approach is appropriate?", "options": [{"id": "A", "text": "Supervised classification"}, {"id": "B", "text": "Linear regression"}, {"id": "C", "text": "Clustering (unsupervised learning)"}, {"id": "D", "text": "Reinforcement learning"}]}}, {"text": "¿Qué describe mejor un sistema de <strong>IA agéntica<\/strong>?", "options": [{"id": "A", "text": "Un sistema que usa un FM para planificar, invocar herramientas y ejecutar acciones de varios pasos hacia un objetivo."}, {"id": "B", "text": "Un modelo de difusión que genera imágenes a partir de texto."}, {"id": "C", "text": "Un sistema experto basado únicamente en reglas <code>if/else<\/code>."}, {"id": "D", "text": "Un modelo de regresión que predice ventas."}], "answer": ["A"], "domain": "D1", "new": true, "why": "Agente = FM que planifica, usa herramientas y actúa hacia un objetivo.", "id": "sim01-2", "n": 2, "en": {"text": "Which option BEST describes an <strong>agentic AI<\/strong> system?", "options": [{"id": "A", "text": "A system that uses an FM to plan, call tools, and take multi-step actions toward a goal."}, {"id": "B", "text": "A diffusion model that generates images from text."}, {"id": "C", "text": "An expert system based only on <code>if/else<\/code> rules."}, {"id": "D", "text": "A regression model that predicts sales."}]}}, {"text": "¿Cuál de los siguientes es un <strong>hiperparámetro<\/strong>?", "options": [{"id": "A", "text": "Los pesos de la red neuronal tras el entrenamiento"}, {"id": "B", "text": "Las predicciones del modelo"}, {"id": "C", "text": "Las features del dataset"}, {"id": "D", "text": "La tasa de aprendizaje (<em>learning rate<\/em>)"}], "answer": ["D"], "domain": "D1", "new": false, "why": "El learning rate se fija antes de entrenar; los pesos son parámetros.", "id": "sim01-3", "n": 3, "en": {"text": "Which of the following is a <strong>hyperparameter<\/strong>?", "options": [{"id": "A", "text": "The weights of the neural network after training"}, {"id": "B", "text": "The model's predictions"}, {"id": "C", "text": "The features of the dataset"}, {"id": "D", "text": "The learning rate"}]}}, {"text": "Un hospital entrena un modelo para detectar una enfermedad grave. <strong>No detectar<\/strong> a un paciente enfermo es mucho más grave que hacer una prueba adicional a un paciente sano. ¿Qué métrica debe priorizar?", "options": [{"id": "A", "text": "Exactitud (accuracy)"}, {"id": "B", "text": "Precisión (precision)"}, {"id": "C", "text": "Recall"}, {"id": "D", "text": "R²"}], "answer": ["C"], "domain": "D1", "new": false, "why": "El falso negativo es caro → recall.", "id": "sim01-4", "n": 4, "en": {"text": "A hospital trains a model to detect a serious disease. <strong>Missing<\/strong> a sick patient is far worse than running an extra test on a healthy patient. Which metric should the hospital prioritize?", "options": [{"id": "A", "text": "Accuracy"}, {"id": "B", "text": "Precision"}, {"id": "C", "text": "Recall"}, {"id": "D", "text": "R²"}]}}, {"text": "En un filtro de spam, enviar a la carpeta de spam un correo <strong>legítimo<\/strong> importante es el error más costoso. ¿Qué métrica debe priorizarse?", "options": [{"id": "A", "text": "Precisión (precision)"}, {"id": "B", "text": "Recall"}, {"id": "C", "text": "RMSE"}, {"id": "D", "text": "MAE"}], "answer": ["A"], "domain": "D1", "new": false, "why": "El falso positivo es caro → precisión.", "id": "sim01-5", "n": 5, "en": {"text": "In a spam filter, sending an important <strong>legitimate<\/strong> email to the spam folder is the most expensive error. Which metric should be prioritized?", "options": [{"id": "A", "text": "Precision"}, {"id": "B", "text": "Recall"}, {"id": "C", "text": "RMSE"}, {"id": "D", "text": "MAE"}]}}, {"text": "Un banco necesita un modelo para aprobar o rechazar préstamos a partir de datos <strong>tabulares<\/strong>. El regulador exige <strong>explicar cada decisión<\/strong> individual. ¿Qué enfoque es el más adecuado?", "options": [{"id": "A", "text": "Un LLM de Amazon Bedrock con un prompt que decida la aprobación"}, {"id": "B", "text": "Un modelo de ML tradicional (p. ej., XGBoost) con explicaciones de SageMaker Clarify"}, {"id": "C", "text": "Un modelo de difusión"}, {"id": "D", "text": "Un agente de Bedrock con acceso a la base de datos de clientes"}], "answer": ["B"], "domain": "D1", "new": true, "why": "Decisión regulada sobre datos tabulares que debe explicarse → ML tradicional + Clarify (1.2.6).", "id": "sim01-6", "n": 6, "en": {"text": "A bank needs a model to approve or reject loans based on <strong>tabular<\/strong> data. The regulator requires the bank to <strong>explain every individual decision<\/strong>. Which approach is MOST appropriate?", "options": [{"id": "A", "text": "An LLM on Amazon Bedrock with a prompt that decides the approval"}, {"id": "B", "text": "A traditional ML model (for example, XGBoost) with explanations from Amazon SageMaker Clarify"}, {"id": "C", "text": "A diffusion model"}, {"id": "D", "text": "An Amazon Bedrock agent with access to the customer database"}]}}, {"text": "Un modelo de pronóstico de demanda debe penalizar especialmente los <strong>errores grandes<\/strong>. ¿Qué métrica es la más adecuada?", "options": [{"id": "A", "text": "F1-score"}, {"id": "B", "text": "Precisión"}, {"id": "C", "text": "RMSE"}, {"id": "D", "text": "AUC-ROC"}], "answer": ["C"], "domain": "D1", "new": false, "why": "RMSE eleva al cuadrado los errores y penaliza los grandes.", "id": "sim01-7", "n": 7, "en": {"text": "A demand forecasting model must penalize <strong>large errors<\/strong> in particular. Which metric is MOST appropriate?", "options": [{"id": "A", "text": "F1 score"}, {"id": "B", "text": "Precision"}, {"id": "C", "text": "RMSE"}, {"id": "D", "text": "AUC-ROC"}]}}, {"text": "Un modelo obtiene 99 % de exactitud en entrenamiento y 65 % en validación. ¿Qué acción es la adecuada?", "options": [{"id": "A", "text": "Aumentar la complejidad del modelo"}, {"id": "B", "text": "Entrenar durante más epochs"}, {"id": "C", "text": "Eliminar el conjunto de validación"}, {"id": "D", "text": "Aplicar regularización y conseguir más datos de entrenamiento"}], "answer": ["D"], "domain": "D1", "new": false, "why": "Overfitting → regularización y más datos.", "id": "sim01-8", "n": 8, "en": {"text": "A model reaches 99% accuracy on the training set and 65% on the validation set. Which action is appropriate?", "options": [{"id": "A", "text": "Increase the model complexity"}, {"id": "B", "text": "Train for more epochs"}, {"id": "C", "text": "Remove the validation set"}, {"id": "D", "text": "Apply regularization and collect more training data"}]}}, {"text": "Una empresa necesita <strong>etiquetar<\/strong> 200 000 imágenes con ayuda de personas y reducir costos mediante etiquetado automático. ¿Qué servicio debe usar?", "options": [{"id": "A", "text": "Amazon SageMaker Ground Truth"}, {"id": "B", "text": "Amazon SageMaker Clarify"}, {"id": "C", "text": "Amazon SageMaker Model Monitor"}, {"id": "D", "text": "Amazon SageMaker Data Wrangler"}], "answer": ["A"], "domain": "D1", "new": false, "why": "Etiquetado humano + automático → Ground Truth.", "id": "sim01-9", "n": 9, "en": {"text": "A company needs to <strong>label<\/strong> 200,000 images with human help and reduce costs through automated labeling. Which service should the company use?", "options": [{"id": "A", "text": "Amazon SageMaker Ground Truth"}, {"id": "B", "text": "Amazon SageMaker Clarify"}, {"id": "C", "text": "Amazon SageMaker Model Monitor"}, {"id": "D", "text": "Amazon SageMaker Data Wrangler"}]}}, {"text": "Un modelo recibe tráfico <strong>intermitente e impredecible<\/strong>, con horas sin peticiones. El equipo quiere minimizar costos y tolera arranques en frío. ¿Qué opción de inferencia de SageMaker debe usar?", "options": [{"id": "A", "text": "Endpoint en tiempo real"}, {"id": "B", "text": "Serverless Inference"}, {"id": "C", "text": "Batch Transform"}, {"id": "D", "text": "Instancias EC2 reservadas"}], "answer": ["B"], "domain": "D1", "new": false, "why": "Tráfico intermitente, escala a cero, tolera cold starts → Serverless Inference.", "id": "sim01-10", "n": 10, "en": {"text": "A model receives <strong>intermittent and unpredictable<\/strong> traffic, with hours without requests. The team wants to minimize costs and can tolerate cold starts. Which SageMaker inference option should the team use?", "options": [{"id": "A", "text": "Real-time endpoint"}, {"id": "B", "text": "Serverless Inference"}, {"id": "C", "text": "Batch Transform"}, {"id": "D", "text": "Reserved Amazon EC2 instances"}]}}, {"text": "Un modelo procesa archivos de <strong>500 MB<\/strong> que tardan unos <strong>20 minutos<\/strong> cada uno. Las peticiones pueden encolarse. ¿Qué opción de inferencia es la adecuada?", "options": [{"id": "A", "text": "Real-time inference"}, {"id": "B", "text": "Serverless Inference"}, {"id": "C", "text": "Asynchronous Inference"}, {"id": "D", "text": "Amazon Bedrock On-Demand"}], "answer": ["C"], "domain": "D1", "new": false, "why": "Payloads grandes, procesos largos, cola → Asynchronous Inference.", "id": "sim01-11", "n": 11, "en": {"text": "A model processes <strong>500 MB<\/strong> files that take about <strong>20 minutes<\/strong> each. Requests can be queued. Which inference option is appropriate?", "options": [{"id": "A", "text": "Real-time inference"}, {"id": "B", "text": "Serverless Inference"}, {"id": "C", "text": "Asynchronous Inference"}, {"id": "D", "text": "Amazon Bedrock On-Demand"}]}}, {"text": "Un equipo quiere automatizar el flujo de ML (preparación, entrenamiento, evaluación y registro del modelo) como un pipeline de <strong>CI/CD<\/strong>. ¿Qué servicio debe usar?", "options": [{"id": "A", "text": "Amazon SageMaker Canvas"}, {"id": "B", "text": "Amazon SageMaker Ground Truth"}, {"id": "C", "text": "Amazon SageMaker JumpStart"}, {"id": "D", "text": "Amazon SageMaker Pipelines"}], "answer": ["D"], "domain": "D1", "new": false, "why": "CI/CD de ML → SageMaker Pipelines.", "id": "sim01-12", "n": 12, "en": {"text": "A team wants to automate its ML workflow (data preparation, training, evaluation, and model registration) as a <strong>CI/CD<\/strong> pipeline. Which service should the team use?", "options": [{"id": "A", "text": "Amazon SageMaker Canvas"}, {"id": "B", "text": "Amazon SageMaker Ground Truth"}, {"id": "C", "text": "Amazon SageMaker JumpStart"}, {"id": "D", "text": "Amazon SageMaker Pipelines"}]}}, {"text": "Un modelo obtiene resultados excelentes en el conjunto de prueba, pero malos en producción. Se descubre que una feature se calculaba con información del propio valor objetivo. ¿Qué problema es?", "options": [{"id": "A", "text": "Underfitting"}, {"id": "B", "text": "Data leakage (fuga de datos)"}, {"id": "C", "text": "Desbalanceo de clases"}, {"id": "D", "text": "Drift de concepto"}], "answer": ["B"], "domain": "D1", "new": false, "why": "Información del objetivo filtrada a las features → data leakage.", "id": "sim01-13", "n": 13, "en": {"text": "A model performs very well on the test set but poorly in production. The team discovers that one feature was calculated with information from the target value itself. What is the problem?", "options": [{"id": "A", "text": "Underfitting"}, {"id": "B", "text": "Data leakage"}, {"id": "C", "text": "Class imbalance"}, {"id": "D", "text": "Concept drift"}]}}, {"text": "Un equipo de marketing quiere que un LLM genere eslóganes <strong>creativos y variados<\/strong>. ¿Qué ajuste es el adecuado?", "options": [{"id": "A", "text": "Temperatura 0"}, {"id": "B", "text": "Top-K = 1"}, {"id": "C", "text": "Temperatura alta (p. ej., 0,9)"}, {"id": "D", "text": "Reducir el máximo de tokens a 10"}], "answer": ["C"], "domain": "D2", "new": false, "why": "Más creatividad → temperatura alta.", "id": "sim01-14", "n": 14, "en": {"text": "A marketing team wants an LLM to generate <strong>creative and varied<\/strong> slogans. Which setting is appropriate?", "options": [{"id": "A", "text": "Temperature of 0"}, {"id": "B", "text": "Top K = 1"}, {"id": "C", "text": "High temperature (for example, 0.9)"}, {"id": "D", "text": "Reduce the maximum tokens to 10"}]}}, {"text": "Un chatbot empieza a fallar en conversaciones largas con un error de \"entrada demasiado larga\". ¿Cuál es la mejor solución?", "options": [{"id": "A", "text": "Resumir o recortar el historial antiguo para no superar la ventana de contexto"}, {"id": "B", "text": "Aumentar la temperatura"}, {"id": "C", "text": "Cambiar a un modelo de generación de imágenes"}, {"id": "D", "text": "Aumentar Top-P"}], "answer": ["A"], "domain": "D2", "new": false, "why": "Se supera la ventana de contexto → resumir o recortar el historial (context engineering).", "id": "sim01-15", "n": 15, "en": {"text": "A chatbot starts failing in long conversations with an \"input too long\" error. What is the BEST solution?", "options": [{"id": "A", "text": "Summarize or trim older conversation history so it stays within the context window"}, {"id": "B", "text": "Increase the temperature"}, {"id": "C", "text": "Switch to an image generation model"}, {"id": "D", "text": "Increase Top P"}]}}, {"text": "Una aplicación envía un manual de 200 páginas completo en <strong>cada<\/strong> petición al modelo y los costos son muy altos. ¿Qué cambio reduce más el costo sin perder calidad?", "options": [{"id": "A", "text": "Aumentar <code>maxTokens<\/code>"}, {"id": "B", "text": "Contratar Provisioned Throughput aunque el tráfico sea bajo"}, {"id": "C", "text": "Aumentar la temperatura"}, {"id": "D", "text": "Usar RAG para enviar solo los fragmentos relevantes del manual"}], "answer": ["D"], "domain": "D2", "new": true, "why": "Menos tokens de entrada con RAG → menos costo (2.1.4).", "id": "sim01-16", "n": 16, "en": {"text": "An application sends a complete 200-page manual in <strong>every<\/strong> request to the model, and costs are very high. Which change reduces cost the MOST without losing quality?", "options": [{"id": "A", "text": "Increase <code>maxTokens<\/code>"}, {"id": "B", "text": "Purchase Provisioned Throughput even though traffic is low"}, {"id": "C", "text": "Increase the temperature"}, {"id": "D", "text": "Use RAG to send only the relevant parts of the manual"}]}}, {"text": "¿Qué afirmación sobre el <strong>precio por tokens<\/strong> de los FMs en Bedrock On-Demand es correcta?", "options": [{"id": "A", "text": "Solo se facturan los tokens de salida."}, {"id": "B", "text": "Se facturan tokens de entrada y de salida, y los de salida suelen ser más caros por token."}, {"id": "C", "text": "Se factura un precio fijo por petición independientemente de su tamaño."}, {"id": "D", "text": "Se factura por hora de instancia."}], "answer": ["B"], "domain": "D2", "new": true, "why": "Se pagan entrada y salida; la salida es más cara.", "id": "sim01-17", "n": 17, "en": {"text": "Which statement about <strong>token-based pricing<\/strong> for FMs on Amazon Bedrock On-Demand is correct?", "options": [{"id": "A", "text": "Only output tokens are billed."}, {"id": "B", "text": "Input and output tokens are billed, and output tokens usually cost more per token."}, {"id": "C", "text": "A fixed price is charged per request regardless of size."}, {"id": "D", "text": "Billing is per instance-hour."}]}}, {"text": "¿Qué es el <strong>context engineering<\/strong>?", "options": [{"id": "A", "text": "Ajustar los pesos del modelo con datos etiquetados"}, {"id": "B", "text": "Cifrar los prompts con AWS KMS"}, {"id": "C", "text": "Decidir y estructurar qué información (instrucciones, datos recuperados, herramientas, memoria) entra en el contexto del modelo"}, {"id": "D", "text": "Elegir el tipo de instancia GPU para el entrenamiento"}], "answer": ["C"], "domain": "D2", "new": true, "why": "Definición de context engineering (2.1.5).", "id": "sim01-18", "n": 18, "en": {"text": "What is <strong>context engineering<\/strong>?", "options": [{"id": "A", "text": "Adjusting the model weights with labeled data"}, {"id": "B", "text": "Encrypting prompts with AWS KMS"}, {"id": "C", "text": "Deciding and structuring which information (instructions, retrieved data, tools, memory) goes into the model's context"}, {"id": "D", "text": "Choosing the GPU instance type for training"}]}}, {"text": "¿Qué es el <strong>Model Context Protocol (MCP)<\/strong>?", "options": [{"id": "A", "text": "Un protocolo abierto que estandariza cómo los agentes y aplicaciones de IA se conectan con herramientas y fuentes de datos externas"}, {"id": "B", "text": "Un protocolo propietario de facturación de AWS"}, {"id": "C", "text": "Una técnica de compresión de modelos"}, {"id": "D", "text": "Una métrica de evaluación de LLMs"}], "answer": ["A"], "domain": "D2", "new": true, "why": "MCP = protocolo abierto agente ↔ herramientas/datos (2.1.6).", "id": "sim01-19", "n": 19, "en": {"text": "What is the <strong>Model Context Protocol (MCP)<\/strong>?", "options": [{"id": "A", "text": "An open protocol that standardizes how AI agents and applications connect to external tools and data sources"}, {"id": "B", "text": "A proprietary AWS billing protocol"}, {"id": "C", "text": "A model compression technique"}, {"id": "D", "text": "An evaluation metric for LLMs"}]}}, {"text": "Un asistente de viajes tiene un agente coordinador que delega en agentes especialistas de vuelos, hoteles y pagos, y combina sus resultados. ¿Qué patrón es?", "options": [{"id": "A", "text": "RLHF"}, {"id": "B", "text": "Supervisor (orquestador) multi-agente"}, {"id": "C", "text": "Inferencia por lotes"}, {"id": "D", "text": "Few-shot prompting"}], "answer": ["B"], "domain": "D2", "new": true, "why": "Coordinador que delega en especialistas → patrón supervisor.", "id": "sim01-20", "n": 20, "en": {"text": "A travel assistant has a coordinator agent that delegates to specialist agents for flights, hotels, and payments, and combines their results. Which pattern is this?", "options": [{"id": "A", "text": "RLHF"}, {"id": "B", "text": "Supervisor (orchestrator) multi-agent pattern"}, {"id": "C", "text": "Batch inference"}, {"id": "D", "text": "Few-shot prompting"}]}}, {"text": "Un asistente debe <strong>recordar las preferencias del usuario entre sesiones distintas<\/strong> (p. ej., asiento de pasillo). ¿Qué capacidad necesita?", "options": [{"id": "A", "text": "Una temperatura más baja"}, {"id": "B", "text": "Stop sequences"}, {"id": "C", "text": "Memoria a largo plazo del agente (p. ej., AgentCore Memory)"}, {"id": "D", "text": "Un Top-K mayor"}], "answer": ["C"], "domain": "D2", "new": true, "why": "Recordar entre sesiones → memoria a largo plazo.", "id": "sim01-21", "n": 21, "en": {"text": "An assistant must <strong>remember user preferences across different sessions<\/strong> (for example, an aisle seat). Which capability does it need?", "options": [{"id": "A", "text": "A lower temperature"}, {"id": "B", "text": "Stop sequences"}, {"id": "C", "text": "Long-term agent memory (for example, Amazon Bedrock AgentCore Memory)"}, {"id": "D", "text": "A higher Top K"}]}}, {"text": "Una empresa quiere un asistente que responda sobre sus políticas internas, que <strong>cambian cada semana<\/strong>, sin re-entrenar modelos. ¿Qué técnica debe usar?", "options": [{"id": "A", "text": "RAG con una base de conocimiento"}, {"id": "B", "text": "Fine-tuning semanal"}, {"id": "C", "text": "Pre-entrenamiento desde cero"}, {"id": "D", "text": "Incluir todas las políticas como ejemplos few-shot"}], "answer": ["A"], "domain": "D2", "new": false, "why": "Datos cambiantes sin re-entrenar → RAG.", "id": "sim01-22", "n": 22, "en": {"text": "A company wants an assistant that answers questions about its internal policies, which <strong>change every week<\/strong>, without retraining models. Which technique should the company use?", "options": [{"id": "A", "text": "RAG with a knowledge base"}, {"id": "B", "text": "Weekly fine-tuning"}, {"id": "C", "text": "Pre-training from scratch"}, {"id": "D", "text": "Including all policies as few-shot examples"}]}}, {"text": "¿Qué datos se necesitan para hacer <strong>fine-tuning<\/strong> de un FM con instrucciones?", "options": [{"id": "A", "text": "Un corpus sin etiquetar"}, {"id": "B", "text": "Ningún dato"}, {"id": "C", "text": "Solo imágenes"}, {"id": "D", "text": "Pares prompt–respuesta etiquetados"}], "answer": ["D"], "domain": "D2", "new": false, "why": "El fine-tuning con instrucciones necesita pares etiquetados.", "id": "sim01-23", "n": 23, "en": {"text": "What data is needed to perform instruction <strong>fine-tuning<\/strong> of an FM?", "options": [{"id": "A", "text": "An unlabeled corpus"}, {"id": "B", "text": "No data"}, {"id": "C", "text": "Only images"}, {"id": "D", "text": "Labeled prompt-response pairs"}]}}, {"text": "¿Qué es una <strong>alucinación<\/strong> de un LLM?", "options": [{"id": "A", "text": "Una respuesta plausible pero incorrecta o no respaldada por los datos"}, {"id": "B", "text": "Una negativa del modelo a responder"}, {"id": "C", "text": "Una respuesta lenta"}, {"id": "D", "text": "Un error de autenticación"}], "answer": ["A"], "domain": "D2", "new": false, "why": "Definición de alucinación.", "id": "sim01-24", "n": 24, "en": {"text": "What is a <strong>hallucination<\/strong> in an LLM?", "options": [{"id": "A", "text": "A plausible response that is incorrect or not supported by the data"}, {"id": "B", "text": "The model refusing to answer"}, {"id": "C", "text": "A slow response"}, {"id": "D", "text": "An authentication error"}]}}, {"text": "Para buscar documentos <strong>semánticamente similares<\/strong> a una consulta, ¿qué debe generarse para la consulta y los documentos?", "options": [{"id": "A", "text": "Stop sequences"}, {"id": "B", "text": "Embeddings (vectores)"}, {"id": "C", "text": "Hiperparámetros"}, {"id": "D", "text": "Model Units"}], "answer": ["B"], "domain": "D2", "new": false, "why": "La búsqueda semántica compara embeddings.", "id": "sim01-25", "n": 25, "en": {"text": "To find documents that are <strong>semantically similar<\/strong> to a query, what must be generated for the query and the documents?", "options": [{"id": "A", "text": "Stop sequences"}, {"id": "B", "text": "Embeddings (vectors)"}, {"id": "C", "text": "Hyperparameters"}, {"id": "D", "text": "Model units"}]}}, {"text": "Un equipo quiere evaluar automáticamente <strong>resúmenes<\/strong> generados comparándolos con resúmenes de referencia. ¿Qué métrica debe usar?", "options": [{"id": "A", "text": "BLEU"}, {"id": "B", "text": "RMSE"}, {"id": "C", "text": "ROUGE"}, {"id": "D", "text": "F1-score"}], "answer": ["C"], "domain": "D2", "new": false, "why": "Resumen → ROUGE (BLEU es para traducción).", "id": "sim01-26", "n": 26, "en": {"text": "A team wants to automatically evaluate generated <strong>summaries<\/strong> by comparing them with reference summaries. Which metric should the team use?", "options": [{"id": "A", "text": "BLEU"}, {"id": "B", "text": "RMSE"}, {"id": "C", "text": "ROUGE"}, {"id": "D", "text": "F1 score"}]}}, {"text": "¿Qué tipo de modelo genera imágenes <strong>eliminando ruido de forma iterativa<\/strong>?", "options": [{"id": "A", "text": "Modelo de difusión"}, {"id": "B", "text": "Transformer encoder-only"}, {"id": "C", "text": "Regresión lineal"}, {"id": "D", "text": "K-means"}], "answer": ["A"], "domain": "D2", "new": false, "why": "Los modelos de difusión eliminan ruido iterativamente.", "id": "sim01-27", "n": 27, "en": {"text": "Which type of model generates images by <strong>iteratively removing noise<\/strong>?", "options": [{"id": "A", "text": "Diffusion model"}, {"id": "B", "text": "Encoder-only transformer"}, {"id": "C", "text": "Linear regression"}, {"id": "D", "text": "K-means"}]}}, {"text": "Un desarrollador quiere que el modelo devuelva siempre un formato JSON concreto <strong>sin entrenar el modelo<\/strong>. ¿Qué técnica debe usar primero?", "options": [{"id": "A", "text": "Continued pre-training"}, {"id": "B", "text": "RLHF"}, {"id": "C", "text": "Fine-tuning"}, {"id": "D", "text": "Few-shot prompting con ejemplos del formato esperado"}], "answer": ["D"], "domain": "D2", "new": false, "why": "Formato sin entrenar → few-shot prompting.", "id": "sim01-28", "n": 28, "en": {"text": "A developer wants the model to always return a specific JSON format <strong>without training the model<\/strong>. Which technique should the developer try first?", "options": [{"id": "A", "text": "Continued pre-training"}, {"id": "B", "text": "RLHF"}, {"id": "C", "text": "Fine-tuning"}, {"id": "D", "text": "Few-shot prompting with examples of the expected format"}]}}, {"text": "Elige <strong>DOS<\/strong> limitaciones de la IA generativa.", "options": [{"id": "A", "text": "Salidas no deterministas"}, {"id": "B", "text": "Exactitud factual garantizada"}, {"id": "C", "text": "Alucinaciones"}, {"id": "D", "text": "Explicabilidad total de cada salida"}, {"id": "E", "text": "Costo de inferencia nulo"}], "answer": ["A", "C"], "domain": "D2", "new": false, "why": "No determinismo y alucinaciones; las demás opciones son falsas.", "id": "sim01-29", "n": 29, "en": {"text": "Which <strong>TWO<\/strong> are limitations of generative AI? (Select TWO.)", "options": [{"id": "A", "text": "Non-deterministic outputs"}, {"id": "B", "text": "Guaranteed factual accuracy"}, {"id": "C", "text": "Hallucinations"}, {"id": "D", "text": "Full explainability of every output"}, {"id": "E", "text": "Zero inference cost"}]}}, {"text": "Una startup quiere usar FMs de varios proveedores mediante una API, con <strong>el menor esfuerzo operativo<\/strong> y pago por uso. ¿Qué servicio debe elegir?", "options": [{"id": "A", "text": "Amazon EC2 con GPU"}, {"id": "B", "text": "Amazon SageMaker JumpStart"}, {"id": "C", "text": "Amazon Bedrock"}, {"id": "D", "text": "Amazon Comprehend"}], "answer": ["C"], "domain": "D3", "new": false, "why": "Serverless, varios proveedores, menor esfuerzo → Bedrock.", "id": "sim01-30", "n": 30, "en": {"text": "A startup wants to use FMs from several providers through an API, with the <strong>LEAST operational overhead<\/strong> and pay-per-use pricing. Which service should the startup choose?", "options": [{"id": "A", "text": "Amazon EC2 with GPUs"}, {"id": "B", "text": "Amazon SageMaker JumpStart"}, {"id": "C", "text": "Amazon Bedrock"}, {"id": "D", "text": "Amazon Comprehend"}]}}, {"text": "Un equipo de data science necesita desplegar un modelo open-source concreto <strong>eligiendo el tipo de instancia GPU<\/strong> y modificando el script de fine-tuning. ¿Qué opción es la adecuada?", "options": [{"id": "A", "text": "Amazon SageMaker JumpStart"}, {"id": "B", "text": "Amazon Bedrock On-Demand"}, {"id": "C", "text": "Amazon Q Business"}, {"id": "D", "text": "Amazon Bedrock Guardrails"}], "answer": ["A"], "domain": "D3", "new": false, "why": "Control de la instancia y del entrenamiento → JumpStart.", "id": "sim01-31", "n": 31, "en": {"text": "A data science team needs to deploy a specific open-source model, <strong>choose the GPU instance type<\/strong>, and modify the fine-tuning script. Which option is appropriate?", "options": [{"id": "A", "text": "Amazon SageMaker JumpStart"}, {"id": "B", "text": "Amazon Bedrock On-Demand"}, {"id": "C", "text": "Amazon Q Business"}, {"id": "D", "text": "Amazon Bedrock Guardrails"}]}}, {"text": "Al crear una Knowledge Base de Bedrock con la opción <em>Quick create<\/em>, ¿qué vector store se aprovisiona por defecto?", "options": [{"id": "A", "text": "Amazon DynamoDB"}, {"id": "B", "text": "Amazon MemoryDB"}, {"id": "C", "text": "Amazon RDS for MySQL"}, {"id": "D", "text": "Amazon OpenSearch Serverless"}], "answer": ["D"], "domain": "D3", "new": false, "why": "<em>Quick create<\/em> usa OpenSearch Serverless. MemoryDB salió del alcance en la v1.1.", "id": "sim01-32", "n": 32, "en": {"text": "When you create an Amazon Bedrock knowledge base with the <em>Quick create<\/em> option, which vector store is provisioned by default?", "options": [{"id": "A", "text": "Amazon DynamoDB"}, {"id": "B", "text": "Amazon MemoryDB"}, {"id": "C", "text": "Amazon RDS for MySQL"}, {"id": "D", "text": "Amazon OpenSearch Serverless"}]}}, {"text": "Una empresa ya usa <strong>Amazon Aurora PostgreSQL<\/strong> y quiere guardar los embeddings de su Knowledge Base junto a sus datos relacionales. ¿Qué opción es la adecuada?", "options": [{"id": "A", "text": "Aurora PostgreSQL con la extensión pgvector"}, {"id": "B", "text": "Amazon S3 Glacier"}, {"id": "C", "text": "Amazon ElastiCache"}, {"id": "D", "text": "Amazon Redshift sin extensiones"}], "answer": ["A"], "domain": "D3", "new": true, "why": "Aurora (añadido en la v1.1) admite vectores con pgvector y es un vector store soportado por las KB.", "id": "sim01-33", "n": 33, "en": {"text": "A company already uses <strong>Amazon Aurora PostgreSQL<\/strong> and wants to store the embeddings of its knowledge base alongside its relational data. Which option is appropriate?", "options": [{"id": "A", "text": "Aurora PostgreSQL with the pgvector extension"}, {"id": "B", "text": "Amazon S3 Glacier"}, {"id": "C", "text": "Amazon ElastiCache"}, {"id": "D", "text": "Amazon Redshift without extensions"}]}}, {"text": "En Amazon Bedrock Agents, ¿qué componente define las <strong>APIs que el agente puede invocar<\/strong>, normalmente ejecutadas por AWS Lambda y descritas con un esquema OpenAPI?", "options": [{"id": "A", "text": "Knowledge Base"}, {"id": "B", "text": "Guardrail"}, {"id": "C", "text": "Action group"}, {"id": "D", "text": "Provisioned Throughput"}], "answer": ["C"], "domain": "D3", "new": false, "why": "Action groups = APIs (OpenAPI) + Lambda.", "id": "sim01-34", "n": 34, "en": {"text": "In Amazon Bedrock Agents, which component defines the <strong>APIs that the agent can invoke<\/strong>, usually run by AWS Lambda and described with an OpenAPI schema?", "options": [{"id": "A", "text": "Knowledge base"}, {"id": "B", "text": "Guardrail"}, {"id": "C", "text": "Action group"}, {"id": "D", "text": "Provisioned Throughput"}]}}, {"text": "Un equipo ha construido agentes con un framework open-source (LangGraph) y quiere ejecutarlos en producción con <strong>runtime serverless, memoria, identidad y observabilidad gestionadas<\/strong>. ¿Qué servicio debe usar?", "options": [{"id": "A", "text": "Amazon Lex"}, {"id": "B", "text": "Amazon Bedrock AgentCore"}, {"id": "C", "text": "Amazon SageMaker Canvas"}, {"id": "D", "text": "Amazon Kendra"}], "answer": ["B"], "domain": "D3", "new": true, "why": "Cualquier framework + runtime/memoria/identidad/observabilidad gestionados → AgentCore.", "id": "sim01-35", "n": 35, "en": {"text": "A team built agents with an open-source framework (LangGraph) and wants to run them in production with a <strong>managed serverless runtime, memory, identity, and observability<\/strong>. Which service should the team use?", "options": [{"id": "A", "text": "Amazon Lex"}, {"id": "B", "text": "Amazon Bedrock AgentCore"}, {"id": "C", "text": "Amazon SageMaker Canvas"}, {"id": "D", "text": "Amazon Kendra"}]}}, {"text": "¿Qué es <strong>Strands Agents<\/strong>?", "options": [{"id": "A", "text": "Un IDE agéntico de AWS"}, {"id": "B", "text": "Un servicio de modernización de mainframes"}, {"id": "C", "text": "Un SDK open source de AWS para construir agentes \"model-driven\" con poco código"}, {"id": "D", "text": "Un vector store gestionado"}], "answer": ["C"], "domain": "D3", "new": true, "why": "Strands Agents = SDK open source model-driven.", "id": "sim01-36", "n": 36, "en": {"text": "What is <strong>Strands Agents<\/strong>?", "options": [{"id": "A", "text": "An agentic IDE from AWS"}, {"id": "B", "text": "A mainframe modernization service"}, {"id": "C", "text": "An open-source AWS SDK for building model-driven agents with little code"}, {"id": "D", "text": "A managed vector store"}]}}, {"text": "Un equipo de desarrollo quiere un IDE que, antes de generar código, convierta la petición en <strong>requisitos, diseño y lista de tareas<\/strong> (desarrollo guiado por especificaciones). ¿Qué herramienta encaja?", "options": [{"id": "A", "text": "Kiro"}, {"id": "B", "text": "Amazon Q Business"}, {"id": "C", "text": "AWS CodeCommit"}, {"id": "D", "text": "Amazon SageMaker Canvas"}], "answer": ["A"], "domain": "D3", "new": true, "why": "Kiro = IDE agéntico spec-driven.", "id": "sim01-37", "n": 37, "en": {"text": "A development team wants an IDE that converts a request into <strong>requirements, a design, and a task list<\/strong> before generating code (spec-driven development). Which tool fits?", "options": [{"id": "A", "text": "Kiro"}, {"id": "B", "text": "Amazon Q Business"}, {"id": "C", "text": "AWS CodeCommit"}, {"id": "D", "text": "Amazon SageMaker Canvas"}]}}, {"text": "Una aseguradora quiere modernizar aplicaciones <strong>COBOL de mainframe<\/strong> y migrar aplicaciones <strong>.NET<\/strong> de Windows a Linux con ayuda de agentes de IA. ¿Qué servicio debe usar?", "options": [{"id": "A", "text": "Amazon Textract"}, {"id": "B", "text": "Amazon Translate"}, {"id": "C", "text": "AWS Glue"}, {"id": "D", "text": "AWS Transform"}], "answer": ["D"], "domain": "D3", "new": true, "why": "Modernización de mainframe/.NET con agentes → AWS Transform.", "id": "sim01-38", "n": 38, "en": {"text": "An insurance company wants to modernize <strong>mainframe COBOL<\/strong> applications and migrate Windows <strong>.NET<\/strong> applications to Linux with help from AI agents. Which service should the company use?", "options": [{"id": "A", "text": "Amazon Textract"}, {"id": "B", "text": "Amazon Translate"}, {"id": "C", "text": "AWS Glue"}, {"id": "D", "text": "AWS Transform"}]}}, {"text": "Un chatbot público construido con Bedrock no debe mostrar <strong>números de tarjeta de crédito<\/strong> en sus respuestas. ¿Qué solución es la más sencilla?", "options": [{"id": "A", "text": "Fine-tuning con ejemplos de enmascarado"}, {"id": "B", "text": "Un filtro de información sensible (PII) de Amazon Bedrock Guardrails con acción MASK"}, {"id": "C", "text": "Amazon Macie sobre las respuestas"}, {"id": "D", "text": "Una política IAM que deniegue <code>bedrock:InvokeModel<\/code>"}], "answer": ["B"], "domain": "D3", "new": false, "why": "Filtro de información sensible de Guardrails con MASK.", "id": "sim01-39", "n": 39, "en": {"text": "A public chatbot built with Amazon Bedrock must not show <strong>credit card numbers<\/strong> in its responses. Which solution is the SIMPLEST?", "options": [{"id": "A", "text": "Fine-tuning with masking examples"}, {"id": "B", "text": "An Amazon Bedrock Guardrails sensitive information (PII) filter with the MASK action"}, {"id": "C", "text": "Amazon Macie on the responses"}, {"id": "D", "text": "An IAM policy that denies <code>bedrock:InvokeModel<\/code>"}]}}, {"text": "El equipo necesita <strong>versionar<\/strong> los prompts de producción, compararlos entre modelos y <strong>volver a una versión anterior<\/strong> si la calidad empeora. ¿Qué debe usar?", "options": [{"id": "A", "text": "AWS CloudTrail"}, {"id": "B", "text": "Amazon S3 Lifecycle"}, {"id": "C", "text": "Amazon Bedrock Prompt Management"}, {"id": "D", "text": "Amazon CloudWatch Logs Insights"}], "answer": ["C"], "domain": "D3", "new": true, "why": "Versionado y rollback de prompts → Prompt Management (3.2.5).", "id": "sim01-40", "n": 40, "en": {"text": "The team needs to <strong>version<\/strong> production prompts, compare them across models, and <strong>roll back<\/strong> to a previous version if quality drops. What should the team use?", "options": [{"id": "A", "text": "AWS CloudTrail"}, {"id": "B", "text": "Amazon S3 Lifecycle"}, {"id": "C", "text": "Amazon Bedrock Prompt Management"}, {"id": "D", "text": "Amazon CloudWatch Logs Insights"}]}}, {"text": "Una empresa necesita extraer importes, fechas y tablas de <strong>facturas escaneadas<\/strong>. ¿Qué servicio debe usar?", "options": [{"id": "A", "text": "Amazon Textract"}, {"id": "B", "text": "Amazon Rekognition"}, {"id": "C", "text": "Amazon Comprehend"}, {"id": "D", "text": "Amazon Polly"}], "answer": ["A"], "domain": "D3", "new": false, "why": "Formularios y tablas en documentos → Textract.", "id": "sim01-41", "n": 41, "en": {"text": "A company needs to extract amounts, dates, and tables from <strong>scanned invoices<\/strong>. Which service should the company use?", "options": [{"id": "A", "text": "Amazon Textract"}, {"id": "B", "text": "Amazon Rekognition"}, {"id": "C", "text": "Amazon Comprehend"}, {"id": "D", "text": "Amazon Polly"}]}}, {"text": "Una empresa quiere analizar el <strong>sentimiento de llamadas grabadas<\/strong> del centro de contacto. ¿Qué combinación de servicios es la adecuada?", "options": [{"id": "A", "text": "Amazon Polly → Amazon Comprehend"}, {"id": "B", "text": "Amazon Rekognition → Amazon Lex"}, {"id": "C", "text": "Amazon Translate → Amazon Polly"}, {"id": "D", "text": "Amazon Transcribe → Amazon Comprehend"}], "answer": ["D"], "domain": "D3", "new": false, "why": "Voz → texto (Transcribe) → sentimiento (Comprehend).", "id": "sim01-42", "n": 42, "en": {"text": "A company wants to analyze the <strong>sentiment of recorded calls<\/strong> from its contact center. Which combination of services is appropriate?", "options": [{"id": "A", "text": "Amazon Polly → Amazon Comprehend"}, {"id": "B", "text": "Amazon Rekognition → Amazon Lex"}, {"id": "C", "text": "Amazon Translate → Amazon Polly"}, {"id": "D", "text": "Amazon Transcribe → Amazon Comprehend"}]}}, {"text": "Los empleados quieren hacer preguntas sobre documentos de RR. HH. guardados en SharePoint. Cada empleado solo debe ver lo que ya tiene permiso para ver, y la empresa quiere una solución <strong>lista para usar<\/strong>. ¿Qué servicio debe usar?", "options": [{"id": "A", "text": "Amazon Q Developer"}, {"id": "B", "text": "Amazon Q Business"}, {"id": "C", "text": "Amazon Lex"}, {"id": "D", "text": "Amazon Personalize"}], "answer": ["B"], "domain": "D3", "new": false, "why": "Datos corporativos + permisos + listo para usar → Q Business.", "id": "sim01-43", "n": 43, "en": {"text": "Employees want to ask questions about HR documents stored in SharePoint. Each employee must only see what they already have permission to see, and the company wants a <strong>ready-to-use<\/strong> solution. Which service should the company use?", "options": [{"id": "A", "text": "Amazon Q Developer"}, {"id": "B", "text": "Amazon Q Business"}, {"id": "C", "text": "Amazon Lex"}, {"id": "D", "text": "Amazon Personalize"}]}}, {"text": "Los analistas de negocio quieren hacer <strong>preguntas en lenguaje natural<\/strong> sobre sus dashboards, generar investigaciones con fuentes citadas y crear <strong>automatizaciones sin código<\/strong>. ¿Qué servicio encaja mejor?", "options": [{"id": "A", "text": "Amazon EMR"}, {"id": "B", "text": "AWS Glue DataBrew"}, {"id": "C", "text": "Amazon Quick (Quick Sight, Quick Research, Quick Flows)"}, {"id": "D", "text": "Amazon Athena"}], "answer": ["C"], "domain": "D3", "new": true, "why": "BI en lenguaje natural, investigación y automatización → Amazon Quick.", "id": "sim01-44", "n": 44, "en": {"text": "Business analysts want to ask <strong>natural language questions<\/strong> about their dashboards, produce research with cited sources, and create <strong>no-code automations<\/strong>. Which service fits BEST?", "options": [{"id": "A", "text": "Amazon EMR"}, {"id": "B", "text": "AWS Glue DataBrew"}, {"id": "C", "text": "Amazon Quick (Quick Sight, Quick Research, Quick Flows)"}, {"id": "D", "text": "Amazon Athena"}]}}, {"text": "Una empresa quiere comparar tres FMs según si sus respuestas respetan el <strong>tono de la marca<\/strong>, con la valoración de su propio equipo. ¿Qué debe usar?", "options": [{"id": "A", "text": "Amazon Bedrock Model Evaluation con trabajadores humanos"}, {"id": "B", "text": "Amazon CloudWatch"}, {"id": "C", "text": "SageMaker Clarify (sesgo pre-entrenamiento)"}, {"id": "D", "text": "AWS Trusted Advisor"}], "answer": ["A"], "domain": "D3", "new": false, "why": "Criterios subjetivos (tono) → evaluación humana.", "id": "sim01-45", "n": 45, "en": {"text": "A company wants to compare three FMs on whether their responses follow the <strong>brand's tone<\/strong>, as judged by its own team. What should the company use?", "options": [{"id": "A", "text": "Amazon Bedrock Model Evaluation with human workers"}, {"id": "B", "text": "Amazon CloudWatch"}, {"id": "C", "text": "SageMaker Clarify (pre-training bias)"}, {"id": "D", "text": "AWS Trusted Advisor"}]}}, {"text": "Un equipo necesita evaluar la <strong>corrección y completitud<\/strong> de miles de respuestas de un FM a escala, sin revisores humanos y con explicaciones. ¿Qué método es el adecuado?", "options": [{"id": "A", "text": "Solo la métrica BLEU"}, {"id": "B", "text": "RMSE"}, {"id": "C", "text": "Revisión manual de todas las respuestas"}, {"id": "D", "text": "LLM-as-a-judge en Amazon Bedrock Model Evaluation"}], "answer": ["D"], "domain": "D3", "new": true, "why": "Evaluación a escala con explicaciones → LLM-as-a-judge (3.4.2).", "id": "sim01-46", "n": 46, "en": {"text": "A team needs to evaluate the <strong>correctness and completeness<\/strong> of thousands of FM responses at scale, without human reviewers and with explanations. Which method is appropriate?", "options": [{"id": "A", "text": "The BLEU metric only"}, {"id": "B", "text": "RMSE"}, {"id": "C", "text": "Manual review of every response"}, {"id": "D", "text": "LLM-as-a-judge in Amazon Bedrock Model Evaluation"}]}}, {"text": "¿Qué métrica muestra mejor si un asistente de soporte aporta <strong>valor de negocio<\/strong>?", "options": [{"id": "A", "text": "Perplexity"}, {"id": "B", "text": "Tasa de tareas completadas sin escalar a un humano"}, {"id": "C", "text": "Número de parámetros del modelo"}, {"id": "D", "text": "Dimensión de los embeddings"}], "answer": ["B"], "domain": "D3", "new": true, "why": "Métrica de negocio → tasa de tareas completadas (3.4.5).", "id": "sim01-47", "n": 47, "en": {"text": "Which metric BEST shows whether a support assistant delivers <strong>business value<\/strong>?", "options": [{"id": "A", "text": "Perplexity"}, {"id": "B", "text": "Rate of tasks completed without escalation to a human"}, {"id": "C", "text": "Number of model parameters"}, {"id": "D", "text": "Embedding dimension"}]}}, {"text": "Antes de entrenar un modelo de contratación, un equipo quiere comprobar si el dataset está <strong>desbalanceado por género<\/strong>. ¿Qué servicio debe usar?", "options": [{"id": "A", "text": "Amazon SageMaker Model Monitor"}, {"id": "B", "text": "AWS CloudTrail"}, {"id": "C", "text": "Amazon SageMaker Clarify"}, {"id": "D", "text": "Amazon Bedrock Guardrails"}], "answer": ["C"], "domain": "D4", "new": false, "why": "Sesgo pre-entrenamiento → Clarify.", "id": "sim01-48", "n": 48, "en": {"text": "Before training a hiring model, a team wants to check whether the dataset is <strong>imbalanced by gender<\/strong>. Which service should the team use?", "options": [{"id": "A", "text": "Amazon SageMaker Model Monitor"}, {"id": "B", "text": "AWS CloudTrail"}, {"id": "C", "text": "Amazon SageMaker Clarify"}, {"id": "D", "text": "Amazon Bedrock Guardrails"}]}}, {"text": "Un modelo en producción empieza a recibir datos con una distribución distinta a la del entrenamiento. ¿Qué servicio detecta este <strong>drift<\/strong> y emite alertas?", "options": [{"id": "A", "text": "Amazon SageMaker Model Monitor"}, {"id": "B", "text": "Amazon SageMaker Ground Truth"}, {"id": "C", "text": "AWS Artifact"}, {"id": "D", "text": "Amazon Macie"}], "answer": ["A"], "domain": "D4", "new": false, "why": "Drift en producción → Model Monitor.", "id": "sim01-49", "n": 49, "en": {"text": "A production model starts receiving data with a different distribution from the training data. Which service detects this <strong>drift<\/strong> and sends alerts?", "options": [{"id": "A", "text": "Amazon SageMaker Model Monitor"}, {"id": "B", "text": "Amazon SageMaker Ground Truth"}, {"id": "C", "text": "AWS Artifact"}, {"id": "D", "text": "Amazon Macie"}]}}, {"text": "¿Qué herramienta documenta de forma estandarizada el <strong>uso previsto, el nivel de riesgo y las métricas<\/strong> de un modelo?", "options": [{"id": "A", "text": "AWS Config"}, {"id": "B", "text": "Amazon SageMaker Feature Store"}, {"id": "C", "text": "AWS Artifact"}, {"id": "D", "text": "Amazon SageMaker Model Cards"}], "answer": ["D"], "domain": "D4", "new": false, "why": "Documentación del modelo → Model Cards.", "id": "sim01-50", "n": 50, "en": {"text": "Which tool documents a model's <strong>intended use, risk rating, and metrics<\/strong> in a standardized way?", "options": [{"id": "A", "text": "AWS Config"}, {"id": "B", "text": "Amazon SageMaker Feature Store"}, {"id": "C", "text": "AWS Artifact"}, {"id": "D", "text": "Amazon SageMaker Model Cards"}]}}, {"text": "Cuando Amazon Textract extrae datos con <strong>baja confianza<\/strong>, una persona debe revisarlos antes de continuar. ¿Qué servicio implementa este flujo?", "options": [{"id": "A", "text": "Amazon Comprehend"}, {"id": "B", "text": "Amazon Augmented AI (A2I)"}, {"id": "C", "text": "Amazon Bedrock Model Evaluation"}, {"id": "D", "text": "AWS Step Functions sin revisión"}], "answer": ["B"], "domain": "D4", "new": false, "why": "Revisión humana por baja confianza → A2I.", "id": "sim01-51", "n": 51, "en": {"text": "When Amazon Textract extracts data with <strong>low confidence<\/strong>, a person must review it before the process continues. Which service implements this workflow?", "options": [{"id": "A", "text": "Amazon Comprehend"}, {"id": "B", "text": "Amazon Augmented AI (Amazon A2I)"}, {"id": "C", "text": "Amazon Bedrock Model Evaluation"}, {"id": "D", "text": "AWS Step Functions without review"}]}}, {"text": "Una aseguradora debe explicar a cada cliente <strong>qué factores influyeron<\/strong> en el precio calculado por su modelo. ¿Qué técnica es la adecuada?", "options": [{"id": "A", "text": "Valores SHAP con SageMaker Clarify"}, {"id": "B", "text": "Aumentar la temperatura"}, {"id": "C", "text": "Cifrado con KMS"}, {"id": "D", "text": "Batch Transform"}], "answer": ["A"], "domain": "D4", "new": false, "why": "Explicación por predicción → SHAP (Clarify).", "id": "sim01-52", "n": 52, "en": {"text": "An insurance company must explain to each customer <strong>which factors influenced<\/strong> the price calculated by its model. Which technique is appropriate?", "options": [{"id": "A", "text": "SHAP values with SageMaker Clarify"}, {"id": "B", "text": "Increasing the temperature"}, {"id": "C", "text": "Encryption with AWS KMS"}, {"id": "D", "text": "Batch Transform"}]}}, {"text": "Elige <strong>DOS<\/strong> herramientas de AWS que la guía cita para la <strong>explicabilidad y transparencia<\/strong> de soluciones de IA.", "options": [{"id": "A", "text": "AWS Shield"}, {"id": "B", "text": "Amazon SageMaker Clarify"}, {"id": "C", "text": "Amazon Bedrock Model Evaluations"}, {"id": "D", "text": "Amazon Route 53"}, {"id": "E", "text": "AWS Snowball"}], "answer": ["B", "C"], "domain": "D4", "new": true, "why": "La guía cita Clarify y Bedrock Model Evaluations (4.2.2).", "id": "sim01-53", "n": 53, "en": {"text": "Which <strong>TWO<\/strong> AWS tools does the exam guide cite for the <strong>explainability and transparency<\/strong> of AI solutions? (Select TWO.)", "options": [{"id": "A", "text": "AWS Shield"}, {"id": "B", "text": "Amazon SageMaker Clarify"}, {"id": "C", "text": "Amazon Bedrock Model Evaluations"}, {"id": "D", "text": "Amazon Route 53"}, {"id": "E", "text": "AWS Snowball"}]}}, {"text": "Un cliente pregunta si los prompts enviados a Amazon Bedrock se usan para <strong>entrenar los modelos base<\/strong>. ¿Qué respuesta es correcta?", "options": [{"id": "A", "text": "Sí, salvo que lo desactives en cada petición."}, {"id": "B", "text": "Solo en los modelos de Amazon."}, {"id": "C", "text": "No: no se usan para entrenar los modelos base ni se comparten con los proveedores."}, {"id": "D", "text": "Solo si usas Provisioned Throughput."}], "answer": ["C"], "domain": "D4", "new": false, "why": "Bedrock no usa tus datos para entrenar modelos base.", "id": "sim01-54", "n": 54, "en": {"text": "A customer asks whether the prompts sent to Amazon Bedrock are used to <strong>train the base models<\/strong>. Which answer is correct?", "options": [{"id": "A", "text": "Yes, unless you turn it off in each request."}, {"id": "B", "text": "Only for Amazon models."}, {"id": "C", "text": "No. They are not used to train the base models and are not shared with the model providers."}, {"id": "D", "text": "Only if you use Provisioned Throughput."}]}}, {"text": "Un modelo de reconocimiento de voz funciona mal con personas mayores porque el dataset tenía muy pocas grabaciones de ese grupo. ¿Qué problema es y cómo se corrige?", "options": [{"id": "A", "text": "Overfitting; reducir los epochs"}, {"id": "B", "text": "Sesgo de muestreo; ampliar el dataset para que sea representativo"}, {"id": "C", "text": "Alucinación; bajar la temperatura"}, {"id": "D", "text": "Latencia; usar Provisioned Throughput"}], "answer": ["B"], "domain": "D4", "new": false, "why": "Grupo infrarrepresentado → sesgo de muestreo → datos representativos.", "id": "sim01-55", "n": 55, "en": {"text": "A speech recognition model performs poorly for older people because the dataset had very few recordings from that group. What is the problem, and how is it corrected?", "options": [{"id": "A", "text": "Overfitting; reduce the epochs"}, {"id": "B", "text": "Sampling bias; expand the dataset so it is representative"}, {"id": "C", "text": "Hallucination; lower the temperature"}, {"id": "D", "text": "Latency; use Provisioned Throughput"}]}}, {"text": "¿Qué afirmación describe el <strong>compromiso entre interpretabilidad y desempeño<\/strong>?", "options": [{"id": "A", "text": "Los modelos simples siempre son más precisos."}, {"id": "B", "text": "El deep learning es totalmente interpretable."}, {"id": "C", "text": "Los modelos más complejos suelen ser más precisos pero menos interpretables."}, {"id": "D", "text": "La interpretabilidad no importa en sectores regulados."}], "answer": ["C"], "domain": "D4", "new": false, "why": "Más complejidad suele implicar menos interpretabilidad.", "id": "sim01-56", "n": 56, "en": {"text": "Which statement describes the <strong>trade-off between interpretability and performance<\/strong>?", "options": [{"id": "A", "text": "Simple models are always more accurate."}, {"id": "B", "text": "Deep learning is fully interpretable."}, {"id": "C", "text": "More complex models are usually more accurate but less interpretable."}, {"id": "D", "text": "Interpretability does not matter in regulated industries."}]}}, {"text": "Al usar Amazon Bedrock, ¿cuál de estas tareas es responsabilidad <strong>del cliente<\/strong>?", "options": [{"id": "A", "text": "Parchear los servidores de inferencia"}, {"id": "B", "text": "Configurar los permisos IAM sobre quién puede invocar cada modelo"}, {"id": "C", "text": "Mantener la seguridad física de los centros de datos"}, {"id": "D", "text": "Aislar los modelos de los proveedores"}], "answer": ["B"], "domain": "D5", "new": false, "why": "IAM, datos y configuración son siempre responsabilidad del cliente.", "id": "sim01-57", "n": 57, "en": {"text": "When you use Amazon Bedrock, which of these tasks is the <strong>customer's<\/strong> responsibility?", "options": [{"id": "A", "text": "Patching the inference servers"}, {"id": "B", "text": "Configuring IAM permissions that control who can invoke each model"}, {"id": "C", "text": "Maintaining the physical security of the data centers"}, {"id": "D", "text": "Isolating the models from the model providers"}]}}, {"text": "Una aplicación en subredes privadas <strong>sin acceso a Internet<\/strong> debe invocar Bedrock. ¿Qué solución es la adecuada?", "options": [{"id": "A", "text": "Interface VPC endpoint (AWS PrivateLink) para <code>bedrock-runtime<\/code>"}, {"id": "B", "text": "Internet Gateway"}, {"id": "C", "text": "Gateway endpoint de Amazon S3"}, {"id": "D", "text": "AWS Direct Connect"}], "answer": ["A"], "domain": "D5", "new": false, "why": "Acceso privado → PrivateLink.", "id": "sim01-58", "n": 58, "en": {"text": "An application in private subnets <strong>without internet access<\/strong> must invoke Amazon Bedrock. Which solution is appropriate?", "options": [{"id": "A", "text": "An interface VPC endpoint (AWS PrivateLink) for <code>bedrock-runtime<\/code>"}, {"id": "B", "text": "An internet gateway"}, {"id": "C", "text": "An Amazon S3 gateway endpoint"}, {"id": "D", "text": "AWS Direct Connect"}]}}, {"text": "El equipo de auditoría necesita saber <strong>qué identidad<\/strong> invocó un modelo de Bedrock, cuándo y desde qué IP. ¿Qué servicio lo registra?", "options": [{"id": "A", "text": "Amazon CloudWatch Metrics"}, {"id": "B", "text": "AWS Config"}, {"id": "C", "text": "AWS CloudTrail"}, {"id": "D", "text": "Amazon Inspector"}], "answer": ["C"], "domain": "D5", "new": false, "why": "Quién/cuándo/desde dónde → CloudTrail.", "id": "sim01-59", "n": 59, "en": {"text": "The audit team needs to know <strong>which identity<\/strong> invoked an Amazon Bedrock model, when, and from which IP address. Which service records this?", "options": [{"id": "A", "text": "Amazon CloudWatch metrics"}, {"id": "B", "text": "AWS Config"}, {"id": "C", "text": "AWS CloudTrail"}, {"id": "D", "text": "Amazon Inspector"}]}}, {"text": "Por cumplimiento normativo, hay que conservar el <strong>texto de los prompts y de las respuestas<\/strong> del modelo. ¿Qué se debe habilitar?", "options": [{"id": "A", "text": "AWS CloudTrail"}, {"id": "B", "text": "Amazon Bedrock Model Invocation Logging"}, {"id": "C", "text": "AWS Trusted Advisor"}, {"id": "D", "text": "VPC Flow Logs"}], "answer": ["B"], "domain": "D5", "new": false, "why": "Contenido de prompts y respuestas → Model Invocation Logging.", "id": "sim01-60", "n": 60, "en": {"text": "For regulatory compliance, the <strong>text of the prompts and the responses<\/strong> of the model must be retained. What should be enabled?", "options": [{"id": "A", "text": "AWS CloudTrail"}, {"id": "B", "text": "Amazon Bedrock model invocation logging"}, {"id": "C", "text": "AWS Trusted Advisor"}, {"id": "D", "text": "VPC Flow Logs"}]}}, {"text": "Hay que clasificar <strong>5 millones de documentos históricos<\/strong> con un FM durante el próximo mes, sin requisito de tiempo real y al <strong>menor costo<\/strong>. ¿Qué opción es la adecuada?", "options": [{"id": "A", "text": "On-Demand"}, {"id": "B", "text": "Provisioned Throughput con compromiso de 6 meses"}, {"id": "C", "text": "Cross-region inference"}, {"id": "D", "text": "Batch inference"}], "answer": ["D"], "domain": "D5", "new": false, "why": "Masivo, no urgente, barato → Batch inference.", "id": "sim01-61", "n": 61, "en": {"text": "A company must classify <strong>5 million historical documents<\/strong> with an FM over the next month. There is no real-time requirement, and the goal is the <strong>LOWEST cost<\/strong>. Which option is appropriate?", "options": [{"id": "A", "text": "On-Demand"}, {"id": "B", "text": "Provisioned Throughput with a 6-month commitment"}, {"id": "C", "text": "Cross-Region inference"}, {"id": "D", "text": "Batch inference"}]}}, {"text": "Una empresa necesita <strong>rendimiento garantizado y sin throttling<\/strong> para un modelo ajustado (fine-tuned) en Bedrock con tráfico alto y estable. ¿Qué opción debe contratar?", "options": [{"id": "A", "text": "Provisioned Throughput"}, {"id": "B", "text": "On-Demand"}, {"id": "C", "text": "Batch inference"}, {"id": "D", "text": "Prompt caching"}], "answer": ["A"], "domain": "D5", "new": false, "why": "Rendimiento garantizado / modelo personalizado → Provisioned Throughput.", "id": "sim01-62", "n": 62, "en": {"text": "A company needs <strong>guaranteed throughput with no throttling<\/strong> for a fine-tuned model on Amazon Bedrock with high, steady traffic. Which option should the company purchase?", "options": [{"id": "A", "text": "Provisioned Throughput"}, {"id": "B", "text": "On-Demand"}, {"id": "C", "text": "Batch inference"}, {"id": "D", "text": "Prompt caching"}]}}, {"text": "Un agente de atención al cliente puede emitir reembolsos. La empresa debe garantizar que el agente <strong>nunca<\/strong> pueda ejecutar reembolsos superiores a 500 USD, <strong>aunque sufra un ataque de prompt injection<\/strong>. ¿Qué solución es la adecuada?", "options": [{"id": "A", "text": "Añadir la regla al system prompt del agente"}, {"id": "B", "text": "Aumentar la temperatura"}, {"id": "C", "text": "Policy in AgentCore con políticas deterministas (Cedar) aplicadas a las llamadas a herramientas en AgentCore Gateway"}, {"id": "D", "text": "Una alarma de CloudWatch"}], "answer": ["C"], "domain": "D5", "new": true, "why": "La autorización determinista fuera del LLM no se puede saltar con prompt injection (5.1.1).", "id": "sim01-63", "n": 63, "en": {"text": "A customer service agent can issue refunds. The company must guarantee that the agent can <strong>never<\/strong> issue refunds over USD 500, <strong>even if it suffers a prompt injection attack<\/strong>. Which solution is appropriate?", "options": [{"id": "A", "text": "Add the rule to the agent's system prompt"}, {"id": "B", "text": "Increase the temperature"}, {"id": "C", "text": "Policy in Amazon Bedrock AgentCore with deterministic (Cedar) policies applied to tool calls in AgentCore Gateway"}, {"id": "D", "text": "An Amazon CloudWatch alarm"}]}}, {"text": "Un agente debe acceder al calendario y al CRM del usuario <strong>en su nombre<\/strong> mediante OAuth, sin guardar secretos en el código. ¿Qué servicio gestiona estas credenciales?", "options": [{"id": "A", "text": "Amazon Bedrock AgentCore Identity"}, {"id": "B", "text": "Amazon Inspector"}, {"id": "C", "text": "Un bucket S3 con las claves"}, {"id": "D", "text": "AWS Shield"}], "answer": ["A"], "domain": "D5", "new": true, "why": "Credenciales OAuth del agente → AgentCore Identity.", "id": "sim01-64", "n": 64, "en": {"text": "An agent must access the user's calendar and CRM <strong>on the user's behalf<\/strong> through OAuth, without storing secrets in the code. Which service manages these credentials?", "options": [{"id": "A", "text": "Amazon Bedrock AgentCore Identity"}, {"id": "B", "text": "Amazon Inspector"}, {"id": "C", "text": "An S3 bucket that holds the keys"}, {"id": "D", "text": "AWS Shield"}]}}, {"text": "Elige <strong>DOS<\/strong> técnicas para <strong>detectar alucinaciones<\/strong> en una aplicación RAG.", "options": [{"id": "A", "text": "El <em>contextual grounding check<\/em> de Amazon Bedrock Guardrails"}, {"id": "B", "text": "Aumentar la temperatura"}, {"id": "C", "text": "Validar la salida contra un esquema JSON y reglas de negocio"}, {"id": "D", "text": "Desactivar el logging"}, {"id": "E", "text": "Eliminar las citas de las respuestas"}], "answer": ["A", "C"], "domain": "D5", "new": true, "why": "Grounding check + validación de la salida (5.1.5).", "id": "sim01-65", "n": 65, "en": {"text": "Which <strong>TWO<\/strong> techniques help <strong>detect hallucinations<\/strong> in a RAG application? (Select TWO.)", "options": [{"id": "A", "text": "The contextual grounding check in Amazon Bedrock Guardrails"}, {"id": "B", "text": "Increasing the temperature"}, {"id": "C", "text": "Validating the output against a JSON schema and business rules"}, {"id": "D", "text": "Turning off logging"}, {"id": "E", "text": "Removing citations from the responses"}]}}]}, {"id": "sim02", "name": "Simulacro 02", "questions": [{"text": "¿Cuál es el orden correcto de las fases del ciclo de vida de ML?", "options": [{"id": "A", "text": "Preparación de datos → Recolección → Entrenamiento → Despliegue → Evaluación → Monitoreo"}, {"id": "B", "text": "Recolección → Entrenamiento → Preparación de datos → Evaluación → Monitoreo → Despliegue"}, {"id": "C", "text": "Recolección → Preparación de datos → Entrenamiento → Evaluación → Despliegue → Monitoreo"}, {"id": "D", "text": "Entrenamiento → Recolección → Evaluación → Preparación de datos → Despliegue → Monitoreo"}], "answer": ["C"], "domain": "D1", "new": false, "why": "Recolección → preparación → entrenamiento → evaluación → despliegue → monitoreo.", "id": "sim02-1", "n": 1, "en": {"text": "What is the correct order of the phases of the ML lifecycle?", "options": [{"id": "A", "text": "Data preparation → Data collection → Training → Deployment → Evaluation → Monitoring"}, {"id": "B", "text": "Data collection → Training → Data preparation → Evaluation → Monitoring → Deployment"}, {"id": "C", "text": "Data collection → Data preparation → Training → Evaluation → Deployment → Monitoring"}, {"id": "D", "text": "Training → Data collection → Evaluation → Data preparation → Deployment → Monitoring"}]}}, {"text": "Una aseguradora quiere predecir el <strong>importe en dólares<\/strong> que costará cada siniestro. ¿Qué tipo de problema es?", "options": [{"id": "A", "text": "Clasificación binaria"}, {"id": "B", "text": "Clustering"}, {"id": "C", "text": "Aprendizaje por refuerzo"}, {"id": "D", "text": "Regresión"}], "answer": ["D"], "domain": "D1", "new": false, "why": "Valor numérico continuo → regresión.", "id": "sim02-2", "n": 2, "en": {"text": "An insurance company wants to predict the <strong>dollar amount<\/strong> that each claim will cost. What type of problem is this?", "options": [{"id": "A", "text": "Binary classification"}, {"id": "B", "text": "Clustering"}, {"id": "C", "text": "Reinforcement learning"}, {"id": "D", "text": "Regression"}]}}, {"text": "En un dataset de transacciones, solo el 0,2 % son fraudulentas. El equipo debe comparar varios modelos con una sola métrica que equilibre falsos positivos y falsos negativos. ¿Cuál debe usar?", "options": [{"id": "A", "text": "F1-score"}, {"id": "B", "text": "Exactitud (accuracy)"}, {"id": "C", "text": "MAE"}, {"id": "D", "text": "R²"}], "answer": ["A"], "domain": "D1", "new": false, "why": "Clases muy desbalanceadas + equilibrio FP/FN → F1.", "id": "sim02-3", "n": 3, "en": {"text": "In a transaction dataset, only 0.2% of the transactions are fraudulent. The team must compare several models with a single metric that balances false positives and false negatives. Which metric should the team use?", "options": [{"id": "A", "text": "F1 score"}, {"id": "B", "text": "Accuracy"}, {"id": "C", "text": "MAE"}, {"id": "D", "text": "R²"}]}}, {"text": "Un robot de almacén aprende las mejores rutas recibiendo recompensas cuando entrega a tiempo y penalizaciones cuando choca. ¿Qué tipo de aprendizaje es?", "options": [{"id": "A", "text": "Aprendizaje supervisado"}, {"id": "B", "text": "Aprendizaje por refuerzo"}, {"id": "C", "text": "Aprendizaje no supervisado"}, {"id": "D", "text": "Aprendizaje semi-supervisado"}], "answer": ["B"], "domain": "D1", "new": false, "why": "Recompensas y penalizaciones → refuerzo.", "id": "sim02-4", "n": 4, "en": {"text": "A warehouse robot learns the best routes by receiving rewards when it delivers on time and penalties when it collides. What type of learning is this?", "options": [{"id": "A", "text": "Supervised learning"}, {"id": "B", "text": "Reinforcement learning"}, {"id": "C", "text": "Unsupervised learning"}, {"id": "D", "text": "Semi-supervised learning"}]}}, {"text": "¿Cuál es el propósito principal del conjunto de <strong>validación<\/strong>?", "options": [{"id": "A", "text": "Estimar el rendimiento final del modelo una única vez"}, {"id": "B", "text": "Almacenar las features para inferencia en tiempo real"}, {"id": "C", "text": "Ajustar hiperparámetros y comparar modelos durante el desarrollo"}, {"id": "D", "text": "Entrenar los pesos del modelo"}], "answer": ["C"], "domain": "D1", "new": false, "why": "Validación = ajuste de hiperparámetros; el test se usa una sola vez al final.", "id": "sim02-5", "n": 5, "en": {"text": "What is the main purpose of the <strong>validation<\/strong> set?", "options": [{"id": "A", "text": "To estimate the final performance of the model one time"}, {"id": "B", "text": "To store features for real-time inference"}, {"id": "C", "text": "To tune hyperparameters and compare models during development"}, {"id": "D", "text": "To train the model weights"}]}}, {"text": "Varios equipos necesitan reutilizar <strong>las mismas features<\/strong>, de forma consistente, tanto en el entrenamiento como en la inferencia en tiempo real. ¿Qué servicio deben usar?", "options": [{"id": "A", "text": "Amazon SageMaker Data Wrangler"}, {"id": "B", "text": "Amazon SageMaker Feature Store"}, {"id": "C", "text": "Amazon SageMaker Ground Truth"}, {"id": "D", "text": "Amazon SageMaker Clarify"}], "answer": ["B"], "domain": "D1", "new": false, "why": "Features compartidas y consistentes online/offline → Feature Store.", "id": "sim02-6", "n": 6, "en": {"text": "Several teams need to reuse <strong>the same features<\/strong> consistently for both training and real-time inference. Which service should they use?", "options": [{"id": "A", "text": "Amazon SageMaker Data Wrangler"}, {"id": "B", "text": "Amazon SageMaker Feature Store"}, {"id": "C", "text": "Amazon SageMaker Ground Truth"}, {"id": "D", "text": "Amazon SageMaker Clarify"}]}}, {"text": "Un equipo de <strong>data scientists<\/strong> quiere AutoML que genere automáticamente modelos candidatos y les permita revisar los notebooks y pipelines generados. ¿Qué servicio encaja mejor?", "options": [{"id": "A", "text": "Amazon SageMaker Canvas"}, {"id": "B", "text": "Amazon SageMaker Ground Truth Plus"}, {"id": "C", "text": "Amazon SageMaker Model Monitor"}, {"id": "D", "text": "Amazon SageMaker Autopilot"}], "answer": ["D"], "domain": "D1", "new": false, "why": "AutoML con visibilidad para data scientists → Autopilot (Canvas es para analistas sin código).", "id": "sim02-7", "n": 7, "en": {"text": "A team of <strong>data scientists<\/strong> wants AutoML that automatically generates candidate models and lets them review the generated notebooks and pipelines. Which service fits BEST?", "options": [{"id": "A", "text": "Amazon SageMaker Canvas"}, {"id": "B", "text": "Amazon SageMaker Ground Truth Plus"}, {"id": "C", "text": "Amazon SageMaker Model Monitor"}, {"id": "D", "text": "Amazon SageMaker Autopilot"}]}}, {"text": "Una fábrica quiere predecir averías a partir de <strong>lecturas numéricas de sensores<\/strong>, con millones de predicciones al día, latencia de milisegundos y bajo costo. ¿Qué enfoque es el más adecuado?", "options": [{"id": "A", "text": "Un modelo de ML tradicional entrenado y desplegado en Amazon SageMaker AI"}, {"id": "B", "text": "Un LLM de Amazon Bedrock con un prompt por cada lectura"}, {"id": "C", "text": "Amazon Lex"}, {"id": "D", "text": "Amazon Q Business"}], "answer": ["A"], "domain": "D1", "new": true, "why": "Datos numéricos, alto volumen, baja latencia y bajo costo → ML tradicional (1.2.6).", "id": "sim02-8", "n": 8, "en": {"text": "A factory wants to predict equipment failures from <strong>numeric sensor readings<\/strong>, with millions of predictions each day, millisecond latency, and low cost. Which approach is MOST appropriate?", "options": [{"id": "A", "text": "A traditional ML model trained and deployed on Amazon SageMaker AI"}, {"id": "B",
